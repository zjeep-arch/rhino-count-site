<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>{{TITLE}} · AI日报 · 犀牛伯爵</title>
  <meta name="description" content="{{EXCERPT}}" />
  <meta name="author" content="犀牛伯爵" />
  <meta name="robots" content="index,follow" />

  <!-- ⚠️ SEO 硬约束：canonical/og:url/JSON-LD 的 URL 一律用 https://rhinocount.cn，
       绝对禁止出现 zjeep-arch.github.io（旧 GitHub Pages 地址，2026-08~09 三轮污染复发的根因） -->
  <link rel="canonical" href="https://rhinocount.cn/ai-daily/{{FILENAME}}" />

  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}} · AI日报" />
  <meta property="og:description" content="{{EXCERPT}}" />
  <meta property="og:url" content="https://rhinocount.cn/ai-daily/{{FILENAME}}" />
  <meta property="og:image" content="https://rhinocount.cn/assets/og-card.svg" />
  <meta property="og:site_name" content="犀牛伯爵" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="article:published_time" content="{{DATE}}" />
  <meta property="article:author" content="犀牛伯爵" />
  <meta property="bytedance:published_time" content="{{DATE}}T09:00:00+08:00" />
  <meta property="bytedance:updated_time" content="{{DATE}}T09:00:00+08:00" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{TITLE}} · AI日报",
    "description": "{{EXCERPT}}",
    "url": "https://rhinocount.cn/ai-daily/{{FILENAME}}",
    "image": "https://rhinocount.cn/assets/og-card.svg",
    "author": { "@type": "Organization", "name": "犀牛伯爵", "url": "https://rhinocount.cn" },
    "publisher": { "@type": "Organization", "name": "犀牛伯爵", "url": "https://rhinocount.cn" },
    "mainEntityOfPage": { "@type": "WebPage", "@id": "https://rhinocount.cn/ai-daily/{{FILENAME}}" },
    "datePublished": "{{DATE}}",
    "dateModified": "{{DATE}}"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #F5EFE6; --bg-soft: #ECE3D2; --surface: #FBF7EE;
      --ink: #1C1410; --ink-soft: #3B2E24; --muted: #7A6B5B;
      --line: rgba(28,20,16,0.10); --line-2: rgba(28,20,16,0.22);
      --accent: #8B3A2E; --gold: #B8862F;
      --cat-accent: #2563eb;
      --serif: "Playfair Display","Noto Serif SC","Songti SC",Georgia,serif;
      --sans: "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --maxw: 740px; --pad: clamp(20px,4vw,32px);
      --radius: 14px; --radius-sm: 10px;
      --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:64px;
    }
    [data-theme="dark"] {
      --bg: #14100C; --bg-soft: #1A1510; --surface: #1F1813;
      --ink: #F1E8DA; --ink-soft: #DCCEB8; --muted: #9B8B77;
      --line: rgba(241,232,218,0.10); --line-2: rgba(241,232,218,0.22);
      --accent: #D4825F; --gold: #E8C77A;
      --cat-accent: #60a5fa;
    }
    *,*::before,*::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 17px; line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content:"";position:fixed;inset:0;
      background-image:radial-gradient(700px 400px at 10% 0%,rgba(184,134,47,0.06),transparent 60%);
      pointer-events:none;z-index:0;
    }
    .container { max-width: var(--maxw); margin-inline: auto; padding-inline: var(--pad); position: relative; z-index: 1; }

    .article-header {
      padding: var(--s-8) 0 var(--s-6);
      border-bottom: 1px solid var(--line);
      margin-bottom: var(--s-7);
    }
    .article-header .back {
      display: inline-flex; align-items: center; gap: var(--s-2);
      font-size: 13px; color: var(--cat-accent); font-weight: 500;
      margin-bottom: var(--s-5);
      transition: gap 0.2s ease;
    }
    .article-header .back:hover { gap: var(--s-3); }
    .article-header .meta {
      display: flex; align-items: center; gap: var(--s-3);
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted); margin-bottom: var(--s-4);
    }
    .article-header .meta .cat {
      color: var(--cat-accent); font-weight: 600;
      background: color-mix(in srgb, var(--cat-accent) 10%, transparent);
      padding: 2px 10px; border-radius: 20px;
      letter-spacing: 0.04em;
    }
    .article-header .meta .date::before { content: "\00B7"; margin-right: var(--s-3); }
    .article-header h1 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(26px,4vw,40px); line-height: 1.2;
      margin: 0; letter-spacing: 0.01em;
    }

    .article-body {
      padding-bottom: var(--s-8);
    }
    .article-body p {
      margin: 0 0 1.4em;
    }

    /* ===== Section h2 with category pill ===== */
    .article-body h2 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(20px,2.5vw,26px);
      margin: 2.8em 0 1.2em; line-height: 1.3;
      padding-top: var(--s-6);
      border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: var(--s-3);
    }
    .article-body h2::before {
      content: attr(data-section);
      display: inline-block;
      font-family: var(--sans); font-weight: 600;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--cat-accent);
      background: color-mix(in srgb, var(--cat-accent) 10%, transparent);
      padding: 2px 10px; border-radius: 20px;
      white-space: nowrap; flex-shrink: 0;
      line-height: 1.5;
    }
    .article-body h2:first-child { border-top: none; padding-top: 0; margin-top: 0; }

    /* ===== Data Highlights: Grid cards under "今日数据亮点" h2 ===== */
    .article-body .data-highlights {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s-3);
      margin-bottom: var(--s-6);
    }
    .article-body .data-highlights p {
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: var(--s-4);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .article-body .data-highlights p:hover {
      border-color: var(--line-2);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .article-body .data-highlights strong {
      display: block;
      font-size: clamp(20px,2.5vw,28px);
      font-weight: 800;
      color: var(--accent);
      margin-bottom: var(--s-1);
      letter-spacing: -0.01em;
    }
    @media (max-width: 520px) {
      .article-body .data-highlights { grid-template-columns: 1fr; }
    }

    /* ===== Insight cards: h3 + p + blockquote under "今日洞察" h2 ===== */
    .article-body .insight-card {
      background: var(--surface);
      border-left: 3px solid var(--cat-accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: var(--s-5);
      margin-bottom: var(--s-4);
      transition: box-shadow 0.2s ease;
    }
    .article-body .insight-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .article-body .insight-card h3 {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(16px,1.8vw,19px);
      margin: 0 0 var(--s-3); line-height: 1.4;
      color: var(--ink);
    }
    .article-body .insight-card p {
      margin: 0 0 var(--s-3);
      font-size: 15px; color: var(--ink-soft); line-height: 1.7;
    }
    .article-body .insight-card blockquote {
      margin: 0;
      padding: var(--s-3) var(--s-4);
      background: color-mix(in srgb, var(--cat-accent) 6%, transparent);
      border-left: none;
      border-radius: var(--radius-sm);
      font-style: normal;
      font-size: 14px;
      color: var(--ink-soft);
    }

    /* ===== News items: h3 entries with separator ===== */
    .article-body .news-item {
      padding: var(--s-4) 0;
      border-bottom: 1px solid var(--line);
    }
    .article-body .news-item:last-child { border-bottom: none; }
    .article-body .news-item h3 a {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .article-body .news-item h3 a:hover {
      color: var(--cat-accent);
    }
    .article-body .news-item h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 var(--s-2) 0;
      line-height: 1.45;
    }
    .article-body .news-item p {
      margin: 0;
      font-size: 15px; color: var(--ink-soft); line-height: 1.7;
    }

    /* ===== Competitor pill badges in "友商雷达" ===== */
    .article-body .competitor-badge {
      display: inline-block;
      font-family: var(--sans); font-weight: 600;
      font-size: 12px;
      color: var(--cat-accent);
      background: color-mix(in srgb, var(--cat-accent) 10%, transparent);
      padding: 2px 10px; border-radius: 20px;
      margin-right: var(--s-1);
      vertical-align: middle;
      line-height: 1.5;
    }

    /* ===== Default h3 / blockquote (fallback) ===== */
    .article-body h3 {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(17px,1.8vw,20px);
      margin: 1.6em 0 0.6em;
    }
    .article-body blockquote {
      margin: 1.5em 0; padding: var(--s-4) var(--s-5);
      border-left: 3px solid var(--accent);
      background: var(--surface);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--ink-soft);
      font-style: italic;
    }
    .article-body strong { color: var(--ink); font-weight: 600; }
    .article-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

    .article-footer {
      border-top: 1px solid var(--line);
      padding: var(--s-6) 0 var(--s-8);
      text-align: center;
    }
    .article-footer .disclaimer {
      font-size: 13px; color: var(--muted);
      line-height: 1.8; font-style: italic;
    }
    .article-footer .back-link {
      display: inline-flex; align-items: center; gap: var(--s-2);
      margin-top: var(--s-5);
      font-size: 13px; color: var(--cat-accent); font-weight: 500;
    }

    .giscus-wrapper {
      max-width: var(--maxw);
      margin-inline: auto;
      padding-inline: var(--pad);
      padding-bottom: var(--s-7);
    }

    .site-footer {
      border-top: 1px solid var(--line);
      padding: var(--s-5) 0;
      text-align: center;
      font-size: 12px; color: var(--muted);
    }

    @media (max-width: 520px) {
      body { font-size: 16px; }
      .article-body .insight-card { padding: var(--s-4); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation:none!important; transition:none!important; }
    }
  </style>
</head>
<body>
  <article class="container">
    <header class="article-header">
      <a class="back" href="./">&larr; AI日报</a>
      <div class="meta">
        <span class="cat">{{CATEGORY}}</span>
        <span class="date">{{DATE}}</span>
      </div>
      <h1>{{TITLE}}</h1>
    </header>

    <div class="article-body">
{{CONTENT}}
    </div>

    <div class="giscus-wrapper">
      <div class="giscus"></div>
    </div>

    <footer class="article-footer">
      <p class="disclaimer">
        {{DISCLAIMER}}
      </p>
      <a class="back-link" href="../">&larr; 回到犀牛伯爵首页</a>
    </footer>
  </article>

  <footer class="site-footer">
    <div class="container">&copy; 2026 犀牛伯爵</div>
  </footer>

  <script>
    // Theme sync with main site
    (function() {
      var root = document.documentElement;
      var saved = localStorage.getItem('rhino-theme');
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved) { root.setAttribute('data-theme', saved); }
      else if (sysDark) { root.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <script src="https://giscus.app/client.js"
    data-repo="zjeep-arch/rhino-count-site"
    data-repo-id="R_kgDOOZx3aA"
    data-category="Announcements"
    data-category-id="DIC_kwDOOZx3aM4CqRVM"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    crossorigin="anonymous"
    async>
  </script>
</body>
</html>
