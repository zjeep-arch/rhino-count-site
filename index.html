  <style>
    /* =========================================================
     * Design tokens
     * ========================================================= */
    :root {
      --s-1: 4px;  --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
      --s-5: 24px; --s-6: 32px;  --s-7: 48px;  --s-8: 64px;
      --s-9: 80px; --s-10: 96px; --s-11: 120px;

      --maxw: 1180px;
      --pad: clamp(20px, 4vw, 32px);
      --radius: 14px;
      --radius-sm: 10px;

      /* light palette */
      --bg: #F5EFE6;
      --bg-soft: #ECE3D2;
      --surface: #FBF7EE;
      --ink: #1C1410;
      --ink-soft: #3B2E24;
      --muted: #7A6B5B;
      --line: rgba(28, 20, 16, 0.10);
      --line-2: rgba(28, 20, 16, 0.22);
      --accent: #8B3A2E;
      --gold: #B8862F;
      --shadow-1: 0 1px 0 rgba(28,20,16,0.04);
      --shadow-2: 0 24px 60px -30px rgba(28,20,16,0.28);

      --serif: "Playfair Display", "Noto Serif SC", "Songti SC", Georgia, serif;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #14100C;
      --bg-soft: #1A1510;
      --surface: #1F1813;
      --ink: #F1E8DA;
      --ink-soft: #DCCEB8;
      --muted: #9B8B77;
      --line: rgba(241, 232, 218, 0.10);
      --line-2: rgba(241, 232, 218, 0.22);
      --accent: #D4825F;
      --gold: #E8C77A;
      --shadow-1: 0 1px 0 rgba(0,0,0,0.5);
      --shadow-2: 0 28px 70px -30px rgba(0,0,0,0.65);
    }

    /* =========================================================
     * Reset
     * ========================================================= */
    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    ::selection { background: var(--accent); color: var(--bg); }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(900px 500px at 90% -10%, rgba(184,134,47,0.10), transparent 60%),
        radial-gradient(700px 400px at -10% 25%, rgba(139,58,46,0.08), transparent 60%);
      pointer-events: none; z-index: 0;
    }
    [data-theme="dark"] body::before {
      background-image:
        radial-gradient(900px 500px at 90% -10%, rgba(232,199,122,0.08), transparent 60%),
        radial-gradient(700px 400px at -10% 25%, rgba(212,130,95,0.07), transparent 60%);
    }

    .container {
      max-width: var(--maxw);
      margin-inline: auto;
      padding-inline: var(--pad);
      position: relative;
      z-index: 1;
    }

    /* =========================================================
     * Header
     * ========================================================= */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: var(--header-bg, rgba(245, 239, 230, 0.92));
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }
    [data-theme="dark"] .site-header {
      background: rgba(20, 16, 12, 0.92);
    }
    @supports (background: color-mix(in oklab, red, blue)) {
      .site-header { background: color-mix(in oklab, var(--bg) 88%, transparent); }
    }
    .nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--s-5);
      min-height: 68px;
      padding-block: 12px;
    }
    .brand {
      display: inline-flex; align-items: baseline; gap: var(--s-2);
      font-family: var(--serif); font-weight: 700;
      font-size: 18px; letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .brand .badge {
      font-family: var(--sans); font-size: 10px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted);
      padding: 3px var(--s-2);
      border: 1px solid var(--line-2); border-radius: 999px;
    }
    .nav-links {
      display: flex; justify-content: center; gap: var(--s-6);
    }
    .nav-links a {
      font-size: 14px; color: var(--ink-soft);
      padding: var(--s-2) 0; position: relative;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 2px;
      height: 1px; background: var(--ink);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.3s ease;
    }
    .nav-links a:hover::after { transform: scaleX(1); }

    .nav-actions { display: flex; align-items: center; gap: var(--s-2); }
    .btn {
      display: inline-flex; align-items: center; gap: var(--s-2);
      padding: 10px 18px; font-size: 13px; font-weight: 500;
      border-radius: 999px; border: 1px solid var(--ink);
      background: var(--ink); color: var(--bg);
      transition: transform 0.2s ease, opacity 0.2s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
    .btn.ghost:hover { border-color: var(--ink); }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 999px;
      border: 1px solid var(--line-2);
      display: inline-grid; place-items: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .icon-btn:hover { background: var(--bg-soft); border-color: var(--ink); }
    .icon-btn svg { width: 18px; height: 18px; }
    .menu-btn { display: none; }

    .mobile-panel {
      position: fixed; left: 0; right: 0;
      top: 68px; bottom: 0;
      z-index: 49;
      background: var(--bg);
      padding: var(--s-6) var(--pad);
      transform: translateY(-110%);
      transition: transform 0.35s ease;
      border-top: 1px solid var(--line);
      overflow-y: auto;
    }
    .mobile-panel.open { transform: translateY(0); }
    .mobile-panel a {
      display: block;
      padding: var(--s-4) 0;
      border-bottom: 1px solid var(--line);
      font-family: var(--serif); font-size: 22px;
    }

    /* =========================================================
     * Section scaffolding
     * ========================================================= */
    section {
      padding-block: var(--s-10);
      position: relative;
    }
    section + section { border-top: 1px solid var(--line); }

    .section-head {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--s-4);
      margin-bottom: var(--s-8);
    }
    @media (min-width: 880px) {
      .section-head {
        grid-template-columns: 1.4fr 1fr;
        align-items: end;
        gap: var(--s-8);
      }
    }
    .section-head .label {
      font-size: 11px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: var(--s-3);
    }
    .section-head h2 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(28px, 5vw, 54px);
      line-height: 1.1; letter-spacing: -0.01em;
      margin: 0;
    }
    .section-head .blurb {
      color: var(--muted);
      font-size: 14px; line-height: 1.75;
      max-width: 420px;
      margin: 0;
    }

    /* =========================================================
     * Hero
     * ========================================================= */
    .hero {
      padding-top: var(--s-9);
      padding-bottom: var(--s-10);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--s-8);
      align-items: center;
    }
    @media (min-width: 880px) {
      .hero-grid {
        grid-template-columns: 1.1fr 0.9fr;
        gap: clamp(40px, 6vw, 80px);
      }
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: var(--s-3);
      font-size: 11px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: var(--s-5);
    }
    .eyebrow::before {
      content: ""; width: 28px; height: 1px; background: var(--ink-soft);
    }
    h1.hero-title {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(34px, 7.5vw, 84px);
      line-height: 1.05; letter-spacing: -0.012em;
      margin: 0 0 var(--s-5);
      word-break: keep-all;
    }
    h1.hero-title .accent {
      display: block;
      color: var(--accent);
      font-style: italic;
      font-weight: 500;
    }
    .hero-lede {
      font-size: clamp(15px, 1.4vw, 17px);
      line-height: 1.8; color: var(--ink-soft);
      max-width: 540px;
      margin: 0 0 var(--s-7);
    }
    .cta-row {
      display: flex; flex-wrap: wrap;
      gap: var(--s-3);
      margin-bottom: var(--s-8);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s-4);
      max-width: 480px;
    }
    .stat {
      display: flex; flex-direction: column; gap: var(--s-1);
      padding-left: var(--s-4);
      border-left: 1px solid var(--line-2);
    }
    .stat:first-child { padding-left: 0; border-left: 0; }
    .stat .num {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(24px, 3.5vw, 36px); line-height: 1;
      color: var(--ink);
    }
    .stat .lbl {
      font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
    }

    .portrait-wrap {
      position: relative;
      max-width: 480px;
      margin-inline: auto;
      width: 100%;
    }
    .portrait-frame {
      position: relative;
      aspect-ratio: 4 / 5;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-soft);
      border: 1px solid var(--line-2);
      box-shadow: var(--shadow-1), var(--shadow-2);
    }
    .portrait-frame img {
      width: 100%; height: 100%; object-fit: cover;
      filter: saturate(0.95) contrast(1.02);
    }
    .portrait-caption {
      position: absolute;
      left: 18px; bottom: 18px;
      font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
      color: #F5EFE6;
      background: rgba(28,20,16,0.65);
      padding: 7px 12px; border-radius: 999px;
      backdrop-filter: blur(6px);
    }

    /* =========================================================
     * Profile
     * ========================================================= */
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .profile-cell {
      background: var(--surface);
      padding: var(--s-6) var(--s-5);
    }
    .profile-cell .k {
      font-size: 11px; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: var(--s-3);
    }
    .profile-cell .v {
      font-family: var(--serif);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.35;
      color: var(--ink);
    }

    /* =========================================================
     * Journal cards
     * ========================================================= */
    .journal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--s-5);
    }
    .note {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0;
      display: flex; flex-direction: column;
      gap: 0;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      min-height: 240px;
    }
    .note-cover {
      width: 100%;
      aspect-ratio: 400 / 260;
      overflow: hidden;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--line);
    }
    .note-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .note-body {
      padding: var(--s-6);
      display: flex; flex-direction: column;
      gap: var(--s-4);
      flex: 1;
    }
    .note::before {
      content: ""; position: absolute;
      left: 0; right: 0; top: 0; height: 2px;
      background: var(--accent);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.4s ease;
    }
    .note:hover {
      transform: translateY(-3px);
      border-color: var(--line-2);
      box-shadow: var(--shadow-2);
    }
    .note:hover::before { transform: scaleX(1); }
    .note-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted);
    }
    .note-meta .cat { color: var(--accent); font-weight: 600; }
    .note h3 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(19px, 2vw, 22px);
      line-height: 1.35;
      margin: 0;
    }
    .note p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px; line-height: 1.7;
    }
    .note-cta {
      margin-top: auto;
      display: inline-flex; align-items: center; gap: var(--s-2);
      font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--ink); font-weight: 600;
    }
    .note-cta::after {
      content: "\2192";
      transition: transform 0.3s ease;
    }
    .note:hover .note-cta::after { transform: translateX(4px); }

    /* =========================================================
     * Commentary (Daily Xiaolei-style articles)
     * ========================================================= */
    .article-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--s-4);
    }
    .article-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--s-6);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--s-5);
      align-items: start;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .article-card:hover {
      transform: translateY(-2px);
      border-color: var(--line-2);
      box-shadow: var(--shadow-2);
    }
    .article-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s ease;
    }
    .article-card:hover::before { transform: scaleY(1); }
    .article-card .art-meta {
      display: flex;
      align-items: center;
      gap: var(--s-3);
      margin-bottom: var(--s-3);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .article-card .art-meta .art-cat {
      color: var(--accent);
      font-weight: 600;
    }
    .article-card .art-meta .art-date {
      color: var(--muted);
    }
    .article-card .art-meta .art-date::before {
      content: "\00B7";
      margin-right: var(--s-3);
    }
    .article-card h3 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(17px, 1.8vw, 20px);
      line-height: 1.4;
      margin: 0 0 var(--s-2);
    }
    .article-card .art-excerpt {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
      margin: 0;
    }
    .article-card .art-arrow {
      align-self: center;
      font-size: 18px;
      color: var(--muted);
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .article-card:hover .art-arrow {
      transform: translateX(4px);
      color: var(--ink);
    }
    .article-card .art-index {
      font-family: var(--serif);
      font-style: italic;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: var(--s-2);
    }
    .article-loading {
      padding: var(--s-8);
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .article-loading .loader-dot {
      display: inline-block;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .article-loading .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .article-loading .loader-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    .article-empty {
      padding: var(--s-8);
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      line-height: 2;
    }
    .commentary-footer {
      margin-top: var(--s-6);
      text-align: center;
    }
    .commentary-footer a {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: var(--s-2);
      transition: gap 0.2s ease;
    }
    .commentary-footer a:hover { gap: var(--s-3); }

    /* =========================================================
     * Quote
     * ========================================================= */
    .quote-section {
      padding-block: var(--s-11);
      text-align: center;
    }
    .quote-mark {
      font-family: var(--serif);
      font-size: clamp(60px, 8vw, 96px);
      line-height: 1;
      color: var(--accent);
      opacity: 0.35;
      margin-bottom: var(--s-4);
      user-select: none;
    }
    blockquote.pull {
      margin: 0 auto;
      max-width: 820px;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(22px, 3.5vw, 40px);
      line-height: 1.4;
      color: var(--ink);
    }
    .quote-attr {
      margin-top: var(--s-6);
      font-size: 12px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--muted);
    }

    /* =========================================================
     * Contact
     * ========================================================= */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(28px, 4vw, 48px);
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--s-5);
      align-items: center;
    }
    @media (min-width: 720px) {
      .contact-card {
        grid-template-columns: 1fr auto;
        gap: var(--s-7);
      }
    }
    .contact-card h3 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(22px, 2.4vw, 28px);
      margin: 0 0 var(--s-2);
    }
    .contact-card p {
      margin: 0; color: var(--muted); font-size: 14px;
    }
    .contact-channel {
      display: inline-flex;
      align-items: center;
      gap: var(--s-4);
      padding: var(--s-4) var(--s-5);
      border-radius: var(--radius-sm);
      border: 1px solid var(--ink);
      color: var(--ink);
      transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
      white-space: nowrap;
    }
    .contact-channel:hover {
      background: var(--ink); color: var(--bg);
      transform: translateY(-2px);
    }
    .contact-channel .ch-name { font-weight: 600; }
    .contact-channel .ch-handle {
      font-size: 12px; color: var(--muted);
      letter-spacing: 0.08em; display: block;
    }
    .contact-channel:hover .ch-handle { color: rgba(245,239,230,0.7); }

    /* =========================================================
     * Footer
     * ========================================================= */
    .site-footer {
      border-top: 1px solid var(--line);
      padding-block: var(--s-6) var(--s-7);
    }
    .foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--s-4); flex-wrap: wrap;
      font-size: 12px; color: var(--muted); letter-spacing: 0.06em;
    }

    /* =========================================================
     * Scroll-trigger fade-in
     * ========================================================= */
    .fade-in {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-in-delay-1 { transition-delay: 0.1s; }
    .fade-in-delay-2 { transition-delay: 0.2s; }
    .fade-in-delay-3 { transition-delay: 0.3s; }

    /* =========================================================
     * Back to top
     * ========================================================= */
    .subscribe-section {
      background: var(--bg-soft);
      border-top: 1px solid var(--line);
      padding: var(--s-10) 0;
      text-align: center;
    }
    .subscribe-inner {
      max-width: 480px;
      margin-inline: auto;
    }
    .subscribe-inner h2 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(24px, 3vw, 32px);
      margin: 0 0 var(--s-3);
    }
    .subscribe-inner p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 var(--s-6);
      line-height: 1.7;
    }
    .subscribe-form {
      display: flex;
      gap: var(--s-3);
      max-width: 400px;
      margin-inline: auto;
    }
    .subscribe-form input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .subscribe-form input:focus {
      border-color: var(--accent);
    }
    .subscribe-form button {
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .subscribe-form button:hover {
      opacity: 0.85;
    }
    .subscribe-note {
      font-size: 12px !important;
      color: var(--muted) !important;
      margin-top: var(--s-4) !important;
      opacity: 0.7;
    }
    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 32px;
      z-index: 40;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
      pointer-events: none;
    }
    .back-to-top.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .back-to-top:hover {
      background: var(--bg-soft);
    }
    .back-to-top svg {
      width: 18px;
      height: 18px;
    }

    /* =========================================================
     * Responsive
     * ========================================================= */
    @media (max-width: 760px) {
      .nav-links { display: none; }
      .nav-actions .btn.ghost { display: none; }
      .menu-btn { display: inline-grid; }
      .nav { grid-template-columns: auto 1fr auto; }
      .nav-links { grid-column: unset; }
    }
    @media (max-width: 640px) {
      .article-card {
        grid-template-columns: 1fr;
        gap: var(--s-3);
      }
      .article-card .art-arrow {
        display: none;
      }
    }
    @media (max-width: 520px) {
      .brand .badge { display: none; }
      .stats {
        grid-template-columns: 1fr 1fr 1fr;
        gap: var(--s-3);
      }
      .stat { padding-left: var(--s-3); }
      .stat .num { font-size: 22px; }
      .note { padding: var(--s-5); min-height: 200px; }
      .contact-channel { width: 100%; justify-content: space-between; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }

    .render-target { opacity: 0; transition: opacity 0.4s ease; }
    .render-target.ready { opacity: 1; }
    noscript .nojs {
      padding: var(--s-6); border: 1px solid var(--line-2);
      border-radius: var(--radius); margin: var(--s-5) 0;
    }
  </style>
</head>
<body>
  <noscript>
    <div class="container">
      <p class="nojs">本站使用一个 JS 文件渲染内容。请开启 JavaScript 或刷新页面。</p>
    </div>
  </noscript>

  <!-- Header -->
  <header class="site-header" id="siteHeader">
    <div class="container nav">
      <a href="#top" class="brand" id="brandLink">
        <span data-bind="brand">犀牛伯爵</span>
        <span class="badge" data-bind="badge">EST · BJ</span>
      </a>
      <nav class="nav-links" id="navLinks" aria-label="主导航">
        <a href="#profile">关于</a>
        <a href="#notes">笔记</a>
        <a href="#commentary">时评</a>
        <a href="#manifesto">主张</a>
        <a href="#subscribe">订阅</a>
        <a href="#contact">联络</a>
      </nav>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" aria-label="切换主题" title="切换日/夜">
          <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a class="btn ghost" id="headerCta" href="https://www.xiaohongshu.com/user/profile/60572004000000000101ce41" target="_blank" rel="noopener">小红书 \2192</a>
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div id="mobilePanel" class="mobile-panel" aria-hidden="true">
      <a href="#profile">关于</a>
      <a href="#notes">笔记</a>
      <a href="#commentary">时评</a>
      <a href="#manifesto">主张</a>
      <a href="#contact">联络</a>
      <a href="https://www.xiaohongshu.com/user/profile/60572004000000000101ce41" target="_blank" rel="noopener">小红书 \2192</a>
    </div>
  </header>

  <main id="top" class="render-target">
    <section class="hero" id="hero-section"></section>
    <section id="profile"></section>
    <section id="notes"></section>
    <section id="commentary"></section>
    <section id="manifesto" class="quote-section"></section>
    <section id="contact"></section>
  </main>

  <!-- Subscription -->
  <section id="subscribe" class="subscribe-section">
    <div class="container">
      <div class="subscribe-inner">
        <h2>订阅每日时评</h2>
        <p>每周 7 篇宏观闲聊，送到你的邮箱。纯属瞎扯，不垃圾、不营销。</p>
        <form class="subscribe-form" action="https://formspree.io/f/meoekkrv" method="POST">
          <input type="email" name="email" placeholder="你的邮箱" required />
          <button type="submit">订阅</button>
        </form>
        <p class="subscribe-note">每周不超过 7 封，随时可退订。</p>
      </div>
    </div>
  </section>

  <!-- Back to top -->
  <button id="backToTop" class="back-to-top" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <footer class="site-footer" id="siteFooter">
    <div class="container foot">
      <div data-bind="footerLeft">&copy; 2026 犀牛伯爵 \00B7 一切笔记，皆可咀嚼</div>
      <div data-bind="footerRight">Crafted with patience \00B7 Beijing</div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script>
    (function () {
      'use strict';
      const esc = s => String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
      ));

      /* ---------- Theme & mobile menu ---------- */
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggle');
      const sun = document.getElementById('iconSun');
      const moon = document.getElementById('iconMoon');
      const KEY = 'rhino-theme';
      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const dark = theme === 'dark';
        if (sun)  sun.style.display  = dark ? 'none' : '';
        if (moon) moon.style.display = dark ? '' : 'none';
      }
      const saved = localStorage.getItem(KEY);
      const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (sysDark ? 'dark' : 'light'));
      themeBtn && themeBtn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(KEY, next);
      });

      const menuBtn = document.getElementById('menuBtn');
      const panel = document.getElementById('mobilePanel');
      function setMenu(open) {
        panel.classList.toggle('open', open);
        menuBtn.setAttribute('aria-expanded', String(open));
        panel.setAttribute('aria-hidden', String(!open));
        document.body.style.overflow = open ? 'hidden' : '';
      }
      menuBtn && menuBtn.addEventListener('click', () => setMenu(!panel.classList.contains('open')));
      panel && panel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setMenu(false)));
      window.addEventListener('resize', () => { if (window.innerWidth > 760) setMenu(false); });

      /* ---------- Back to top ---------- */
      const backBtn = document.getElementById('backToTop');
      if (backBtn) {
        window.addEventListener('scroll', () => {
          backBtn.classList.toggle('show', window.scrollY > 400);
        }, { passive: true });
        backBtn.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      /* ---------- IntersectionObserver for fade-in ---------- */
      function observeFadeIns() {
        if (!('IntersectionObserver' in window)) return;
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
      }

      /* ---------- Render from data.js ---------- */
      const D = window.SITE_DATA;
      if (!D) {
        document.querySelector('main').innerHTML =
          '<div class="container" style="padding:60px 0">' +
          '<p style="padding:24px;border:1px solid var(--line-2);border-radius:14px;color:var(--muted)">' +
          'data.js \u6ca1\u6709\u6b63\u786e\u52a0\u8f7d\u3002\u8bf7\u786e\u8ba4 data.js \u4e0e index.html \u5728\u540c\u4e00\u76ee\u5f55\u3002' +
          '</p></div>';
        document.querySelector('main').classList.add('ready');
        return;
      }

      /* Header */
      if (D.header) {
        const setText = (sel, txt) => { const el = document.querySelector(sel); if (el && txt) el.textContent = txt; };
        setText('[data-bind="brand"]', D.header.brand);
        setText('[data-bind="badge"]', D.header.badge);
        if (D.header.nav && Array.isArray(D.header.nav)) {
          const links = document.querySelectorAll('#navLinks a');
          const mlinks = document.querySelectorAll('#mobilePanel a');
          D.header.nav.forEach((n, i) => {
            if (links[i])  { links[i].textContent = n.label;  links[i].setAttribute('href', n.href); }
            if (mlinks[i]) { mlinks[i].textContent = n.label; mlinks[i].setAttribute('href', n.href); }
          });
        }
        if (D.header.cta) {
          const cta = document.getElementById('headerCta');
          const lastMobile = document.querySelector('#mobilePanel a:last-child');
          if (cta) { cta.textContent = D.header.cta.label; cta.setAttribute('href', D.header.cta.href); }
          if (lastMobile) { lastMobile.textContent = D.header.cta.label; lastMobile.setAttribute('href', D.header.cta.href); }
        }
      }

      /* Hero */
      const h = D.hero;
      document.getElementById('hero-section').innerHTML = `
        <div class="container">
          <div class="hero-grid fade-in">
            <div>
              <div class="eyebrow fade-in fade-in-delay-1">${esc(h.eyebrow)}</div>
              <h1 class="hero-title fade-in fade-in-delay-2">
                ${esc(h.titleMain)}
                <span class="accent">${esc(h.titleAccent)}</span>
              </h1>
              <p class="hero-lede fade-in fade-in-delay-3">${esc(h.lede)}</p>
              <div class="cta-row fade-in fade-in-delay-3">
                <a class="btn" href="${esc(h.ctaPrimary.href)}">${esc(h.ctaPrimary.label)}</a>
                <a class="btn ghost" href="${esc(h.ctaSecondary.href)}">${esc(h.ctaSecondary.label)}</a>
              </div>
              <div class="stats fade-in fade-in-delay-3">
                ${h.stats.map(s => `
                  <div class="stat">
                    <span class="num">${esc(s.num)}</span>
                    <span class="lbl">${esc(s.lbl)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="portrait-wrap fade-in fade-in-delay-1">
              <div class="portrait-frame">
                <img src="${esc(h.portrait.src)}" alt="${esc(h.portrait.alt)}" width="800" height="1000" fetchpriority="high" />
                <div class="portrait-caption">${esc(h.portrait.caption)}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      /* Profile */
      const p = D.profile;
      document.getElementById('profile').innerHTML = `
        <div class="container">
          <div class="section-head fade-in">
            <div>
              <div class="label">${esc(p.label)}</div>
              <h2>${esc(p.heading)}</h2>
            </div>
            <p class="blurb">${esc(p.blurb)}</p>
          </div>
          <div class="profile-grid fade-in fade-in-delay-1">
            ${p.cells.map(c => `
              <div class="profile-cell fade-in fade-in-delay-1">
                <div class="k">${esc(c.k)}</div>
                <div class="v">${esc(c.v)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      /* Journal */
      const j = D.journal;
      document.getElementById('notes').innerHTML = `
        <div class="container">
          <div class="section-head fade-in">
            <div>
              <div class="label">${esc(j.label)}</div>
              <h2>${esc(j.headingLine1)}<br/>${esc(j.headingLine2)}</h2>
            </div>
            <p class="blurb">${esc(j.blurb)}</p>
          </div>
          <div class="journal-grid">
            ${j.notes.map((n, i) => `
              <article class="note fade-in fade-in-delay-${Math.min(i, 3)}">
                ${n.img ? `<div class="note-cover"><img src="${esc(n.img)}" alt="" loading="lazy"/></div>` : ''}
                <div class="note-body">
                  <div class="note-meta">
                    <span class="cat">${esc(n.cat)}</span>
                    <span>${esc(n.num)}</span>
                  </div>
                  <h3>${esc(n.title)}</h3>
                  <p>${esc(n.excerpt)}</p>
                  <a class="note-cta" href="${esc(n.href)}">READ</a>
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      `;

      /* Commentary — load from feed.json + fallback */
      const commentarySection = document.getElementById('commentary');
      const cm = D.commentary;

      function renderArticles(articles) {
        if (!articles || articles.length === 0) {
          return `<div class="article-empty fade-in">
            \u8fd8\u6ca1\u6709\u65f6\u8bc4\u6587\u7ae0\u3002\u6bcf\u665a 7 \u70b9\u751f\u6210\u7b2c\u4e00\u7bc7\u540e\u81ea\u52a8\u663e\u793a\u3002<br/>
            \u201c\u7eaf\u5c5e\u4e2a\u4eba\u778e\u626f\u95f2\u804a\uff0c\u4f9b\u5927\u5bb6\u6253\u53d1\u7a7a\u95f2\u65f6\u95f4\u3002\u201d
          </div>`;
        }
        return articles.map((a, i) => `
          <a class="article-card fade-in fade-in-delay-${Math.min(i, 3)}" href="${esc(a.href)}">
            <div>
              <div class="art-meta">
                <span class="art-cat">${esc(a.cat || '时评')}</span>
                <span class="art-date">${esc(a.date || '')}</span>
              </div>
              <h3>${esc(a.title)}</h3>
              <p class="art-excerpt">${esc(a.excerpt)}</p>
            </div>
            <div class="art-arrow" aria-hidden="true">\u2192</div>
          </a>
        `).join('');
      }

      // Initial render with loading state
      commentarySection.innerHTML = `
        <div class="container">
          <div class="section-head fade-in">
            <div>
              <div class="label">${esc(cm.label)}</div>
              <h2>${esc(cm.headingLine1)}<br/>${esc(cm.headingLine2)}</h2>
            </div>
            <p class="blurb">${esc(cm.blurb)}</p>
          </div>
          <div class="article-list" id="articleList">
            <div class="article-loading fade-in">
              <span class="loader-dot">\u8bfb</span>
              <span class="loader-dot">\u53d6</span>
              <span class="loader-dot">\u4e2d</span>
              ...
            </div>
          </div>
          <div class="commentary-footer">
            <a href="articles/">\u67e5\u770b\u5168\u90e8\u65f6\u8bc4 \u2192</a>
          </div>
        </div>
      `;

      // Fetch article feed
      var feedUrl = D.siteConfig ? D.siteConfig.articlesFeed : 'articles/feed.json';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', feedUrl, true);
      xhr.onload = function () {
        var list = document.getElementById('articleList');
        if (xhr.status === 200) {
          try {
            var feed = JSON.parse(xhr.responseText);
            var articles = feed.articles || feed;
            // Show latest 5, in reverse chronological order
            if (articles.length > 5) articles = articles.slice(0, 5);
            list.innerHTML = renderArticles(articles);
          } catch (e) {
            list.innerHTML = renderArticles(cm.defaultFeatured);
          }
        } else {
          list.innerHTML = renderArticles(cm.defaultFeatured);
        }
        observeFadeIns();
      };
      xhr.onerror = function () {
        var list = document.getElementById('articleList');
        list.innerHTML = renderArticles(cm.defaultFeatured);
        observeFadeIns();
      };
      xhr.send();

      /* Quote */
      const q = D.quote;
      document.getElementById('manifesto').innerHTML = `
        <div class="container fade-in">
          <div class="quote-mark" aria-hidden="true">\u201C</div>
          <blockquote class="pull">${esc(q.text)}</blockquote>
          <div class="quote-attr">${esc(q.attr)}</div>
        </div>
      `;

      /* Contact */
      const co = D.contact;
      document.getElementById('contact').innerHTML = `
        <div class="container">
          <div class="section-head fade-in">
            <div>
              <div class="label">${esc(co.label)}</div>
              <h2>${esc(co.headingLine1)}<br/>${esc(co.headingLine2)}</h2>
            </div>
            <p class="blurb">${esc(co.blurb)}</p>
          </div>
          <div class="contact-card fade-in fade-in-delay-1">
            <div>
              <h3>${esc(co.channel.title)}</h3>
              <p>${esc(co.channel.handle)}</p>
            </div>
            <a class="contact-channel" href="${esc(co.channel.url)}" target="_blank" rel="noopener">
              <span>
                <span class="ch-name">${esc(co.channel.ctaLabel)}</span>
                <span class="ch-handle">${esc(co.channel.ctaSub)}</span>
              </span>
              <span aria-hidden="true">\u2192</span>
            </a>
          </div>
        </div>
      `;

      /* Footer */
      if (D.footer) {
        const fl = document.querySelector('[data-bind="footerLeft"]');
        const fr = document.querySelector('[data-bind="footerRight"]');
        if (fl && D.footer.left)  fl.textContent = D.footer.left;
        if (fr && D.footer.right) fr.textContent = D.footer.right;
      }

      /* Meta */
      if (D.meta && D.meta.title) document.title = D.meta.title;

      /* Reveal + observe initial */
      document.querySelector('main').classList.add('ready');
      observeFadeIns();
    })();
  </script>
</body>
</html>
