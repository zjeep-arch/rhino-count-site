name: Cleanup Stale Runs
on:
  push:
    branches: [main]
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel stale queued runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing queued runs..."
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=queued&per_page=10" \
            | python3 -c "
          import sys, json, os, subprocess
          data = json.load(sys.stdin)
          for r in data.get('workflow_runs', []):
              rid = r['id']
              num = r['run_number']
              print(f'Cancelling #{num} (id={rid})...')
              # Try cancel
              subprocess.run(['curl', '-s', '-X', 'POST', '-H', f'Authorization: token {os.environ[\"GH_TOKEN\"]}', f'https://api.github.com/repos/{os.environ[\"GITHUB_REPOSITORY\"]}/actions/runs/{rid}/cancel'], capture_output=True)
              # Try delete  
              subprocess.run(['curl', '-s', '-X', 'DELETE', '-H', f'Authorization: token {os.environ[\"GH_TOKEN\"]}', f'https://api.github.com/repos/{os.environ[\"GITHUB_REPOSITORY\"]}/actions/runs/{rid}'], capture_output=True)
              print(f'Done #{num}')
          "
