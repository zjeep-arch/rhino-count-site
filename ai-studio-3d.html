<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D AI 工作室 · 犀牛伯爵</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #02040a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #F2F7F6;
  }
  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  #canvas-container canvas {
    display: block;
    cursor: grab;
  }
  #canvas-container canvas:active { cursor: grabbing; }

  /* HUD overlay */
  .hud-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* Top bar */
  .hud-top {
    position: absolute;
    top: 24px; left: 24px; right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }
  .hud-title {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 18px;
    color: #27D7C9;
    text-shadow: 0 0 16px rgba(39,215,201,0.6);
    letter-spacing: 0.08em;
  }
  .hud-title small {
    display: block;
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(242,247,246,0.35);
    margin-top: 5px;
  }
  .hud-stats {
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242,247,246,0.4);
    font-family: 'SF Mono', 'Monaco', monospace;
    line-height: 1.8;
  }
  .hud-stats span { color: #27D7C9; }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 48px; height: 48px;
    border: 1px solid rgba(39,215,201,0.25);
  }
  .corner-tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .corner-tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
  .corner-bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
  .corner-br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

  /* Reticle */
  .reticle {
    position: absolute;
    top: 50%; left: 50%;
    width: 80px; height: 80px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(39,215,201,0.08);
    border-radius: 50%;
    animation: reticlePulse 4s ease-in-out infinite;
  }
  .reticle::before {
    content: "";
    position: absolute;
    inset: 16px;
    border: 1px solid rgba(39,215,201,0.05);
    border-radius: 50%;
  }
  @keyframes reticlePulse {
    0%, 100% { opacity: 0.2; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%,-50%) scale(1.08); }
  }

  /* Bottom controls */
  .hud-bottom {
    position: absolute;
    bottom: 24px; left: 24px; right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: auto;
  }
  .hud-hint {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(242,247,246,0.3);
    font-family: 'SF Mono', 'Monaco', monospace;
  }
  .hud-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid rgba(39,215,201,0.25);
    border-radius: 3px;
    color: #27D7C9;
    font-size: 9px;
    margin: 0 2px;
  }
  .hud-back {
    padding: 7px 14px;
    border: 1px solid rgba(39,215,201,0.25);
    border-radius: 999px;
    color: #27D7C9;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.1em;
    background: rgba(2,4,10,0.6);
    backdrop-filter: blur(12px);
    transition: all 0.25s ease;
  }
  .hud-back:hover {
    border-color: #27D7C9;
    background: rgba(39,215,201,0.08);
    box-shadow: 0 0 20px rgba(39,215,201,0.2);
  }

  /* Info panel */
  .info-panel {
    position: fixed;
    bottom: 70px; right: 24px;
    width: 300px;
    padding: 22px;
    background: rgba(2,4,10,0.88);
    border: 1px solid rgba(39,215,201,0.18);
    border-radius: 14px;
    backdrop-filter: blur(24px);
    z-index: 20;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.8), 0 0 40px -10px rgba(39,215,201,0.08);
  }
  .info-panel.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .info-panel h3 {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 14px;
    color: #27D7C9;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .info-panel p {
    font-size: 12px;
    line-height: 1.7;
    color: rgba(242,247,246,0.65);
  }
  .info-panel .close-btn {
    position: absolute;
    top: 10px; right: 14px;
    color: rgba(242,247,246,0.3);
    cursor: pointer;
    font-size: 16px;
    transition: color 0.2s;
  }
  .info-panel .close-btn:hover { color: #27D7C9; }

  /* Loading */
  #loading {
    position: fixed;
    inset: 0;
    background: #02040a;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 50px; height: 50px;
    border: 2px solid rgba(39,215,201,0.12);
    border-top-color: #27D7C9;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loading"><div class="loader-ring"></div></div>

<div id="canvas-container"></div>

<div class="hud-overlay">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="reticle"></div>

  <div class="hud-top">
    <div class="hud-title">
      J.A.R.V.I.S Lab
      <small>犀牛伯爵 · AI 工作室</small>
    </div>
    <div class="hud-stats">
      SYS <span>ONLINE</span><br/>
      PWR <span>98%</span><br/>
      <span id="fps">60</span> FPS
    </div>
  </div>

  <div class="hud-bottom">
    <div class="hud-hint">
      <kbd>拖拽</kbd> 旋转 &nbsp;
      <kbd>滚轮</kbd> 缩放 &nbsp;
      <kbd>点击</kbd> 交互
    </div>
    <a href="../index.html#builds" class="hud-back">← 返回</a>
  </div>
</div>

<div class="info-panel" id="infoPanel">
  <span class="close-btn" onclick="document.getElementById('infoPanel').classList.remove('show')">×</span>
  <h3 id="infoTitle">Title</h3>
  <p id="infoText">Description</p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ═══════════════════════════════════════════════════════════
// Scene Setup
// ═══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040a, 0.025);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9, 7.5, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// Environment for PBR reflections
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
scene.environment = pmremGenerator.fromScene(envScene, 0.04).texture;

// ═══════════════════════════════════════════════════════════
// Post-processing
// ═══════════════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.85, 0.35, 0.82
);
composer.addPass(bloomPass);

const rgbShiftPass = new ShaderPass(RGBShiftShader);
rgbShiftPass.uniforms['amount'].value = 0.0008;
composer.addPass(rgbShiftPass);

const fxaaPass = new ShaderPass(FXAAShader);
fxaaPass.material.uniforms['resolution'].value.set(
  1 / (window.innerWidth * renderer.getPixelRatio()),
  1 / (window.innerHeight * renderer.getPixelRatio())
);
composer.addPass(fxaaPass);

// ═══════════════════════════════════════════════════════════
// Controls
// ═══════════════════════════════════════════════════════════
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minPolarAngle = Math.PI * 0.12;
controls.target.set(0, 2.5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// ═══════════════════════════════════════════════════════════
// Procedural Textures
// ═══════════════════════════════════════════════════════════
function makeFloorTexture() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  // Base dark metal
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#080b12');
  grad.addColorStop(0.5, '#0a0e16');
  grad.addColorStop(1, '#070a10');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // Brushed metal lines
  for (let i = 0; i < 800; i++) {
    ctx.strokeStyle = `rgba(${30 + Math.random() * 20}, ${35 + Math.random() * 20}, ${45 + Math.random() * 25}, ${0.15 + Math.random() * 0.25})`;
    ctx.lineWidth = 0.5 + Math.random();
    ctx.beginPath();
    ctx.moveTo(Math.random() * size, 0);
    ctx.lineTo(Math.random() * size, size);
    ctx.stroke();
  }

  // Hex grid pattern
  ctx.strokeStyle = 'rgba(39, 215, 201, 0.04)';
  ctx.lineWidth = 1;
  const hexSize = 64;
  for (let row = 0; row < size / hexSize + 2; row++) {
    for (let col = 0; col < size / hexSize + 2; col++) {
      const x = col * hexSize * 1.5;
      const y = row * hexSize * Math.sqrt(3) + (col % 2) * hexSize * Math.sqrt(3) / 2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const px = x + Math.cos(a) * hexSize * 0.5;
        const py = y + Math.sin(a) * hexSize * 0.5;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }

  // Subtle noise
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 12;
    img.data[i] = Math.max(0, img.data[i] + n);
    img.data[i + 1] = Math.max(0, img.data[i + 1] + n);
    img.data[i + 2] = Math.max(0, img.data[i + 2] + n);
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeFloorNormalTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgb(128, 128, 255)';
  ctx.fillRect(0, 0, size, size);
  // Add subtle bumps
  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 1 + Math.random() * 2;
    const dx = (Math.random() - 0.5) * 20;
    const dy = (Math.random() - 0.5) * 20;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgb(${128 + dx}, ${128 + dy}, 255)`);
    grad.addColorStop(1, 'rgb(128, 128, 255)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

function makeWallTexture() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  // Dark base
  ctx.fillStyle = '#06080d';
  ctx.fillRect(0, 0, size, size);

  // Carbon fiber pattern
  const cellSize = 16;
  for (let y = 0; y < size; y += cellSize) {
    for (let x = 0; x < size; x += cellSize) {
      const isLight = ((x / cellSize) + (y / cellSize)) % 2 === 0;
      ctx.fillStyle = isLight ? 'rgba(18, 22, 30, 0.6)' : 'rgba(10, 14, 20, 0.6)';
      ctx.fillRect(x, y, cellSize, cellSize);
      // Highlight
      ctx.strokeStyle = 'rgba(30, 35, 45, 0.3)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x + 0.5, y + 0.5, cellSize - 1, cellSize - 1);
    }
  }

  // Glow strips
  ctx.fillStyle = 'rgba(39, 215, 201, 0.08)';
  ctx.fillRect(0, size * 0.3, size, 2);
  ctx.fillRect(0, size * 0.7, size, 2);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeScreenTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 640;
  const ctx = c.getContext('2d');

  // Dark screen
  ctx.fillStyle = '#021018';
  ctx.fillRect(0, 0, c.width, c.height);

  // JARVIS UI elements
  ctx.font = 'bold 28px monospace';
  ctx.fillStyle = 'rgba(39, 215, 201, 0.9)';
  ctx.fillText('J.A.R.V.I.S', 40, 50);
  ctx.font = '14px monospace';
  ctx.fillStyle = 'rgba(39, 215, 201, 0.4)';
  ctx.fillText('SYSTEM ONLINE · v5.2.1', 40, 72);

  // Data charts
  ctx.strokeStyle = 'rgba(39, 215, 201, 0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 40; x < 500; x += 4) {
    const y = 120 + Math.sin(x * 0.03) * 25 + Math.random() * 8;
    if (x === 40) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Bar chart
  for (let i = 0; i < 12; i++) {
    const x = 40 + i * 38;
    const h = 30 + Math.random() * 80;
    const grad = ctx.createLinearGradient(x, 300 - h, x, 300);
    grad.addColorStop(0, 'rgba(39, 215, 201, 0.8)');
    grad.addColorStop(1, 'rgba(39, 215, 201, 0.1)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, 300 - h, 28, h);
  }

  // Right panel — circular HUD
  const cx = 780, cy = 200;
  for (let r = 40; r <= 120; r += 20) {
    ctx.strokeStyle = `rgba(39, 215, 201, ${0.15 - r * 0.001})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Arc segments
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const start = (i / 6) * Math.PI * 2 + 0.1;
    const end = start + Math.PI * 0.25;
    ctx.strokeStyle = `rgba(39, 215, 201, ${0.4 + Math.random() * 0.3})`;
    ctx.beginPath();
    ctx.arc(cx, cy, 60 + i * 10, start, end);
    ctx.stroke();
  }

  // Status lines
  ctx.font = '11px monospace';
  const lines = [
    'CPU LOAD     ████░░░░  47%',
    'MEMORY       ██████░░  72%',
    'AGENT QUEUE  ██░░░░░░  23%',
    'MCP SERVERS  ████████  12/12',
    'MODEL        FABLE-5   READY',
  ];
  lines.forEach((line, i) => {
    ctx.fillStyle = 'rgba(39, 215, 201, 0.5)';
    ctx.fillText(line, 40, 400 + i * 22);
  });

  // Bottom data stream
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(39, 215, 201, 0.15)';
  for (let i = 0; i < 5; i++) {
    let line = '';
    for (let j = 0; j < 80; j++) {
      line += Math.random() > 0.5 ? '0' : '1';
    }
    ctx.fillText(line, 40, 560 + i * 14);
  }

  // Scan line effect
  for (let y = 0; y < c.height; y += 3) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, y, c.width, 1);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeSideScreenTexture(color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 320;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#020a0e';
  ctx.fillRect(0, 0, c.width, c.height);

  // Grid
  ctx.strokeStyle = color.replace('1)', '0.08)');
  ctx.lineWidth = 0.5;
  for (let x = 0; x < c.width; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
  }
  for (let y = 0; y < c.height; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke();
  }

  // Waveform
  ctx.strokeStyle = color.replace('1)', '0.6)');
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < c.width; x += 2) {
    const y = c.height / 2 + Math.sin(x * 0.02) * 40 + Math.sin(x * 0.05) * 20 + (Math.random() - 0.5) * 8;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Data blocks
  ctx.font = '10px monospace';
  ctx.fillStyle = color.replace('1)', '0.4)');
  const labels = ['AGENT-01', 'AGENT-02', 'TASK QUEUE', 'THROUGHPUT'];
  labels.forEach((l, i) => {
    ctx.fillText(l, 20, 20 + i * 16);
  });

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ═══════════════════════════════════════════════════════════
// Lighting
// ═══════════════════════════════════════════════════════════
const ambient = new THREE.AmbientLight(0x1a2535, 0.35);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0x4a6580, 0.5);
keyLight.position.set(6, 12, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -15;
keyLight.shadow.camera.right = 15;
keyLight.shadow.camera.top = 15;
keyLight.shadow.camera.bottom = -15;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 40;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.radius = 4;
scene.add(keyLight);

// Accent fills
const tealFill = new THREE.PointLight(0x27D7C9, 8, 12, 1.5);
tealFill.position.set(-4, 4, 2);
scene.add(tealFill);

const purpleFill = new THREE.PointLight(0x8E7CFF, 6, 10, 1.5);
purpleFill.position.set(4, 3, 3);
scene.add(purpleFill);

const warmFill = new THREE.PointLight(0xFF7A59, 3, 8, 2);
warmFill.position.set(0, 1, 4);
scene.add(warmFill);

// Interactive objects
const interactables = [];

// ═══════════════════════════════════════════════════════════
// Room
// ═══════════════════════════════════════════════════════════
function createRoom() {
  const room = new THREE.Group();

  // Floor with procedural texture
  const floorTex = makeFloorTexture();
  const floorNorm = makeFloorNormalTexture();
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 26),
    new THREE.MeshStandardMaterial({
      map: floorTex,
      normalMap: floorNorm,
      metalness: 0.85,
      roughness: 0.28,
      envMapIntensity: 0.4,
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  room.add(floor);

  // Floor glow strips (LED lines)
  const stripMat = new THREE.MeshBasicMaterial({ color: 0x27D7C9, transparent: true, opacity: 0.35 });
  const strips = [
    { pos: [0, 0.02, -6], size: [10, 0.02, 0.04] },
    { pos: [-5, 0.02, 0], size: [0.04, 0.02, 10] },
    { pos: [5, 0.02, 0], size: [0.04, 0.02, 10] },
  ];
  strips.forEach(s => {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(...s.size), stripMat);
    strip.position.set(...s.pos);
    room.add(strip);
  });

  // Walls with carbon fiber texture

// Holographic Data Globe
// ═══════════════════════════════════════════════════════════
function createDataGlobe() {
  const group = new THREE.Group();

  // Inner solid sphere
  const inner = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 48, 32),
    new THREE.MeshStandardMaterial({
      color: 0x020812,
      metalness: 0.3,
      roughness: 0.7,
      emissive: 0x0a1a2a,
      emissiveIntensity: 0.5,
    })
  );
  group.add(inner);

  // Wireframe outer
  const wire = new THREE.Mesh(
    new THREE.SphereGeometry(1.02, 32, 24),
    new THREE.MeshBasicMaterial({
      color: 0x27D7C9,
      wireframe: true,
      transparent: true,
      opacity: 0.15,
    })
  );
  group.add(wire);

  // Data points on surface
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x27D7C9 });
  const dotMatOrange = new THREE.MeshBasicMaterial({ color: 0xFF7A59 });
  const dotGeo = new THREE.SphereGeometry(0.025, 8, 8);

  for (let i = 0; i < 60; i++) {
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 1.03;
    const dot = new THREE.Mesh(dotGeo, i % 5 === 0 ? dotMatOrange : dotMat);
    dot.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
    group.add(dot);
  }

  // Arc connections
  const lineMat = new THREE.LineBasicMaterial({
    color: 0x27D7C9,
    transparent: true,
    opacity: 0.2,
  });
  for (let i = 0; i < 12; i++) {
    const p1 = new THREE.Vector3(
      Math.random() * 2 - 1,
      Math.random() * 2 - 1,
      Math.random() * 2 - 1
    ).normalize().multiplyScalar(1.03);
    const p2 = new THREE.Vector3(
      Math.random() * 2 - 1,
      Math.random() * 2 - 1,
      Math.random() * 2 - 1
    ).normalize().multiplyScalar(1.03);

    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const dist = p1.distanceTo(p2);
    mid.normalize().multiplyScalar(1.03 + dist * 0.3);

    const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
    const points = curve.getPoints(20);
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geo, lineMat);
    group.add(line);
  }

  group.position.set(4.5, 4, -2.5);
  group.userData = {
    name: '全球数据网络',
    desc: '实时全球 AI 数据流可视化 — 连接 GCP Vertex AI、Claude API、MCP 服务器网络。每天处理 2.3B 条推理请求。',
    isInteractable: true,
  };
  interactables.push(group);
  return group;
}

// Floating Particles
// ═══════════════════════════════════════════════════════════
function createParticles() {
  const count = 300;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const velocities = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  const c1 = new THREE.Color(0x27D7C9);
  const c2 = new THREE.Color(0x8E7CFF);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 22;
    positions[i * 3 + 1] = Math.random() * 11;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 22;
    velocities[i * 3] = (Math.random() - 0.5) * 0.004;
    velocities[i * 3 + 1] = 0.001 + Math.random() * 0.008;
    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.004;
    sizes[i] = 0.02 + Math.random() * 0.06;
    const c = Math.random() > 0.5 ? c1 : c2;
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.05,
    vertexColors: true,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const points = new THREE.Points(geo, mat);
  points.userData = { velocities };
  return points;
}

// ═══════════════════════════════════════════════════════════
// Interaction
// ═══════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onPointerMove(event) {
  const x = event.clientX !== undefined ? event.clientX : (event.touches && event.touches[0].clientX);
  const y = event.clientY !== undefined ? event.clientY : (event.touches && event.touches[0].clientY);
  mouse.x = (x / window.innerWidth) * 2 - 1;
  mouse.y = -(y / window.innerHeight) * 2 + 1;
}

function onPointerDown(event) {
  onPointerMove(event);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(interactables, true);
  if (hits.length > 0) {
    let target = hits[0].object;
    while (target && !target.userData.isInteractable) {
      target = target.parent;
    }
    if (target && target.userData.name) {
      showInfo(target.userData.name, target.userData.desc);
    }
  }
}

function showInfo(title, text) {
  const panel = document.getElementById('infoPanel');
  document.getElementById('infoTitle').textContent = title;
  document.getElementById('infoText').textContent = text;
  panel.classList.add('show');
}

window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('pointerdown', onPointerDown, { passive: true });

// Resize
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fxaaPass.material.uniforms['resolution'].value.set(
    1 / (window.innerWidth * renderer.getPixelRatio()),
    1 / (window.innerHeight * renderer.getPixelRatio())
  );
}, { passive: true });

const clock = new THREE.Clock();
let frameCount = 0;
let lastFpsTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  frameCount++;

  controls.update();

  // Arc reactor animation
  arcReactor.rotation.z += 0.008;
  if (arcReactor.userData.reactorLight) {
    arcReactor.userData.reactorLight.intensity = 4 + Math.sin(elapsed * 2.5) * 1.5;
  }
  if (arcReactor.userData.core) {
    arcReactor.userData.core.material.opacity = 0.75 + Math.sin(elapsed * 2.5) * 0.15;
  }
  if (arcReactor.userData.halo) {
    const s = 1 + Math.sin(elapsed * 2.5) * 0.08;
    arcReactor.userData.halo.scale.set(s, s, 1);
  }

  // Data globe rotation
  dataGlobe.rotation.y += 0.004;
  dataGlobe.rotation.x = Math.sin(elapsed * 0.15) * 0.08;

  // HUD rings
  hudRings.children.forEach((ring, i) => {
    if (ring.userData.axis === 0) ring.rotation.z += 0.002;
    else if (ring.userData.axis === 1) ring.rotation.x += 0.0015;
    else ring.rotation.y += 0.003;
  });
  hudRings.position.y = 4 + Math.sin(elapsed * 0.4) * 0.25;

  // Particles drift
  const pos = particles.geometry.attributes.position.array;
  const vel = particles.userData.velocities;
  for (let i = 0; i < pos.length; i += 3) {
    pos[i] += vel[i];
    pos[i + 1] += vel[i + 1];
    pos[i + 2] += vel[i + 2];
    if (pos[i + 1] > 11) {
      pos[i] = (Math.random() - 0.5) * 22;
      pos[i + 1] = 0;
      pos[i + 2] = (Math.random() - 0.5) * 22;
    }
  }
  particles.geometry.attributes.position.needsUpdate = true;

  // FPS counter
  if (elapsed - lastFpsTime > 1) {
    const fps = Math.round(frameCount / (elapsed - lastFpsTime));
    const fpsEl = document.getElementById('fps');
    if (fpsEl) fpsEl.textContent = fps;
    frameCount = 0;
    lastFpsTime = elapsed;
  }

  composer.render();
}

// Hide loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hide');
}, 500);

animate();
</script>
