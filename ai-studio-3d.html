<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #02040a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFong SC", sans-serif;
    color: #F2F7F6;
  }
  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  #canvas-container canvas {
    display: block;
    cursor: grab;
  }
  #canvas-container canvas:active { cursor: grabbing; }

  .hud-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 10;
  }
  .hud-top {
    position: absolute; top: 24px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: auto;
  }
  .hud-title {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 16px; color: #27D7C9;
    text-shadow: 0 0 16px rgba(39,215,201,0.6);
    letter-spacing: 0.08em;
  }
  .hud-title small {
    display: block; font-size: 9px; letter-spacing: 0.35em;
    text-transform: uppercase; color: rgba(242,247,246,0.35); margin-top: 5px;
  }
  .hud-stats {
    text-align: right; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(242,247,246,0.4);
    font-family: 'SF Mono', 'Monaco', monospace; line-height: 1.8;
  }
  .hud-stats span { color: #27D7C9; }
  .corner {
    position: absolute; width: 48px; height: 48px;
    border: 1px solid rgba(39,215,201,0.2);
  }
  .corner-tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .corner-tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
  .corner-bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
  .corner-br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
  .reticle {
    position: absolute; top: 50%; left: 50%;
    width: 80px; height: 80px; transform: translate(-50%, -50%);
    border: 1px solid rgba(39,215,201,0.06); border-radius: 50%;
    animation: reticlePulse 4s ease-in-out infinite;
  }
  .reticle::before {
    content: ""; position: absolute; inset: 16px;
    border: 1px solid rgba(39,215,201,0.04); border-radius: 50%;
  }
  @keyframes reticlePulse {
    0%, 100% { opacity: 0.15; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.4; transform: translate(-50%,-50%) scale(1.08); }
  }
  .hud-bottom {
    position: absolute; bottom: 24px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: auto;
  }
  .hud-hint {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(242,247,246,0.28); font-family: 'SF Mono', 'Monaco', monospace;
  }
  .hud-hint kbd {
    display: inline-block; padding: 2px 7px;
    border: 1px solid rgba(39,215,201,0.2); border-radius: 3px;
    color: #27D7C9; font-size: 9px; margin: 0 2px;
  }
  .hud-back {
    padding: 7px 14px; border: 1px solid rgba(39,215,201,0.2);
    border-radius: 999px; color: #27D7C9; text-decoration: none;
    font-size: 11px; letter-spacing: 0.1em;
    background: rgba(2,4,10,0.6); backdrop-filter: blur(12px);
    transition: all 0.25s ease;
  }
  .hud-back:hover {
    border-color: #27D7C9; background: rgba(39,215,201,0.08);
    box-shadow: 0 0 20px rgba(39,215,201,0.2);
  }
  .info-panel {
    position: fixed; bottom: 70px; right: 24px; width: 300px;
    padding: 22px; background: rgba(2,4,10,0.88);
    border: 1px solid rgba(39,215,201,0.15); border-radius: 14px;
    backdrop-filter: blur(24px); z-index: 20;
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.8), 0 0 40px -10px rgba(39,215,201,0.06);
  }
  .info-panel.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .info-panel h3 {
    font-family: 'SF Mono', 'Monaco', monospace; font-size: 14px;
    color: #27D7C9; margin-bottom: 10px; letter-spacing: 0.05em;
  }
  .info-panel p { font-size: 12px; line-height: 1.7; color: rgba(242,247,246,0.65); }
  .info-panel .close-btn {
    position: absolute; top: 10px; right: 14px;
    color: rgba(242,247,246,0.3); cursor: pointer; font-size: 16px;
    transition: color 0.2s;
  }
  .info-panel .close-btn:hover { color: #27D7C9; }
  #loading {
    position: fixed; inset: 0; background: #02040a;
    display: flex; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.8s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 50px; height: 50px;
    border: 2px solid rgba(39,215,201,0.1);
    border-top-color: #27D7C9; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ═══════════════════════════════════════════════════════════
// 核心：场景 / 相机 / 渲染器
// ═══════════════════════════════════════════════════════════
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040a, 0.022);

const camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(14, 10, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// 环境反射
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
scene.environment = pmrem.fromScene(envScene, 0.03).texture;

// 后处理链
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.4, 0.85);
composer.addPass(bloom);
const fxaa = new ShaderPass(FXAAShader);
fxaa.material.uniforms['resolution'].value.set(1/(window.innerWidth*renderer.getPixelRatio()), 1/(window.innerHeight*renderer.getPixelRatio()));
composer.addPass(fxaa);

// 相机控制 — 借鉴 my-room-in-3d 的平滑球坐标导航
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 8;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minPolarAngle = Math.PI * 0.1;
controls.target.set(0, 2.5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

// 交互对象
const interactables = [];

// ═══════════════════════════════════════════════════════════
// 程序化纹理工厂
// ═══════════════════════════════════════════════════════════

// 木纹桌面纹理
function makeWoodTexture() {
  const s = 1024;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const ctx = c.getContext('2d');
  // 底色
  ctx.fillStyle = '#1a1208'; ctx.fillRect(0, 0, s, s);
  // 木纹层
  for (let i = 0; i < 60; i++) {
    const y = (i / 60) * s;
    const grad = ctx.createLinearGradient(0, y, 0, y + s/60);
    const base = 20 + Math.random() * 15;
    grad.addColorStop(0, `rgb(${base+8}, ${base+4}, ${base})`);
    grad.addColorStop(0.5, `rgb(${base+15}, ${base+10}, ${base+5})`);
    grad.addColorStop(1, `rgb(${base+5}, ${base+2}, ${base-2})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, s, s/60 + 2);
    // 木纹细节
    ctx.strokeStyle = `rgba(${base+20}, ${base+12}, ${base+6}, ${0.15 + Math.random()*0.2})`;
    ctx.lineWidth = 0.5 + Math.random();
    ctx.beginPath();
    for (let x = 0; x < s; x += 4) {
      const ny = y + Math.sin(x * 0.01 + i) * 3 + Math.sin(x * 0.03) * 2 + (Math.random()-0.5)*1.5;
      if (x === 0) ctx.moveTo(x, ny); else ctx.lineTo(x, ny);
    }
    ctx.stroke();
  }
  // 节点
  for (let i = 0; i < 4; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, 40+Math.random()*30);
    grad.addColorStop(0, 'rgba(8, 5, 2, 0.6)');
    grad.addColorStop(1, 'rgba(8, 5, 2, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x-80, y-80, 160, 160);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 金属地板纹理
function makeFloorTexture() {
  const s = 1024;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#070a10'); grad.addColorStop(0.5, '#090d14'); grad.addColorStop(1, '#060810');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, s, s);
  // 拉丝金属
  for (let i = 0; i < 1000; i++) {
    ctx.strokeStyle = `rgba(${25+Math.random()*15}, ${30+Math.random()*15}, ${40+Math.random()*20}, ${0.1+Math.random()*0.2})`;
    ctx.lineWidth = 0.4+Math.random()*0.8;
    ctx.beginPath(); ctx.moveTo(Math.random()*s, 0); ctx.lineTo(Math.random()*s, s); ctx.stroke();
  }
  // 六角网格
  ctx.strokeStyle = 'rgba(39,215,201,0.03)'; ctx.lineWidth = 1;
  const hs = 56;
  for (let row = 0; row < s/hs + 2; row++) {
    for (let col = 0; col < s/hs + 2; col++) {
      const x = col * hs * 1.5;
      const y = row * hs * Math.sqrt(3) + (col%2) * hs * Math.sqrt(3)/2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2;
        const px = x + Math.cos(a)*hs*0.5;
        const py = y + Math.sin(a)*hs*0.5;
        if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
  }
  // 噪点
  const img = ctx.getImageData(0, 0, s, s);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random()-0.5)*10;
    img.data[i] = Math.max(0, img.data[i]+n);
    img.data[i+1] = Math.max(0, img.data[i+1]+n);
    img.data[i+2] = Math.max(0, img.data[i+2]+n);
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2.5, 2.5);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 墙面碳纤维纹理
function makeWallTexture() {
  const s = 1024;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, s, s);
  const cs = 14;
  for (let y = 0; y < s; y += cs) {
    for (let x = 0; x < s; x += cs) {
      const light = ((x/cs)+(y/cs))%2 === 0;
      ctx.fillStyle = light ? 'rgba(16,20,28,0.55)' : 'rgba(8,12,18,0.55)';
      ctx.fillRect(x, y, cs, cs);
      ctx.strokeStyle = 'rgba(28,33,43,0.2)'; ctx.lineWidth = 0.5;
      ctx.strokeRect(x+0.5, y+0.5, cs-1, cs-1);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// JARVIS 主屏幕 UI 纹理
function makeScreenTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 640;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#021018'; ctx.fillRect(0, 0, c.width, c.height);
  // 标题
  ctx.font = 'bold 26px monospace'; ctx.fillStyle = 'rgba(39,215,201,0.9)';
  ctx.fillText('J.A.R.V.I.S', 40, 48);
  ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(39,215,201,0.35)';
  ctx.fillText('SYSTEM ONLINE · v5.2.1', 40, 68);
  // 波形图
  ctx.strokeStyle = 'rgba(39,215,201,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 40; x < 500; x += 3) {
    const y = 120 + Math.sin(x*0.03)*22 + Math.random()*6;
    if (x===40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // 柱状图
  for (let i = 0; i < 14; i++) {
    const x = 40+i*32; const h = 25+Math.random()*70;
    const g = ctx.createLinearGradient(x, 300-h, x, 300);
    g.addColorStop(0, 'rgba(39,215,201,0.7)'); g.addColorStop(1, 'rgba(39,215,201,0.05)');
    ctx.fillStyle = g; ctx.fillRect(x, 300-h, 24, h);
  }
  // 右侧圆形 HUD
  const cx=780, cy=180;
  for (let r=40; r<=120; r+=18) {
    ctx.strokeStyle = `rgba(39,215,201,${0.12-r*0.001})`;
    ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const start = (i/6)*Math.PI*2+0.1; const end = start+Math.PI*0.25;
    ctx.strokeStyle = `rgba(39,215,201,${0.35+Math.random()*0.3})`;
    ctx.beginPath(); ctx.arc(cx, cy, 55+i*10, start, end); ctx.stroke();
  }
  // 状态行
  ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(39,215,201,0.45)';
  const lines = ['CPU  ████░░  47%','MEM  ██████░  72%','AGT  ██░░░░  23%','MCP  ████████ 12/12','MDL  FABLE-5  READY'];
  lines.forEach((l, i) => ctx.fillText(l, 40, 380+i*20));
  // 数据流
  ctx.font = '8px monospace'; ctx.fillStyle = 'rgba(39,215,201,0.12)';
  for (let i = 0; i < 4; i++) {
    let line = ''; for (let j = 0; j < 90; j++) line += Math.random()>0.5?'0':'1';
    ctx.fillText(line, 40, 540+i*12);
  }
  // 扫描线
  for (let y = 0; y < c.height; y += 2) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(0, y, c.width, 1); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 侧屏波形纹理
function makeSideScreenTexture(colorR, colorG, colorB) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 320;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#020a0e'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},0.06)`; ctx.lineWidth = 0.5;
  for (let x = 0; x < c.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke(); }
  for (let y = 0; y < c.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke(); }
  ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},0.5)`; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < c.width; x += 2) {
    const y = c.height/2 + Math.sin(x*0.02)*35 + Math.sin(x*0.05)*18 + (Math.random()-0.5)*6;
    if (x===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.font = '9px monospace'; ctx.fillStyle = `rgba(${colorR},${colorG},${colorB},0.35)`;
  ['AGENT-01','AGENT-02','TASK Q','THROUGHPUT'].forEach((l, i) => ctx.fillText(l, 20, 20+i*14));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Perlin 噪声蒸汽纹理（借鉴 my-room-in-3d 的 coffeeSteam）
function makeSteamTexture() {
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(255,255,255,0)'; ctx.fillRect(0, 0, s, s);
  // 简化的 Perlin 风格噪声
  for (let i = 0; i < 50; i++) {
    const x = Math.random()*s, y = Math.random()*s;
    const r = 20+Math.random()*40;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(200,210,220,0.04)');
    grad.addColorStop(1, 'rgba(200,210,220,0)');
    ctx.fillStyle = grad; ctx.fillRect(x-r, y-r, r*2, r*2);
  }
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

// ═══════════════════════════════════════════════════════════
// 灯光
// ═══════════════════════════════════════════════════════════
const ambient = new THREE.AmbientLight(0x162030, 0.3);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0x3a5470, 0.4);
keyLight.position.set(5, 14, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -14; keyLight.shadow.camera.right = 14;
keyLight.shadow.camera.top = 14; keyLight.shadow.camera.bottom = -14;

// 方舟反应堆 — Iron Man Mark VI 风格
// ═══════════════════════════════════════════════════════════
function createArcReactor() {
  const r = new THREE.Group();

  // 外壳环
  const housing = new THREE.Mesh(
    new THREE.TorusGeometry(0.5, 0.055, 32, 64),
    new THREE.MeshStandardMaterial({ color: 0x3a3f4a, metalness: 0.95, roughness: 0.12, envMapIntensity: 1.2 })
  );

  // 内环

    new THREE.TorusGeometry(0.38, 0.025, 24, 48),
    new THREE.MeshStandardMaterial({ color: 0x5a5f6a, metalness: 0.9, roughness: 0.1, emissive: 0x27D7C9, emissiveIntensity: 0.35, envMapIntensity: 1.0 })
  );
  r.add(inner);

  // 核心发光
  const core = new THREE.Mesh(new THREE.CircleGeometry(0.28, 64),
    new THREE.MeshBasicMaterial({ color: 0x27D7C9, transparent: true, opacity: 0.85 }));
  core.position.z = 0.01; r.add(core);

  // 核心光晕
  const halo = new THREE.Mesh(new THREE.CircleGeometry(0.42, 64),
    new THREE.MeshBasicMaterial({ color: 0x27D7C9, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.position.z = 0.005; r.add(halo);

  // 9 段线圈
  for (let i = 0; i < 9; i++) {
    const a = (i/9)*Math.PI*2;
    const coil = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.04, 0.025),
      new THREE.MeshStandardMaterial({ color: 0x2a2f3a, metalness: 0.9, roughness: 0.18, emissive: 0x27D7C9, emissiveIntensity: 0.12, envMapIntensity: 0.8 }));
    coil.position.set(Math.cos(a)*0.43, 0, Math.sin(a)*0.43);
    coil.rotation.y = a; coil.castShadow = true; r.add(coil);
  }

  // Mark VI 三角形
  const triShape = new THREE.Shape();
  const triR = 0.16;
  for (let i = 0; i < 3; i++) {
    const a = (i/3)*Math.PI*2 - Math.PI/2;
    if (i===0) triShape.moveTo(Math.cos(a)*triR, Math.sin(a)*triR);
    else triShape.lineTo(Math.cos(a)*triR, Math.sin(a)*triR);
  }
  triShape.closePath();
  const tri = new THREE.Mesh(new THREE.ShapeGeometry(triShape),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
  tri.position.z = 0.02; r.add(tri);

  // 反应堆光
  const rLight = new THREE.PointLight(0x27D7C9, 4, 8, 1.5);
  r.add(rLight);

  r.position.set(0, 2.27, -4.5);
  r.rotation.x = -Math.PI/2;
  r.userData = {
    name: '方舟反应堆',
    desc: 'Iron Man Mark VI 方舟反应堆 — 为整个 AI 工作室供能。功率 8 GJ/s，可持续运行 10^12 小时。"Sometimes you gotta run before you can walk." — Tony Stark',
    isInteractable: true, reactorLight: rLight, core, halo,
  };
  interactables.push(r);
  return r;
}

// 全息地球仪 — 带弧形数据连线
// ═══════════════════════════════════════════════════════════
function createDataGlobe() {
  const g = new THREE.Group();

  const inner = new THREE.Mesh(new THREE.SphereGeometry(1.0, 48, 32),
    new THREE.MeshStandardMaterial({ color: 0x020812, metalness: 0.3, roughness: 0.7, emissive: 0x0a1a2a, emissiveIntensity: 0.4 }));

  const wire = new THREE.Mesh(new THREE.SphereGeometry(1.02, 32, 24),
    new THREE.MeshBasicMaterial({ color: 0x27D7C9, wireframe: true, transparent: true, opacity: 0.12 }));
  g.add(wire);

  const dotGeo = new THREE.SphereGeometry(0.02, 8, 8);
  const dotMats = [new THREE.MeshBasicMaterial({color:0x27D7C9}), new THREE.MeshBasicMaterial({color:0xFF7A59}), new THREE.MeshBasicMaterial({color:0xE9C46A})];
  for (let i = 0; i < 60; i++) {
    const phi = Math.acos(2*Math.random()-1), theta = Math.random()*Math.PI*2, r = 1.03;
    const dot = new THREE.Mesh(dotGeo, dotMats[i%3]);
    dot.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
    g.add(dot);
  }

  // 弧形数据连线 — 借鉴 my-room-in-3d 的弯曲风格
  const lineMat = new THREE.LineBasicMaterial({ color: 0x27D7C9, transparent: true, opacity: 0.15 });
  for (let i = 0; i < 15; i++) {
    const p1 = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize().multiplyScalar(1.03);
    const p2 = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize().multiplyScalar(1.03);
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    mid.normalize().multiplyScalar(1.03 + p1.distanceTo(p2)*0.35);
    const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
    const points = curve.getPoints(20);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), lineMat);
    g.add(line);
  }

  g.position.set(4.5, 4, -2.5);
  g.userData = {
    name: '全球数据网络',
    desc: '实时全球 AI 数据流可视化 — 连接 GCP Vertex AI、Claude API、MCP 服务器网络。每天处理 2.3B 条推理请求。',
    isInteractable: true,
  };
  interactables.push(g);
  return g;
}

// ═══════════════════════════════════════════════════════════
function createCoffeeCup() {
  const g = new THREE.Group();

  // 杯身
  const cup = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.15, 0.25, 24),

  // 杯内液体

    new THREE.CircleGeometry(0.17, 24),

  );
  liquid.rotation.x = -Math.PI/2; liquid.position.y = 0.24; g.add(liquid);

  // 杯把
  const handle = new THREE.Mesh(
    new THREE.TorusGeometry(0.08, 0.02, 8, 16, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0xf0ede8, metalness: 0.1, roughness: 0.5 })
  );
  handle.position.set(0.17, 0.13, 0); handle.rotation.y = Math.PI/2; g.add(handle);

  // 蒸汽 — Perlin 噪声 shader（简化版）
  const steamGeo = new THREE.PlaneGeometry(0.3, 1.2, 8, 24);
  const steamMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xd2958a) } },
    vertexShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        vec3 pos = position;
        float strength = pow(uv.y * 3.0, 2.0);
        pos.x += sin(uTime * 0.001 + uv.y * 8.0) * 0.03 * strength;
        pos.z += cos(uTime * 0.0012 + uv.y * 6.0) * 0.03 * strength;
        vec4 mp = modelMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * viewMatrix * mp;
        vUv = uv;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor;
      varying vec2 vUv;
      void main() {
        float border = min(vUv.x * 4.0, (1.0 - vUv.x) * 4.0);
        border *= (1.0 - vUv.y);
        float n = sin(vUv.x * 12.0 + uTime * 0.002) * 0.3 + 0.5;
        n *= sin(vUv.y * 8.0 - uTime * 0.003) * 0.3 + 0.5;
        float alpha = border * n * 0.35;
        gl_FragColor = vec4(uColor, alpha);
      }
    `,
  });
  const steam = new THREE.Mesh(steamGeo, steamMat);
  steam.position.y = 0.85; steam.userData.steamMat = steamMat;
  g.add(steam);

  g.position.set(2.2, 2.27, -4.2);
  return g;
}

  const em = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 0.05, 24),
    new THREE.MeshStandardMaterial({ color: 0x12161e, metalness: 0.85, roughness: 0.2, emissive: 0x27D7C9, emissiveIntensity: 0.4 }));
  em.position.y = 0.08; g.add(em);
  const beam = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2.2, 24, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x27D7C9, transparent: true, opacity: 0.03, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  beam.position.y = 1.15; g.add(beam);
  g.position.set(-2.2, 2.27, -4);
  return g;
}
scene.add(createProjector());

// ═══════════════════════════════════════════════════════════
// 浮动粒子 — 数据流
// ═══════════════════════════════════════════════════════════
function createParticles() {
  const count = 300;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count*3), colors = new Float32Array(count*3), vel = new Float32Array(count*3);
  const c1 = new THREE.Color(0x27D7C9), c2 = new THREE.Color(0x8E7CFF);
  for (let i = 0; i < count; i++) {
    positions[i*3] = (Math.random()-0.5)*22;
    positions[i*3+1] = Math.random()*10;
    positions[i*3+2] = (Math.random()-0.5)*22;
    vel[i*3] = (Math.random()-0.5)*0.003;
    vel[i*3+1] = 0.001+Math.random()*0.007;
    vel[i*3+2] = (Math.random()-0.5)*0.003;
    const c = Math.random()>0.5 ? c1 : c2;
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.04, vertexColors: true, transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  points.userData = { vel };
  return points;
}
const particles = createParticles();
scene.add(particles);

// ═══════════════════════════════════════════════════════════
// 交互
// ═══════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onPointerMove(e) {
  const x = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  const y = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY) || 0;
  mouse.x = (x / window.innerWidth) * 2 - 1;
  mouse.y = -(y / window.innerHeight) * 2 + 1;
}

function onPointerDown(e) {
  onPointerMove(e);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(interactables, true);
  if (hits.length > 0) {
    let t = hits[0].object;
    while (t && !t.userData.isInteractable) t = t.parent;
    if (t && t.userData.name) showInfo(t.userData.name, t.userData.desc);
  }
}

function showInfo(title, text) {
  const p = document.getElementById('infoPanel');
  document.getElementById('infoTitle').textContent = title;
  document.getElementById('infoText').textContent = text;
  p.classList.add('show');
}

window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('pointerdown', onPointerDown, { passive: true });

// ═══════════════════════════════════════════════════════════
// 窗口缩放
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fxaa.material.uniforms['resolution'].value.set(
    1/(window.innerWidth*renderer.getPixelRatio()),
    1/(window.innerHeight*renderer.getPixelRatio())
  );
}, { passive: true });

// ═══════════════════════════════════════════════════════════
// 动画循环
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let frameCount = 0, lastFpsTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frameCount++;

  controls.update();

  // 反应堆
  arcReactor.rotation.z += 0.007;
  if (arcReactor.userData.reactorLight) arcReactor.userData.reactorLight.intensity = 3.5 + Math.sin(t*2.5)*1.2;
  if (arcReactor.userData.core) arcReactor.userData.core.material.opacity = 0.75 + Math.sin(t*2.5)*0.12;
  if (arcReactor.userData.halo) { const s = 1+Math.sin(t*2.5)*0.07; arcReactor.userData.halo.scale.set(s, s, 1); }

  // 数据球
  dataGlobe.rotation.y += 0.003;
  dataGlobe.rotation.x = Math.sin(t*0.12)*0.06;

  // HUD 环
  hudRings.children.forEach((ring, i) => {
    if (ring.userData.axis === 0) ring.rotation.z += 0.002;
    else if (ring.userData.axis === 1) ring.rotation.x += 0.0015;
    else ring.rotation.y += 0.0025;
  });
  hudRings.position.y = 4 + Math.sin(t*0.35)*0.2;

  // 粒子
  const pos = particles.geometry.attributes.position.array;
  const v = particles.userData.vel;
  for (let i = 0; i < pos.length; i += 3) {
    pos[i] += v[i]; pos[i+1] += v[i+1]; pos[i+2] += v[i+2];
    if (pos[i+1] > 10) { pos[i] = (Math.random()-0.5)*22; pos[i+1] = 0; pos[i+2] = (Math.random()-0.5)*22; }
  }
  particles.geometry.attributes.position.needsUpdate = true;

  // 咖啡蒸汽
  if (coffeeCup.userData) {
    coffeeCup.traverse(c => { if (c.userData && c.userData.steamMat) c.userData.steamMat.uniforms.uTime.value = t * 1000; });
  }

  // 椅子轻微旋转 — 借鉴 my-room-in-3d 的 TopChair
  if (chair.userData.chairGroup) chair.rotation.y = Math.sin(t * 0.3) * 0.3;

  // FPS
  if (t - lastFpsTime > 1) {
    const fps = Math.round(frameCount / (t - lastFpsTime));
    const el = document.getElementById('fps'); if (el) el.textContent = fps;
    frameCount = 0; lastFpsTime = t;
  }

  composer.render();
}

setTimeout(() => document.getElementById('loading').classList.add('hide'), 500);
animate();
</script>
