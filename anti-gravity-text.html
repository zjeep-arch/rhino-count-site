<script>
// ===== Web Audio API 音频系统 =====
let audioCtx = null;
let audioEnabled = false;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioEnabled = true;
  } catch(e) {
    console.log('Web Audio not supported');
  }
}

function playChime(freq, duration, volume) {
  if (!audioEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = freq;
  osc.type = 'sine';
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.start(now);
  osc.stop(now + duration);

  // 泛音
  [1.5, 2].forEach((ratio, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    o.frequency.value = freq * ratio;
    o.type = i === 0 ? 'sine' : 'triangle';
    g.gain.setValueAtTime(volume * (i === 0 ? 0.3 : 0.12), now);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration * (i === 0 ? 0.7 : 0.5));
    o.start(now);
    o.stop(now + duration * (i === 0 ? 0.7 : 0.5));
  });
}

const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
function getNote(index) {
  return pentatonic[index % pentatonic.length];
}

document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('mousemove', initAudio, { once: true });

// ===== 反重力文字物理引擎 =====
function attachAntiGravity(el, options = {}) {
  const {
    floatAmp = 6,
    floatSpeed = 0.4,
    rotAmp = 2,
    pushRadius = 140,
    pushForce = 22,
    springK = 0.06,
    damping = 0.88
  } = options;

  let vx = 0, vy = 0, ox = 0, oy = 0;
  let phase = Math.random() * Math.PI * 2;
  let lastSoundTime = 0;
  let rafId = null;
  let isPushed = false;

  function floatTick() {
    if (isPushed) return;
    const time = Date.now() / 1000;
    const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
    const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.4);
    const rotZ = Math.sin(time * floatSpeed * 0.5 + phase) * rotAmp;
    el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;
  }

  function physicsTick() {
    if (!isPushed && Math.abs(ox) < 0.1 && Math.abs(oy) < 0.1 && Math.abs(vx) < 0.01 && Math.abs(vy) < 0.01) {
      ox = 0; oy = 0; vx = 0; vy = 0;
      rafId = null;
      return;
    }
    const ax = -ox * springK;
    const ay = -oy * springK;
    vx = (vx + ax) * damping;
    vy = (vy + ay) * damping;
    ox += vx; oy += vy;

    const time = Date.now() / 1000;
    const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
    const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.4);
    const rotZ = Math.sin(time * floatSpeed * 0.5 + phase) * rotAmp;
    el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;

    rafId = requestAnimationFrame(physicsTick);
  }

  function onPointerMove(e) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = cx - e.clientX;
    const dy = cy - e.clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < pushRadius && dist > 0) {
      const force = (pushRadius - dist) / pushRadius * pushForce;
      vx += (dx / dist) * force * 0.15;
      vy += (dy / dist) * force * 0.15;
      isPushed = true;

      const now = Date.now();
      if (now - lastSoundTime > 80) {
        const noteIdx = Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length;
        playChime(getNote(noteIdx), 0.12, 0.035);
        lastSoundTime = now;
      }
      if (!rafId) rafId = requestAnimationFrame(physicsTick);
    }
  }

  function onPointerLeave() {
    isPushed = false;
    if (!rafId) rafId = requestAnimationFrame(physicsTick);
    const noteIdx = Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length;
    playChime(getNote(noteIdx) * 0.5, 0.18, 0.02);
  }

  el.addEventListener('mousemove', onPointerMove);
  el.addEventListener('mouseleave', onPointerLeave);
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    onPointerMove({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: true });

  setInterval(floatTick, 33);
}

function initAntiGravity() {
  document.querySelectorAll('.ag-char').forEach((el) => {
    attachAntiGravity(el, {
      floatAmp: 4 + Math.random() * 5,
      floatSpeed: 0.25 + Math.random() * 0.35,
      rotAmp: 0.8 + Math.random() * 1.8,
      pushRadius: 120,
      pushForce: 18 + Math.random() * 10
    });
  });
}

function renderLandmarks() {
  const container = document.getElementById('landmarks');
  landmarksData.forEach((lm, idx) => {
    const section = document.createElement('section');
    section.className = 'landmark';
    section.innerHTML = `
      <div class="landmark-image-side">
        <div class="landmark-image-wrap">
          <img src="${lm.image}" alt="${lm.title}" loading="lazy">
          <div class="landmark-vertical-text">${lm.vertical}</div>
        </div>
      </div>
      <div class="landmark-text-side">
        <div class="landmark-num">${lm.num}</div>
        <div class="landmark-tag">${lm.tag}</div>
        <h2 class="landmark-title">
          ${lm.title.split('').map(ch => `<span class="ag-char">${ch}</span>`).join('')}
        </h2>
        <div class="landmark-accent-line"></div>
        <p class="landmark-desc">${lm.desc}</p>
        <p class="landmark-quote">${lm.quote}</p>
        <div class="landmark-bg-number">${lm.num}</div>
      </div>
    `;
    container.appendChild(section);
    if (idx < landmarksData.length - 1) {
      const divider = document.createElement('div');
      divider.className = 'section-divider';
      container.appendChild(divider);
    }
  });

  setTimeout(() => {
    document.querySelectorAll('.landmark .ag-char').forEach((el) => {
      attachAntiGravity(el, {
        floatAmp: 3 + Math.random() * 3,
        floatSpeed: 0.2 + Math.random() * 0.25,
        rotAmp: 0.5 + Math.random() * 1,
        pushRadius: 100,
        pushForce: 14
      });
    });
  }, 100);
}

function initScrollObserver() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -80px 0px' });
  document.querySelectorAll('.landmark').forEach(el => observer.observe(el));
}

function initNavScroll() {
  const nav = document.querySelector('.nav');
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (y > 60) {
      nav.style.background = 'rgba(245,240,232,.95)';
      nav.style.boxShadow = '0 1px 20px rgba(28,25,23,.06)';
    } else {
      nav.style.background = 'rgba(245,240,232,.88)';
      nav.style.boxShadow = 'none';
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initAntiGravity();
  renderLandmarks();
  initScrollObserver();
  initNavScroll();
});
</script>
