.ag-tag{font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.ag-body{max-width:800px;margin:0 auto;position:relative}

.ag-char{display:inline-block;position:relative;transition:none;will-change:transform,opacity;cursor:default}

.ag-char.pink{color:var(--pink)}

// ===== 反重力文字渲染引擎 =====
function createCharSpray(text,opts={}){
  const{colors=['white'],fontClass='',size=28,spacing=1}=opts;
  const wrapper=document.createElement('span');
  wrapper.className='char-spray';
  const chars=Array.from(text);
  chars.forEach((ch,i)=>{
    if(ch===' '){wrapper.appendChild(document.createTextNode(' '));return}
    const span=document.createElement('span');
    span.className='ag-char '+fontClass;
    const colorIdx=colors[i%colors.length];
    if(colorIdx)span.classList.add(colorIdx);
    span.textContent=ch;
    span.style.fontSize=size+'px';
    span.style.letterSpacing=spacing+'px';
    // 随机漂浮参数
    const duration=3+Math.random()*4;
    const delay=Math.random()*2;
    const rot=(Math.random()*8-4).toFixed(1);
    span.style.setProperty('--rot',rot+'deg');
    span.style.animation=`floatUp ${duration}s ease-in-out ${delay}s infinite`;
    // 鼠标交互
    attachMousePhysics(span);
    wrapper.appendChild(span);
  });
  return wrapper;
}

// ===== 鼠标物理交互 =====
function attachMousePhysics(el){
  let vx=0,vy=0,ox=0,oy=0,dragging=false;
  const spring=0.12,damping=0.82;
  const baseAnim=el.style.animation;

  function tick(){
    if(dragging)return;
    const ax=-ox*spring,ay=-oy*spring;
    vx=(vx+ax)*damping;
    vy=(vy+ay)*damping;
    ox+=vx;oy+=vy;
    if(Math.abs(ox)>.1||Math.abs(oy)>.1){
      el.style.transform=`translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px)`;
      el.style.animation='none';
      requestAnimationFrame(tick);
    }else{
      ox=0;oy=0;vx=0;vy=0;
      el.style.transform='';
      el.style.animation=baseAnim;
    }
  }

  el.addEventListener('pointerenter',()=>{
    const rect=el.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    // 鼠标进入时给一个推力
    const dx=cx-lastMouseX,dy=cy-lastMouseY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>0){
      const force=Math.min(40,800/dist);
      vx+=(dx/dist)*force*0.3;
      vy+=(dy/dist)*force*0.3;
    }
    if(!dragging){dragging=true;el.style.animation='none';requestAnimationFrame(tick)}
  });

  el.addEventListener('pointerleave',()=>{
    dragging=false;
    requestAnimationFrame(tick);
  });
}

    desc:'万寿山、昆明湖、长廊 728 米。乾隆为母亲祝寿而建，慈禧重建为行宫。佛香阁 41 米，立在万寿山上俯瞰昆明湖。十七孔桥的桥洞在冬至日落时被金光穿过。皇家园林的极致，是借自然做舞台。'
  }
];

// ===== 渲染地标章节 =====
(function(){
  const stage=document.getElementById('agStage');
  landmarks.forEach((lm,idx)=>{
    const section=document.createElement('div');
    section.className='ag-landmark';

    // 章节头
    const head=document.createElement('div');
    head.className='ag-landmark-head';
    head.innerHTML=`<span class="ag-number">${lm.num}</span><span class="ag-tag">${lm.tag}</span>`;
    section.appendChild(head);

    // 标题 - 反重力文字
    const titleWrap=document.createElement('div');
    titleWrap.className='ag-body';
    titleWrap.style.textAlign='center';
    titleWrap.style.marginBottom='0';
    const titleSize=lm.title.length>4?48:64;
    titleWrap.appendChild(createCharSpray(lm.title,{
      colors:lm.titleColors,
      fontClass:'serif bold',
      size:titleSize,
      spacing:3
    }));
    section.appendChild(titleWrap);

    // 建筑插画
    const building=document.createElement('div');
    building.className='ag-building';
    building.innerHTML=lm.building;
    section.appendChild(building);

    // 描述文字 - 也用反重力处理
    const descWrap=document.createElement('div');
    descWrap.className='ag-desc';
    descWrap.style.textAlign='center';
    // 描述用普通文字+轻微反重力
    const descSpray=createCharSpray(lm.desc,{
      colors:['dim'],
      size:15,
      spacing:0
    });
    descSpray.style.lineHeight='1.9';
    descWrap.appendChild(descSpray);
    section.appendChild(descWrap);

    // 分隔线
    if(idx<landmarks.length-1){
      const div=document.createElement('div');
      div.className='ag-divider';
      section.appendChild(div);
    }

    stage.appendChild(section);
  });
})();

// ===== 全局鼠标推开效果（第二个交互层） =====
let mouseRAF=null;
document.addEventListener('pointermove',e=>{
  if(mouseRAF)return;
  mouseRAF=requestAnimationFrame(()=>{
    mouseRAF=null;
    // 轻量级：只检查视口内的字符
    const els=document.elementsFromPoint(e.clientX,e.clientY);
    els.forEach(el=>{
      if(el.classList&&el.classList.contains('ag-char')){
        // 已被 attachMousePhysics 处理
      }
    });
  });
});
</script>
