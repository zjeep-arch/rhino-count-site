<script>
// ===== Web Audio API 声音系统 =====
let audioCtx = null;
let audioEnabled = false;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioEnabled = true;
  } catch(e) {
    console.log('Web Audio not supported');
  }
}

// 播放风铃般的声音
function playChime(freq, duration = 0.15, volume = 0.04) {
  if (!audioEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const now = audioCtx.currentTime;

  // 主音
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = freq;
  osc.type = 'sine';
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.start(now);
  osc.stop(now + duration);

  // 泛音 - 营造风铃感
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  osc2.frequency.value = freq * 1.5;
  osc2.type = 'sine';
  gain2.gain.setValueAtTime(volume * 0.3, now);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.7);
  osc2.start(now);
  osc2.stop(now + duration * 0.7);

  // 高频泛音
  const osc3 = audioCtx.createOscillator();
  const gain3 = audioCtx.createGain();
  osc3.connect(gain3);
  gain3.connect(audioCtx.destination);
  osc3.frequency.value = freq * 2;
  osc3.type = 'triangle';
  gain3.gain.setValueAtTime(volume * 0.15, now);
  gain3.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.5);
  osc3.start(now);
  osc3.stop(now + duration * 0.5);
}

// 播放推开时的"嗖"声
function playWhoosh(intensity = 1) {
  if (!audioEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const now = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }

  const source = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();

  source.buffer = buffer;
  filter.type = 'lowpass';
  filter.frequency.value = 800 + intensity * 400;
  filter.Q.value = 1;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.02 * intensity, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

  source.start(now);
  source.stop(now + 0.1);
}

// 音阶映射（五声音阶）
const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
function getNote(index) {
  return pentatonic[index % pentatonic.length];
}

// 首次交互时初始化音频
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('mousemove', initAudio, { once: true });

// ===== 反重力文字物理引擎 =====
function attachAntiGravity(el, options = {}) {
  const {
    floatAmp = 8,
    floatSpeed = 0.4,
    rotAmp = 2,
    pushRadius = 150,
    pushForce = 25,
    springK = 0.06,
    damping = 0.88
  } = options;

  let vx = 0, vy = 0, ox = 0, oy = 0;
  let baseY = 0;
  let phase = Math.random() * Math.PI * 2;
  let lastSoundTime = 0;
  let rafId = null;
  let isPushed = false;

  // 基础漂浮动画
  function floatTick() {
    if (isPushed) return;
    const time = Date.now() / 1000;
    const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
    const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.4);
    const rotZ = Math.sin(time * floatSpeed * 0.5 + phase) * rotAmp;

    el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;
  }

  // 物理回弹
  function physicsTick() {
    if (!isPushed && Math.abs(ox) < 0.1 && Math.abs(oy) < 0.1 && Math.abs(vx) < 0.01 && Math.abs(vy) < 0.01) {
      ox = 0; oy = 0; vx = 0; vy = 0;
      rafId = null;
      return;
    }

    const ax = -ox * springK;
    const ay = -oy * springK;
    vx = (vx + ax) * damping;
    vy = (vy + ay) * damping;
    ox += vx;
    oy += vy;

    const time = Date.now() / 1000;
    const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
    const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.4);
    const rotZ = Math.sin(time * floatSpeed * 0.5 + phase) * rotAmp;

    el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;

    rafId = requestAnimationFrame(physicsTick);
  }

  // 鼠标交互
  function onPointerMove(e) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = cx - e.clientX;
    const dy = cy - e.clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < pushRadius && dist > 0) {
      const force = (pushRadius - dist) / pushRadius * pushForce;
      vx += (dx / dist) * force * 0.15;
      vy += (dy / dist) * force * 0.15;
      isPushed = true;

      // 声音
      const now = Date.now();
      if (now - lastSoundTime > 80) {
        const noteIdx = Math.floor(el.textContent.charCodeAt(0) % pentatonic.length);
        playChime(getNote(noteIdx), 0.12, 0.035);
        lastSoundTime = now;
      }

      if (!rafId) rafId = requestAnimationFrame(physicsTick);
    }
  }

  function onPointerLeave() {
    isPushed = false;
    if (!rafId) rafId = requestAnimationFrame(physicsTick);

    // 归位音效
    const noteIdx = Math.floor(el.textContent.charCodeAt(0) % pentatonic.length);
    playChime(getNote(noteIdx) * 0.5, 0.2, 0.025);
  }

  el.addEventListener('mousemove', onPointerMove);
  el.addEventListener('mouseleave', onPointerLeave);

  // 触摸
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    onPointerMove({ clientX: t.clientX, clientY: t.clientY });
  }, { passive: true });

  // 启动漂浮
  setInterval(floatTick, 33);
}

// 为所有 ag-char 附加反重力
function initAntiGravity() {
  document.querySelectorAll('.ag-char').forEach((el, i) => {
    attachAntiGravity(el, {
      floatAmp: 6 + Math.random() * 6,
      floatSpeed: 0.3 + Math.random() * 0.3,
      rotAmp: 1 + Math.random() * 2,
      pushRadius: 120,
      pushForce: 20 + Math.random() * 10
    });
  });
}

// 渲染地标
function renderLandmarks() {
  const container = document.getElementById('landmarks');

  landmarksData.forEach((lm, idx) => {
    const section = document.createElement('section');
    section.className = 'landmark';
    section.dataset.idx = idx;

    section.innerHTML = `
      <div class="landmark-image-side">
        <div class="landmark-image-frame">
          <img src="${lm.image}" alt="${lm.title}" loading="lazy">
          <div class="landmark-vertical-text">${lm.vertical}</div>
        </div>
      </div>
      <div class="landmark-text-side">
        <div class="landmark-num">${lm.num}</div>
        <div class="landmark-tag">${lm.tag}</div>
        <h2 class="landmark-title" style="color: ${lm.color};">
          ${lm.title.split('').map(ch => `<span class="ag-char">${ch}</span>`).join('')}
        </h2>
        <div class="landmark-accent-line"></div>
        <p class="landmark-desc">${lm.desc}</p>
        <p class="landmark-quote">${lm.quote}</p>
        <div class="landmark-bg-number">${lm.num}</div>
      </div>
    `;

    container.appendChild(section);

    // 添加section之间的分隔
    if (idx < landmarksData.length - 1) {
      const divider = document.createElement('div');
      divider.className = 'section-divider';
      container.appendChild(divider);
    }
  });

  // 重新初始化反重力（新渲染的文字）
  setTimeout(() => {
    document.querySelectorAll('.landmark .ag-char').forEach((el, i) => {
      attachAntiGravity(el, {
        floatAmp: 3 + Math.random() * 4,
        floatSpeed: 0.2 + Math.random() * 0.3,
        rotAmp: 0.5 + Math.random() * 1.5,
        pushRadius: 100,
        pushForce: 15
      });
    });
  }, 100);
}

// ===== 滚动入场动画 =====
function initScrollObserver() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -80px 0px' });

  document.querySelectorAll('.landmark').forEach(el => observer.observe(el));
}

// ===== 导航栏滚动效果 =====
function initNavScroll() {
  const nav = document.querySelector('.nav');
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (y > 60) {
      nav.style.background = 'rgba(245,240,232,.95)';
      nav.style.boxShadow = '0 1px 20px rgba(28,25,23,.06)';
    } else {
      nav.style.background = 'rgba(245,240,232,.85)';
      nav.style.boxShadow = 'none';
    }
  });
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  initAntiGravity();
  renderLandmarks();
  initScrollObserver();
  initNavScroll();
});
