<html lang="zh-CN">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #e8dfca;
    --ink: #2e251f;
    --muted: #70665b;
    --hairline: rgba(46, 37, 31, .36);
    --panel: rgba(232, 223, 202, .93);
    --dot: #c4bfb5;
    --temple-width: min(620px, 62vw);
  }

  [data-theme="night"] {
    --paper: #1a1520;
    --ink: #e8dfca;
    --muted: #968a7e;
    --hairline: rgba(232, 223, 202, .28);
    --panel: rgba(26, 21, 32, .93);
    --dot: #4a4252;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', Georgia, 'Songti SC', serif;
    line-height: 1.8;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background .6s ease, color .6s ease;
  }

  /* ===== 纸质纹理背景 ===== */
  .artboard {
    position: relative;
    min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background:
      repeating-linear-gradient(91deg, rgba(46, 37, 31, .022) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(2deg, rgba(46, 37, 31, .017) 0 1px, transparent 1px 14px),
      radial-gradient(circle at 53% 16%, rgba(255,255,255,.26), transparent 34%),
      var(--paper);
  }

  [data-theme="night"] .artboard {
    background:
      repeating-linear-gradient(91deg, rgba(232, 223, 202, .015) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(2deg, rgba(232, 223, 202, .012) 0 1px, transparent 1px 14px),
      radial-gradient(circle at 53% 16%, rgba(100, 80, 130, .12), transparent 34%),
      var(--paper);
  }

  .artboard::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: .14;
    background-image:
      radial-gradient(circle at 24% 31%, currentColor 0 .5px, transparent .65px),
      radial-gradient(circle at 71% 56%, currentColor 0 .45px, transparent .6px);
    background-size: 9px 11px, 13px 15px;
    mix-blend-mode: multiply;
  }

  [data-theme="night"] .artboard::after {
    mix-blend-mode: screen;
    opacity: .08;
  }

  /* ===== 导航 masthead ===== */
  .masthead {
    position: absolute;
    z-index: 8;
    top: 28px;
    left: clamp(24px, 5vw, 94px);
    right: clamp(24px, 5vw, 94px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 28px;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
  }
  .brand {
    color: var(--ink);
    font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }
  .nav-links a {
    color: inherit;
    text-decoration: none;
    transition: color .3s;
  }
  .nav-links a:hover { color: var(--ink); }

  .masthead-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .github-link {
    padding: 7px 0 6px;
    border-bottom: 1px solid transparent;
    color: inherit;
    text-decoration: none;
    font: 12px/1 'Inter', sans-serif;
    transition: all .3s;
  }
  .github-link:hover { color: var(--ink); border-bottom-color: currentColor; }
  .configure {
    border: 0;
    padding: 10px 24px;
    color: var(--paper);
    background: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    clip-path: polygon(4% 6%, 96% 0, 100% 91%, 2% 100%);
    letter-spacing: 0.02em;
    transition: all .3s;
  }
  .configure:hover { opacity: .85; transform: translateY(-1px); }

  /* theme & sound toggles */
  .toggle-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-content: center;
    border-radius: 2px;
    transition: all .3s;
    font-size: 16px;
    line-height: 1;
  }
  .toggle-btn:hover { color: var(--ink); border-color: var(--muted); }
  .toggle-btn.active { color: var(--ink); border-color: var(--ink); }

  /* ===== Temple Image ===== */
  .temple {
    position: absolute;
    z-index: 4;
    top: clamp(48px, 6vh, 72px);
    left: 50%;
    width: var(--temple-width);
    transform: translateX(-50%);
    pointer-events: none;
    transition: filter .6s ease;
  }
  .temple img {
    width: 100%;
    height: auto;
    display: block;
    mix-blend-mode: multiply;
    filter:
      drop-shadow(34px 38px 18px rgba(46, 37, 31, .19))
      drop-shadow(70px 64px 34px rgba(46, 37, 31, .10));
  }
  [data-theme="night"] .temple img {
    mix-blend-mode: screen;
    filter:
      drop-shadow(34px 38px 18px rgba(100, 80, 130, .25))
      drop-shadow(0 0 60px rgba(80, 60, 120, .15))
      brightness(.85) saturate(1.1);
  }

  /* ===== Headline ===== */
  .headline {
    position: absolute;
    z-index: 6;
    left: clamp(28px, 6vw, 112px);
    bottom: clamp(38px, 8vh, 92px);
    width: min(330px, 31vw);
    pointer-events: none;
  }
  .eyebrow {
    margin: 0 0 16px;
    font: 12px/1.3 'Inter', ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font: 700 clamp(48px, 5.5vw, 86px)/.86 'Playfair Display', Georgia, "Times New Roman", serif;
    letter-spacing: -1px;
    color: var(--ink);
  }
  h1 .ag-char {
    display: inline-block;
    cursor: default;
    user-select: none;
  }
  .rule {
    display: inline-block;
    width: 76px;
    margin-left: 15px;
    border-top: 1px solid var(--ink);
    transform: translateY(-.35em);
    opacity: .3;
  }

  /* ===== Progress bar ===== */
  .progress {
    position: absolute;
    z-index: 6;
    left: 50%;
    bottom: 22px;
    width: 140px;
    height: 2px;
    transform: translateX(-50%);
    background: rgba(46,37,31,.18);
  }
  [data-theme="night"] .progress { background: rgba(232,223,202,.15); }
  .progress::before {
    content: "";
    display: block;
    width: 42%;
    height: 100%;
    background: rgba(46,37,31,.55);
    transition: width .3s ease;
  }
  [data-theme="night"] .progress::before { background: rgba(232,223,202,.5); }

  /* ===== Interaction counter ===== */
  .counter {
    position: absolute;
    z-index: 6;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%);
    font: 10px/1 'Inter', ui-monospace, monospace;
    color: var(--muted);
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity .4s;
  }
  .counter.visible { opacity: 1; }

  /* ===== Canvas 珠帘 ===== */
  #curtain {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    cursor: none;
    touch-action: none;
  }

  .cursor {
    position: absolute;
    z-index: 12;
    width: 12px;
    height: 12px;
    border: 1px solid rgba(46, 37, 31, .72);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }
  [data-theme="night"] .cursor { border-color: rgba(232, 223, 202, .72); }
  .artboard.is-active .cursor { opacity: 1; }

  /* ===== 配置面板 ===== */
  .settings {
    position: absolute;
    z-index: 20;
    top: 62px;
    right: clamp(24px, 5vw, 94px);
    width: 238px;
    padding: 16px;
    border: 1px solid var(--hairline);
    background: var(--panel);
    box-shadow: 16px 18px 32px rgba(46, 37, 31, .12);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  [data-theme="night"] .settings {
    box-shadow: 16px 18px 32px rgba(0, 0, 0, .4);
  }
  .settings[hidden] { display: none; }
  .setting { display: grid; gap: 6px; margin-bottom: 13px; }
  .setting label {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font: 11px/1 'Inter', ui-monospace, monospace;
  }
  .setting input { width: 100%; accent-color: var(--ink); }
  .reset-btn {
    width: 100%;
    border: 1px solid var(--hairline);
    padding: 7px 10px;
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    font: 11px/1 'Inter', ui-monospace, monospace;
    transition: all .3s;
  }
  .reset-btn:hover { border-color: var(--muted); }

  /* ===== 响应式 ===== */
  @media(max-width: 720px) {
    .masthead { grid-template-columns: 1fr auto; }
    .nav-links { display: none; }
    .temple { top: 66px; width: min(520px, 96vw); }
    .headline { left: 24px; bottom: 38px; width: min(285px, 72vw); }
    h1 { font-size: clamp(42px, 14vw, 66px); }
    .progress { display: none; }
    .counter { display: none; }
  }

  @media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<body>

<main class="artboard" id="artboard">
  <canvas id="curtain" aria-label="天坛屋檐下可交互的中文珠帘"></canvas>

  <header class="masthead">
    <a class="brand" href="index.html#builds">犀牛伯爵</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="#home">首页</a>

    </nav>
    <div class="masthead-actions">
      <button class="toggle-btn" id="themeToggle" type="button" title="切换昼夜主题" aria-label="切换昼夜主题">☀</button>
      <button class="toggle-btn" id="soundToggle" type="button" title="开关声音" aria-label="开关声音">♪</button>
      <a class="github-link" href="https://github.com/CodeMaryy/temple-of-heaven-curtain" target="_blank" rel="noopener noreferrer">参考</a>

    </div>
  </header>

  <div class="temple" id="temple">
    <img src="assets/temple-roof-cutout-web.webp" alt="天坛祈年殿屋顶" width="901" height="730" fetchpriority="high" decoding="async"
         onerror="this.onerror=null;this.src='temple-of-heaven.png';this.removeAttribute('width');this.removeAttribute('height')">
  </div>

  <section class="headline" id="home">
    <p class="eyebrow">北京 (Beijing) / 天地之间</p>
    <h1 id="heroTitle">
      <span class="ag-char">T</span><span class="ag-char">e</span><span class="ag-char">m</span><span class="ag-char">p</span><span class="ag-char">l</span><span class="ag-char">e</span><br>
      <span class="ag-char">o</span><span class="ag-char">f</span><br>
      <span class="ag-char">H</span><span class="ag-char">e</span><span class="ag-char">a</span><span class="ag-char">v</span><span class="ag-char">e</span><span class="ag-char">n</span><span class="rule"></span>
    </h1>
  </section>

  <div class="progress" aria-hidden="true"></div>
  <div class="counter" id="counter" aria-hidden="true">珠帘触碰 · 0</div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <aside class="settings" id="settings" hidden>
    <div class="setting"><label for="strength">Strength <output id="strengthValue">72</output></label><input id="strength" type="range" min="20" max="110" value="72"></div>
    <div class="setting"><label for="reach">Reach <output id="reachValue">34</output></label><input id="reach" type="range" min="18" max="56" value="34"></div>
    <div class="setting"><label for="inertia">Inertia <output id="inertiaValue">97</output></label><input id="inertia" type="range" min="86" max="99" value="97"></div>
    <div class="setting"><label for="breeze">Auto Breeze <output id="breezeValue">0</output></label><input id="breeze" type="range" min="0" max="100" value="0"></div>
    <button class="reset-btn" id="resetCurtain" type="button">Reset curtain</button>
  </aside>
</main>

<script>
(() => {
  // ===== 反重力标题 =====
  let audioCtx = null;
  let soundEnabled = true;

  function attachAntiGravity(el, options = {}) {
    const { floatAmp = 5, floatSpeed = 0.35, rotAmp = 1.5, pushRadius = 130, pushForce = 20, springK = 0.055, damping = 0.89 } = options;
    let vx = 0, vy = 0, ox = 0, oy = 0, phase = Math.random() * Math.PI * 2;
    let lastSoundTime = 0, rafId = null, isPushed = false;

    const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    function playChime(freq, duration, volume) {
      if (!audioCtx || audioCtx.state === 'suspended' || !soundEnabled) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.start(now); osc.stop(now + duration);
    }

    function floatTick() {
      if (isPushed) return;
      const time = Date.now() / 1000;
      const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
      const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.35);
      const rotZ = Math.sin(time * floatSpeed * 0.45 + phase) * rotAmp;
      el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;
    }

    function physicsTick() {
      if (!isPushed && Math.abs(ox) < 0.1 && Math.abs(oy) < 0.1 && Math.abs(vx) < 0.01 && Math.abs(vy) < 0.01) {
        ox = 0; oy = 0; vx = 0; vy = 0; rafId = null; return;
      }
      const ax = -ox * springK, ay = -oy * springK;
      vx = (vx + ax) * damping; vy = (vy + ay) * damping;
      ox += vx; oy += vy;
      const time = Date.now() / 1000;
      const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
      const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.35);
      const rotZ = Math.sin(time * floatSpeed * 0.45 + phase) * rotAmp;
      el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;
      rafId = requestAnimationFrame(physicsTick);
    }

    el.addEventListener('mousemove', (e) => {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const dx = cx - e.clientX, dy = cy - e.clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < pushRadius && dist > 0) {
        const force = (pushRadius - dist) / pushRadius * pushForce;
        vx += (dx / dist) * force * 0.12; vy += (dy / dist) * force * 0.12;
        isPushed = true;
        const now = Date.now();
        if (now - lastSoundTime > 90) {
          playChime(pentatonic[Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length], 0.1, 0.03);
          lastSoundTime = now;
        }
        if (!rafId) rafId = requestAnimationFrame(physicsTick);
      }
    });
    el.addEventListener('mouseleave', () => {
      isPushed = false;
      if (!rafId) rafId = requestAnimationFrame(physicsTick);
      playChime(pentatonic[Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length] * 0.5, 0.15, 0.02);
    });
    setInterval(floatTick, 33);
  }

  // ===== Canvas 珠帘 Verlet 物理 =====
  const artboard = document.getElementById('artboard');
  const canvas = document.getElementById('curtain');
  const ctx = canvas.getContext('2d');
  const cursor = document.getElementById('cursor');
  const temple = document.getElementById('temple');
  const configure = document.getElementById('configure');
  const settings = document.getElementById('settings');
  const resetBtn = document.getElementById('resetCurtain');
  const counterEl = document.getElementById('counter');
  const chains = [];
  let glyphs = '天坛祈年风调雨顺天地玄黄日月星辰礼乐文明北京春秋山川云海';
  const mouse = { x: -999, y: -999, oldX: -999, oldY: -999, active: false };
  const physics = { strength: .72, radius: 34, friction: .965, gravity: .18 };
  const sound = {
    context: null, output: null, lastStrike: [], lastGlobal: 0, voices: 0,
    scale: [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760]
  };
  let width = 0, height = 0, dpr = 1;
  let interactionCount = 0;
  let breezeIntensity = 0;
  let breezePhase = 0;

  function unlockSound() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    if (!sound.context) {
      const context = new AudioContext();
      const output = context.createGain();
      const compressor = context.createDynamicsCompressor();
      const delay = context.createDelay(.3);
      const feedback = context.createGain();
      const wet = context.createGain();
      output.gain.value = .62;
      compressor.threshold.value = -18; compressor.ratio.value = 3;
      delay.delayTime.value = .11; feedback.gain.value = .14; wet.gain.value = .13;
      output.connect(compressor); output.connect(delay);
      delay.connect(feedback); feedback.connect(delay); delay.connect(wet); wet.connect(compressor);
      compressor.connect(context.destination);
      sound.context = context; sound.output = output;
    }
    if (sound.context.state === 'suspended') sound.context.resume().catch(() => {});
    if (!audioCtx) audioCtx = sound.context;
  }

  function strikeChain(columnIndex, impact, x) {
    const context = sound.context;
    if (!context || context.state !== 'running' || impact < 1.1 || !soundEnabled) return;
    const timestamp = performance.now();
    if (timestamp - (sound.lastStrike[columnIndex] || 0) < 95) return;
    if (timestamp - sound.lastGlobal < 28 || sound.voices >= 8) return;
    sound.lastStrike[columnIndex] = timestamp;
    sound.lastGlobal = timestamp;
    sound.voices += 1;

    const now = context.currentTime;
    const frequency = sound.scale[columnIndex % sound.scale.length];
    const level = .028 + Math.min(impact, 18) / 18 * .075;
    const duration = .72 + Math.random() * .32;
    const spatial = context.createStereoPanner ? context.createStereoPanner() : context.createGain();
    const pan = Math.max(-.9, Math.min(.9, x / width * 2 - 1));
    if (spatial.pan) spatial.pan.setValueAtTime(pan, now);
    spatial.connect(sound.output);

    [{ratio:1,amount:1,decay:1},{ratio:2.01,amount:.24,decay:.62},{ratio:3.96,amount:.1,decay:.38}].forEach(partial => {
      const oscillator = context.createOscillator();
      const envelope = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency * partial.ratio, now);
      oscillator.detune.setValueAtTime((Math.random()-.5)*8, now);
      envelope.gain.setValueAtTime(level * partial.amount, now);
      envelope.gain.exponentialRampToValueAtTime(.0001, now + duration * partial.decay);
      oscillator.connect(envelope); envelope.connect(spatial);
      oscillator.start(now); oscillator.stop(now + duration + .05);
    });

    window.setTimeout(() => {
      sound.voices = Math.max(0, sound.voices - 1);
      spatial.disconnect();
    }, (duration + .15) * 1000);
  }

  function build() {
    chains.length = 0;
    const narrow = width < 720;
    const columns = narrow ? 16 : 26;
    const templeRect = temple.getBoundingClientRect();
    const artboardRect = artboard.getBoundingClientRect();
    const buildingCenter = templeRect.left - artboardRect.left + templeRect.width * .5;
    const curtainWidth = templeRect.width * .84;
    const left = buildingCenter - curtainWidth / 2;
    const templeTop = templeRect.top - artboardRect.top;
    const roofScale = templeRect.width / 901;
    const centerEdge = templeTop + 682 * roofScale;
    const sideEdge = templeTop + 726 * roofScale;
    const curtainBottom = height - (narrow ? 42 : 48);
    const availableHeight = Math.max(120, curtainBottom - sideEdge);
    const rows = Math.max(18, Math.min(narrow ? 35 : 39, Math.floor(availableHeight / 9.4) + 1));

    for (let column = 0; column < columns; column += 1) {
      const x = left + column * curtainWidth / (columns - 1);
      const normalizedX = Math.abs(column / (columns - 1) * 2 - 1);
      const top = centerEdge + (sideEdge - centerEdge) * Math.pow(normalizedX, 1.7) - 4;
      const segmentLength = Math.max(6.4, (curtainBottom - top) / (rows - 1));
      const readingColumn = columns - 1 - column;
      const chain = [];
      for (let row = 0; row < rows; row += 1) {
        const y = top + row * segmentLength;
        chain.push({
          x, y, oldX: x, oldY: y, anchorX: x, anchorY: y,
          pinned: row === 0, restLength: segmentLength,
          char: glyphs[(readingColumn * rows + row) % glyphs.length],
          alpha: .36 + ((column + row * 2) % 6) * .055
        });
      }
      chains.push(chain);
    }
  }

  function resize() {
    const rect = artboard.getBoundingClientRect();
    width = rect.width; height = rect.height;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function injectMouseDelta() {
    if (!mouse.active) return;
    const moveX = mouse.x - mouse.oldX;
    const moveY = mouse.y - mouse.oldY;
    const speed = Math.hypot(moveX, moveY);
    if (speed < .01 || speed > 80) return;
    for (let chainIndex = 0; chainIndex < chains.length; chainIndex += 1) {
      const chain = chains[chainIndex];
      let strongestImpact = 0;
      for (let index = 1; index < chain.length; index += 1) {
        const point = chain[index];
        const distance = Math.hypot(point.x - mouse.oldX, point.y - mouse.oldY);
        if (distance >= physics.radius) continue;
        const falloff = 1 - distance / physics.radius;
        strongestImpact = Math.max(strongestImpact, speed * falloff);
        point.x += moveX * physics.strength * falloff;
        point.y += moveY * physics.strength * falloff;
      }
      if (strongestImpact > 0) {
        strikeChain(chainIndex, strongestImpact, chain[0].x);
        registerInteraction();
      }
    }
  }

  function injectBreeze() {
    if (breezeIntensity <= 0) return;
    breezePhase += 0.015;
    const swayAmount = breezeIntensity * 0.015;
    for (let chainIndex = 0; chainIndex < chains.length; chainIndex += 1) {
      const chain = chains[chainIndex];
      const phaseOffset = chainIndex * 0.3;
      const sway = Math.sin(breezePhase + phaseOffset) * swayAmount;
      const heightFactor = 0;
      let strongestImpact = 0;
      for (let index = 1; index < chain.length; index += 1) {
        const point = chain[index];
        const heightRatio = index / chain.length;
        const localSway = sway * heightRatio * heightRatio;
        point.x += localSway;
        strongestImpact = Math.max(strongestImpact, Math.abs(localSway) * 20);
      }
      if (strongestImpact > 1.2 && Math.random() < 0.02) {
        strikeChain(chainIndex, strongestImpact, chain[0].x);
      }
    }
  }

  function registerInteraction() {
    interactionCount++;
    counterEl.textContent = `珠帘触碰 · ${interactionCount}`;
    counterEl.classList.add('visible');
    clearTimeout(counterEl._timer);
    counterEl._timer = setTimeout(() => counterEl.classList.remove('visible'), 2000);
  }

  function integrate() {
    for (const chain of chains) {
      for (const point of chain) {
        if (point.pinned) continue;
        const velocityX = (point.x - point.oldX) * physics.friction;
        const velocityY = (point.y - point.oldY) * physics.friction;
        point.oldX = point.x; point.oldY = point.y;
        point.x += velocityX; point.y += velocityY + physics.gravity;
      }
    }
  }

  function constrain() {
    for (let pass = 0; pass < 8; pass += 1) {
      for (const chain of chains) {
        const anchor = chain[0];
        anchor.x = anchor.anchorX; anchor.y = anchor.anchorY;
        for (let index = 1; index < chain.length; index += 1) {
          const a = chain[index - 1], b = chain[index];
          const dx = b.x - a.x, dy = b.y - a.y;
          const distance = Math.max(.0001, Math.hypot(dx, dy));
          const difference = (distance - b.restLength) / distance;
          if (a.pinned) {
            b.x -= dx * difference; b.y -= dy * difference;
          } else {
            const cx = dx * difference * .5, cy = dy * difference * .5;
            a.x += cx; a.y += cy; b.x -= cx; b.y -= cy;
          }
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    ctx.fillStyle = inkColor || '#2e251f';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '500 10px ui-monospace, SFMono-Regular, Menlo, monospace';
    for (const chain of chains) {
      for (const point of chain) {
        ctx.globalAlpha = point.alpha;
        ctx.fillText(point.char, point.x, point.y);
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame() {
    injectBreeze();
    integrate(); constrain(); draw();
    requestAnimationFrame(frame);
  }

  function enter(event) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = mouse.oldX = event.clientX - rect.left;
    mouse.y = mouse.oldY = event.clientY - rect.top;
    mouse.active = true;
    cursor.style.left = `${mouse.x}px`; cursor.style.top = `${mouse.y}px`;
    artboard.classList.add('is-active');
  }

  function move(event) {
    if (!mouse.active) enter(event);
    mouse.oldX = mouse.x; mouse.oldY = mouse.y;
    const rect = canvas.getBoundingClientRect();
    mouse.x = event.clientX - rect.left; mouse.y = event.clientY - rect.top;
    injectMouseDelta();
    cursor.style.left = `${mouse.x}px`; cursor.style.top = `${mouse.y}px`;
  }

  function leave() {
    mouse.active = false;
    artboard.classList.remove('is-active');
  }

  function bindRange(id, outputId, update) {
    const input = document.getElementById(id);
    const output = document.getElementById(outputId);
    input.addEventListener('input', () => {
      const value = Number(input.value);
      output.value = String(value);
      update(value);
    });
  }

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('temple-theme');
  if (savedTheme === 'night') {
    document.documentElement.setAttribute('data-theme', 'night');
    themeToggle.textContent = '☾';
    themeToggle.classList.add('active');
  }
  themeToggle.addEventListener('click', () => {
    const isNight = document.documentElement.getAttribute('data-theme') === 'night';
    if (isNight) {
      document.documentElement.removeAttribute('data-theme');
      themeToggle.textContent = '☀';
      themeToggle.classList.remove('active');
      localStorage.setItem('temple-theme', 'day');
    } else {
      document.documentElement.setAttribute('data-theme', 'night');
      themeToggle.textContent = '☾';
      themeToggle.classList.add('active');
      localStorage.setItem('temple-theme', 'night');
    }
  });

  // Sound toggle
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.classList.add('active');
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      soundToggle.textContent = '♪';
      soundToggle.classList.add('active');
      unlockSound();
    } else {
      soundToggle.textContent = '✕';
      soundToggle.classList.remove('active');
    }
  });

  configure.addEventListener('click', () => {
    const open = settings.hidden;
    settings.hidden = !open;
    configure.setAttribute('aria-expanded', String(open));
  });
  resetBtn.addEventListener('click', build);
  bindRange('strength', 'strengthValue', v => { physics.strength = v / 100; });
  bindRange('reach', 'reachValue', v => { physics.radius = v; });
  bindRange('inertia', 'inertiaValue', v => { physics.friction = v / 100; });
  bindRange('breeze', 'breezeValue', v => { breezeIntensity = v; });

  canvas.addEventListener('pointerenter', enter);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerleave', leave);
  window.addEventListener('pointerdown', unlockSound, { passive: true });
  window.addEventListener('resize', resize);

  // Load body text
  async function loadBodyText() {
    try {
      const response = await fetch('assets/tiantan.txt');
      if (!response.ok) throw new Error(`Unable to load body text: ${response.status}`);
      const characters = (await response.text()).match(/\p{Script=Han}/gu);
      if (characters && characters.length) {
        glyphs = characters.join('');
        build();
      }
    } catch (error) {
      console.warn(error);
    }
  }

  // ===== 初始化 =====
  function init() {
    document.querySelectorAll('.ag-char').forEach(el => {
      attachAntiGravity(el, { floatAmp: 3 + Math.random() * 4, floatSpeed: 0.25 + Math.random() * 0.3, rotAmp: 0.6 + Math.random() * 1.4, pushRadius: 110, pushForce: 16 });
    });
    resize();
    loadBodyText();
    frame();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
