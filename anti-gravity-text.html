<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #e8dfca;
    --ink: #2e251f;
    --muted: #70665b;
    --hairline: rgba(46, 37, 31, .36);
    --panel: rgba(232, 223, 202, .93);
    --dot: #c4bfb5;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', Georgia, 'Songti SC', serif;
    line-height: 1.8;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ===== 纸质纹理背景 ===== */
  .artboard {
    position: relative;
    min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background:
      repeating-linear-gradient(91deg, rgba(46, 37, 31, .022) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(2deg, rgba(46, 37, 31, .017) 0 1px, transparent 1px 14px),
      radial-gradient(circle at 53% 16%, rgba(255,255,255,.26), transparent 34%),
      var(--paper);
  }

  .artboard::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: .14;
    background-image:
      radial-gradient(circle at 24% 31%, currentColor 0 .5px, transparent .65px),
      radial-gradient(circle at 71% 56%, currentColor 0 .45px, transparent .6px);
    background-size: 9px 11px, 13px 15px;
    mix-blend-mode: multiply;
  }

  /* ===== 导航 ===== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 48px;
    background: rgba(232, 223, 202, .88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nav-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  .nav-links {
    display: flex;
    gap: 48px;
    list-style: none;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  .nav-links a {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: color .3s;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--paper);
    background: var(--ink);
    padding: 10px 24px;
    border: 0;
    border-radius: 2px;
    text-decoration: none;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all .3s;
    clip-path: polygon(4% 6%, 96% 0, 100% 91%, 2% 100%);
  }
  .nav-btn:hover {
    background: #3a3028;
    transform: translateY(-1px);
  }

  /* ===== Hero ===== */
  .hero {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1.6fr 1fr;
    align-items: end;
    padding: 120px 48px 80px;
    gap: 0;
    max-width: 1440px;
    margin: 0 auto;
  }

  .hero-left {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 80px;
    padding-right: 20px;
    position: relative;
    z-index: 12;
  }
  .hero-eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .hero-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(56px, 7vw, 96px);
    font-weight: 700;
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: -2px;
    margin-bottom: 16px;
  }
  .hero-title .ag-char {
    display: inline-block;
    cursor: default;
    user-select: none;
  }
  .hero-accent-line {
    width: 40px;
    height: 1px;
    background: var(--ink);
    opacity: .25;
    margin-top: 20px;

  .hero-circle {
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    opacity: .25;
    position: absolute;
    right: 40px;
    top: 52%;

  .hero-center {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 40px;
    z-index: 5;
  }
  .hero-image-wrap {
    position: relative;
    width: 100%;
    max-width: 520px;

  }
  .hero-image {
    width: 100%;
    display: block;
    mix-blend-mode: multiply;
    filter: saturate(0.92) contrast(1.05);

  /* 图片下方竖排可点击文字 */
  .wind-text-container {
    display: flex;
    gap: 5px;
    margin-top: 20px;
    cursor: pointer;
    padding: 8px;
    position: relative;
    z-index: 12;

    writing-mode: vertical-rl;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
    line-height: 1;
    transition: color .3s;
    cursor: pointer;
    user-select: none;
    position: relative;

  .wind-char:hover { color: var(--ink); }
  .wind-char.wind-blown {
    animation: windSway 0.7s ease-in-out;
  }
  @keyframes windSway {
    0% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(10deg) translateX(4px); }
    45% { transform: rotate(-6deg) translateX(-3px); }
    70% { transform: rotate(4deg) translateX(2px); }
    100% { transform: rotate(0deg) translateX(0); }

  .hero-right {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    height: 100%;
    padding-bottom: 80px;
    padding-left: 20px;
    position: relative;
    z-index: 12;
  }
  .hero-nav-box {
    width: 72px;
    height: 72px;
    border: 1px solid var(--hairline);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all .3s;
    background: transparent;
    margin-top: 20px;

  .hero-nav-box:hover {
    border-color: var(--muted);
  }
  .hero-nav-box .curve {
    width: 16px;
    height: 6px;
    border-top: 1px solid var(--muted);
    border-radius: 50% 50% 0 0;
    opacity: .5;

    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .06em;

  .hero-quote {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 14px;
    font-style: italic;
    color: var(--muted);

    max-width: 200px;
    text-align: right;
    margin-top: auto;

    z-index: 110;
    top: 72px;
    right: clamp(24px, 5vw, 94px);
    width: 238px;
    padding: 16px;
    border: 1px solid var(--hairline);
    background: var(--panel);
    box-shadow: 16px 18px 32px rgba(46, 37, 31, .12);
    backdrop-filter: blur(8px);
  }
  .settings[hidden] { display: none; }
  .setting { display: grid; gap: 6px; margin-bottom: 13px; }
  .setting label { display: flex; justify-content: space-between; color: var(--muted); font: 11px/1 'Inter', ui-monospace, monospace; }
  .setting input { width: 100%; accent-color: var(--ink); }
  .reset-btn { width: 100%; border: 1px solid var(--hairline); padding: 7px 10px; color: var(--ink); background: transparent; cursor: pointer; font: 11px/1 'Inter', ui-monospace, monospace; }

  /* ===== Canvas 珠帘 ===== */
  #curtain {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    cursor: none;
    touch-action: none;
  }

  .cursor {
    position: absolute;
    z-index: 12;
    width: 12px;
    height: 12px;
    border: 1px solid rgba(46, 37, 31, .72);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }
  .artboard.is-active .cursor { opacity: 1; }

  /* ===== 响应式 ===== */
  @media(max-width: 900px) {
    .nav { padding: 16px 24px; }
    .nav-links { display: none; }
    .hero {
      grid-template-columns: 1fr;
      padding: 100px 24px 40px;
      gap: 32px;
    }
    .hero-left { padding-bottom: 0; order: 2; }
    .hero-center { order: 1; padding-bottom: 0; }
    .hero-right { display: none; }
    .hero-image-wrap { max-width: 320px; margin: 0 auto; }
    .settings { right: 16px; width: 200px; }
  }

  @media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script>
// ===== 反重力标题 =====
function attachAntiGravity(el, options = {}) {
  const { floatAmp = 5, floatSpeed = 0.35, rotAmp = 1.5, pushRadius = 130, pushForce = 20, springK = 0.055, damping = 0.89 } = options;
  let vx = 0, vy = 0, ox = 0, oy = 0, phase = Math.random() * Math.PI * 2;
  let lastSoundTime = 0, rafId = null, isPushed = false;

  const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  function playChime(freq, duration, volume) {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = 'sine';
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now); osc.stop(now + duration);
  }

  function floatTick() {
    if (isPushed) return;
    const time = Date.now() / 1000;
    const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
    const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.35);
    const rotZ = Math.sin(time * floatSpeed * 0.45 + phase) * rotAmp;
    el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;
  }

  function physicsTick() {
    if (!isPushed && Math.abs(ox) < 0.1 && Math.abs(oy) < 0.1 && Math.abs(vx) < 0.01 && Math.abs(vy) < 0.01) {
      ox = 0; oy = 0; vx = 0; vy = 0; rafId = null; return;
    }
    const ax = -ox * springK, ay = -oy * springK;
    vx = (vx + ax) * damping; vy = (vy + ay) * damping;
    ox += vx; oy += vy;
    const time = Date.now() / 1000;
    const floatY = Math.sin(time * floatSpeed + phase) * floatAmp;
    const floatX = Math.cos(time * floatSpeed * 0.7 + phase) * (floatAmp * 0.35);
    const rotZ = Math.sin(time * floatSpeed * 0.45 + phase) * rotAmp;
    el.style.transform = `translate(${floatX + ox}px, ${floatY + oy}px) rotate(${rotZ}deg)`;
    rafId = requestAnimationFrame(physicsTick);
  }

  el.addEventListener('mousemove', (e) => {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const dx = cx - e.clientX, dy = cy - e.clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < pushRadius && dist > 0) {
      const force = (pushRadius - dist) / pushRadius * pushForce;
      vx += (dx / dist) * force * 0.12; vy += (dy / dist) * force * 0.12;
      isPushed = true;
      const now = Date.now();
      if (now - lastSoundTime > 90) {
        playChime(pentatonic[Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length], 0.1, 0.03);
        lastSoundTime = now;
      }
      if (!rafId) rafId = requestAnimationFrame(physicsTick);
    }
  });
  el.addEventListener('mouseleave', () => {
    isPushed = false;
    if (!rafId) rafId = requestAnimationFrame(physicsTick);
    playChime(pentatonic[Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length] * 0.5, 0.15, 0.02);
  });
  setInterval(floatTick, 33);
}

// ===== 风吹拂文字 =====
function attachWind(el) {
  function playChime(freq, duration, volume) {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = 'sine';
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now); osc.stop(now + duration);
  }
  function playWindSound(duration, volume) {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const source = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();
    source.buffer = buffer;
    filter.type = 'bandpass'; filter.frequency.value = 400 + Math.random() * 300; filter.Q.value = 0.5;
    source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.1);
    gain.gain.linearRampToValueAtTime(volume * 0.6, now + duration * 0.5);
    gain.gain.linearRampToValueAtTime(0, now + duration);
    source.start(now); source.stop(now + duration);
  }
  const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

  el.addEventListener('click', () => {
    playWindSound(0.5, 0.035);
    playChime(pentatonic[Math.abs(el.textContent.charCodeAt(0)) % pentatonic.length], 0.25, 0.02);
    el.classList.add('wind-blown');
    setTimeout(() => el.classList.remove('wind-blown'), 700);
    const siblings = Array.from(el.parentElement.children);
    const idx = siblings.indexOf(el);
    siblings.forEach((sib, i) => {
      if (sib === el) return;
      const dist = Math.abs(i - idx);
      if (dist <= 4) {
        setTimeout(() => {
          sib.classList.add('wind-blown');
          setTimeout(() => sib.classList.remove('wind-blown'), 700);
        }, dist * 60);
      }
    });
  });
}

// ===== Canvas 珠帘 Verlet 物理 =====
let audioCtx = null;
const artboard = document.getElementById('artboard');
const canvas = document.getElementById('curtain');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('cursor');
const temple = document.getElementById('temple');
const configure = document.getElementById('configure');
const settings = document.getElementById('settings');
const resetBtn = document.getElementById('resetCurtain');
const chains = [];
let glyphs = '天坛祈年风调雨顺天地玄黄日月星辰礼乐文明北京春秋山川云海故宫长城颐和圆明天坛地坛先农坛帝王祭祀五谷丰登皇天后土圜丘皇穹宇回音壁祈谷坛祈年殿皇乾殿丹陛桥七星石三音石七十二长廊五百二十八米三重檐攒尖顶鎏金宝顶蓝瓦红柱和玺彩画金龙藻井二十四节气七十二候孟春祈谷岁事典礼钟鼓齐鸣乐舞升平九五之尊天子亲耕藉田之礼先蚕坛日月坛社稷坛太庙文庙武庙孔庙雍和宫白塔寺大钟寺五塔寺万寿寺碧云寺卧佛寺戒台寺潭柘寺灵光寺法源寺广济寺广化寺智化寺大慧寺大觉寺真觉寺觉生寺西黄寺东黄寺柏林寺贤良寺普度寺昭显庙凝和庙宣仁庙夕月坛太岁坛天神坛地祇坛先农坛观耕台一亩三分地藉田礼亲耕耤田祈雨雩祭日坛朝日坛月坛夕月坛星辰坛社稷坛太庙文庙历代帝王庙先农坛天神坛地祇坛太岁坛祈年殿皇穹宇圜丘坛祈谷坛孟春正月上辛日皇帝亲祭昊天上帝皇天上帝百神从祀三献礼九奏乐八佾舞钦若昊天敬授人时祈谷于天为民祈福五谷丰登国泰民安风调雨顺天下太平万邦协和怀柔远人威震四方天下一统九州同庆万国来朝天朝上国礼仪之邦衣冠上国礼乐之邦';
const mouse = { x: -999, y: -999, oldX: -999, oldY: -999, active: false };
const physics = { strength: .72, radius: 34, friction: .965, gravity: .18 };
const sound = {
  context: null, output: null, lastStrike: [], lastGlobal: 0, voices: 0,
  scale: [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760]
};
let width = 0, height = 0, dpr = 1;

function unlockSound() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!sound.context) {
    const context = new AudioContext();
    const output = context.createGain();
    const compressor = context.createDynamicsCompressor();
    const delay = context.createDelay(.3);
    const feedback = context.createGain();
    const wet = context.createGain();
    output.gain.value = .62;
    compressor.threshold.value = -18; compressor.ratio.value = 3;
    delay.delayTime.value = .11; feedback.gain.value = .14; wet.gain.value = .13;
    output.connect(compressor); output.connect(delay);
    delay.connect(feedback); feedback.connect(delay); delay.connect(wet); wet.connect(compressor);
    compressor.connect(context.destination);
    sound.context = context; sound.output = output;
  }
  if (sound.context.state === 'suspended') sound.context.resume().catch(() => {});
  if (!audioCtx) audioCtx = sound.context;
}

function strikeChain(columnIndex, impact, x) {
  const context = sound.context;
  if (!context || context.state !== 'running' || impact < 1.1) return;
  const timestamp = performance.now();
  if (timestamp - (sound.lastStrike[columnIndex] || 0) < 95) return;
  if (timestamp - sound.lastGlobal < 28 || sound.voices >= 8) return;
  sound.lastStrike[columnIndex] = timestamp;
  sound.lastGlobal = timestamp;
  sound.voices += 1;

  const now = context.currentTime;
  const frequency = sound.scale[columnIndex % sound.scale.length];
  const level = .028 + Math.min(impact, 18) / 18 * .075;
  const duration = .72 + Math.random() * .32;
  const spatial = context.createStereoPanner ? context.createStereoPanner() : context.createGain();
  const pan = Math.max(-.9, Math.min(.9, x / width * 2 - 1));
  if (spatial.pan) spatial.pan.setValueAtTime(pan, now);
  spatial.connect(sound.output);

  [{ratio:1,amount:1,decay:1},{ratio:2.01,amount:.24,decay:.62},{ratio:3.96,amount:.1,decay:.38}].forEach(partial => {
    const oscillator = context.createOscillator();
    const envelope = context.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(frequency * partial.ratio, now);
    oscillator.detune.setValueAtTime((Math.random()-.5)*8, now);
    envelope.gain.setValueAtTime(level * partial.amount, now);
    envelope.gain.exponentialRampToValueAtTime(.0001, now + duration * partial.decay);
    oscillator.connect(envelope); envelope.connect(spatial);
    oscillator.start(now); oscillator.stop(now + duration + .05);
  });

  window.setTimeout(() => {
    sound.voices = Math.max(0, sound.voices - 1);
    spatial.disconnect();
  }, (duration + .15) * 1000);
}

function build() {
  chains.length = 0;
  const narrow = width < 720;
  const columns = narrow ? 16 : 26;
  const templeRect = temple.getBoundingClientRect();
  const artboardRect = artboard.getBoundingClientRect();
  const buildingCenter = templeRect.left - artboardRect.left + templeRect.width * .5;
  const curtainWidth = templeRect.width * .84;
  const left = buildingCenter - curtainWidth / 2;
  const templeTop = templeRect.top - artboardRect.top;
  const roofScale = templeRect.width / 520;
  const centerEdge = templeTop + 380 * roofScale;
  const sideEdge = templeTop + 420 * roofScale;
  const curtainBottom = height - (narrow ? 42 : 48);
  const availableHeight = Math.max(120, curtainBottom - sideEdge);
  const rows = Math.max(18, Math.min(narrow ? 35 : 39, Math.floor(availableHeight / 9.4) + 1));

  for (let column = 0; column < columns; column++) {
    const x = left + column * curtainWidth / (columns - 1);
    const normalizedX = Math.abs(column / (columns - 1) * 2 - 1);
    const top = centerEdge + (sideEdge - centerEdge) * Math.pow(normalizedX, 1.7) - 4;
    const segmentLength = Math.max(6.4, (curtainBottom - top) / (rows - 1));
    const readingColumn = columns - 1 - column;
    const chain = [];
    for (let row = 0; row < rows; row++) {
      const y = top + row * segmentLength;
      chain.push({
        x, y, oldX: x, oldY: y, anchorX: x, anchorY: y,
        pinned: row === 0, restLength: segmentLength,
        char: glyphs[(readingColumn * rows + row) % glyphs.length],
        alpha: .36 + ((column + row * 2) % 6) * .055
      });
    }
    chains.push(chain);
  }
}

function resize() {
  const rect = artboard.getBoundingClientRect();
  width = rect.width; height = rect.height;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  build();
}

function injectMouseDelta() {
  if (!mouse.active) return;
  const moveX = mouse.x - mouse.oldX;
  const moveY = mouse.y - mouse.oldY;
  const speed = Math.hypot(moveX, moveY);
  if (speed < .01 || speed > 80) return;
  for (let chainIndex = 0; chainIndex < chains.length; chainIndex++) {
    const chain = chains[chainIndex];
    let strongestImpact = 0;
    for (let index = 1; index < chain.length; index++) {
      const point = chain[index];
      const distance = Math.hypot(point.x - mouse.oldX, point.y - mouse.oldY);
      if (distance >= physics.radius) continue;
      const falloff = 1 - distance / physics.radius;
      strongestImpact = Math.max(strongestImpact, speed * falloff);
      point.x += moveX * physics.strength * falloff;
      point.y += moveY * physics.strength * falloff;
    }
    if (strongestImpact > 0) strikeChain(chainIndex, strongestImpact, chain[0].x);
  }
}

function integrate() {
  for (const chain of chains) {
    for (const point of chain) {
      if (point.pinned) continue;
      const velocityX = (point.x - point.oldX) * physics.friction;
      const velocityY = (point.y - point.oldY) * physics.friction;
      point.oldX = point.x; point.oldY = point.y;
      point.x += velocityX; point.y += velocityY + physics.gravity;
    }
  }
}

function constrain() {
  for (let pass = 0; pass < 8; pass++) {
    for (const chain of chains) {
      const anchor = chain[0];
      anchor.x = anchor.anchorX; anchor.y = anchor.anchorY;
      for (let index = 1; index < chain.length; index++) {
        const a = chain[index - 1], b = chain[index];
        const dx = b.x - a.x, dy = b.y - a.y;
        const distance = Math.max(.0001, Math.hypot(dx, dy));
        const difference = (distance - b.restLength) / distance;
        if (a.pinned) {
          b.x -= dx * difference; b.y -= dy * difference;
        } else {
          const cx = dx * difference * .5, cy = dy * difference * .5;
          a.x += cx; a.y += cy; b.x -= cx; b.y -= cy;
        }
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#2e251f';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '500 10px ui-monospace, SFMono-Regular, Menlo, monospace';
  for (const chain of chains) {
    for (const point of chain) {
      ctx.globalAlpha = point.alpha;
      ctx.fillText(point.char, point.x, point.y);
    }
  }
  ctx.globalAlpha = 1;
}

function frame() {
  integrate(); constrain(); draw();
  requestAnimationFrame(frame);
}

function enter(event) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = mouse.oldX = event.clientX - rect.left;
  mouse.y = mouse.oldY = event.clientY - rect.top;
  mouse.active = true;
  cursor.style.left = mouse.x + 'px'; cursor.style.top = mouse.y + 'px';
  artboard.classList.add('is-active');
}

function move(event) {
  if (!mouse.active) enter(event);
  mouse.oldX = mouse.x; mouse.oldY = mouse.y;
  const rect = canvas.getBoundingClientRect();
  mouse.x = event.clientX - rect.left; mouse.y = event.clientY - rect.top;
  injectMouseDelta();
  cursor.style.left = mouse.x + 'px'; cursor.style.top = mouse.y + 'px';
}

function leave() {
  mouse.active = false;
  artboard.classList.remove('is-active');
}

function bindRange(id, outputId, update) {
  const input = document.getElementById(id);
  const output = document.getElementById(outputId);
  input.addEventListener('input', () => {
    const value = Number(input.value);
    output.value = String(value);
    update(value);
  });
}

configure.addEventListener('click', () => {
  const open = settings.hidden;
  settings.hidden = !open;
  configure.setAttribute('aria-expanded', String(open));
});
resetBtn.addEventListener('click', build);
bindRange('strength', 'strengthValue', v => { physics.strength = v / 100; });
bindRange('reach', 'reachValue', v => { physics.radius = v; });
bindRange('inertia', 'inertiaValue', v => { physics.friction = v / 100; });
canvas.addEventListener('pointerenter', enter);
canvas.addEventListener('pointermove', move);
canvas.addEventListener('pointerleave', leave);
window.addEventListener('pointerdown', unlockSound, { passive: true });
window.addEventListener('resize', resize);

// ===== 初始化 =====
function init() {
  document.querySelectorAll('.ag-char').forEach(el => {
    attachAntiGravity(el, { floatAmp: 3 + Math.random() * 4, floatSpeed: 0.25 + Math.random() * 0.3, rotAmp: 0.6 + Math.random() * 1.4, pushRadius: 110, pushForce: 16 });
  });
  document.querySelectorAll('.wind-char').forEach(el => attachWind(el));
  resize();
  frame();
}

document.addEventListener('DOMContentLoaded', init);
</script>
