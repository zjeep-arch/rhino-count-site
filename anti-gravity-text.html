<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>反重力文字 · 北京地标 — 犀牛伯爵</title>
<meta name="description" content="3D 反重力排版实验：零重力中漂浮的文字，鼠标反应透视，深度挤出，环境光晕。讲述北京地标建筑的故事。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2305050A'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-size='30' font-family='Georgia,serif' fill='%23E8C77A'%3E反%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #E8C77A;
    --cyan: #7BE0E8;
    --pink: #FF6B9D;
    --purple: #B07BFF;
    --bg: #05050A;
    --text: #e8e8f0;
    --text-dim: #555570;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Three.js Canvas 底层 ===== */
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: all;
  }
  #canvas-container canvas {
    display: block;
  }

  /* ===== 内容层（在 Canvas 之上）===== */
  .content-layer {
    position: relative;
    z-index: 1;
    pointer-events: none;
  }
  .content-layer > * { pointer-events: auto; }

  /* ===== 导航 ===== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    background: rgba(5,5,10,.5);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-bottom: 1px solid rgba(255,255,255,.06);
    transition: background .3s;
    pointer-events: auto;
  }
  .nav-brand {
    font: 700 18px Georgia, serif;
    color: var(--gold);
    text-decoration: none;
    letter-spacing: 1px;
  }
  .nav-back {
    color: #aab;
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    transition: .25s;
  }
  .nav-back:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 12px rgba(123,224,232,.15);
  }

  /* ===== Hero ===== */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 100px 24px 80px;
    text-align: center;
    pointer-events: none;
  }
  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: .4em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp .8s .3s forwards;
    text-shadow: 0 0 20px rgba(123,224,232,.3);
    pointer-events: auto;
  }
  .hero-sub {
    font-size: 16px;
    color: #777790;
    max-width: 540px;
    line-height: 2;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp .8s .8s forwards;
    pointer-events: auto;
  }
  .hero-sub .highlight {
    color: var(--cyan);
    font-weight: 500;
    text-shadow: 0 0 12px rgba(123,224,232,.2);
  }
  .scroll-hint {
    font-size: 11px;
    letter-spacing: .25em;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeUp .8s 1.2s forwards;
    cursor: pointer;
    transition: color .3s;
    pointer-events: auto;
  }
  .scroll-hint:hover { color: var(--cyan); }
  .scroll-hint .arrow {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, var(--cyan), transparent);
    animation: scrollPulse 2.2s ease-in-out infinite;
    position: relative;
  }
  .scroll-hint .arrow::after {
    content: '';
    position: absolute;
    bottom: 0; left: -2px;
    width: 5px; height: 5px;
    border-right: 1px solid var(--cyan);
    border-bottom: 1px solid var(--cyan);
    transform: rotate(45deg);
    opacity: .6;
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: .2; transform: scaleY(.6); }
    50% { opacity: 1; transform: scaleY(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 地标章节 ===== */
  .landmarks {
    position: relative;
    padding: 60px 24px 40px;
    background: linear-gradient(to bottom, transparent 0%, rgba(5,5,10,.85) 10%, rgba(5,5,10,.95) 100%);
    pointer-events: auto;
  }
  .landmark {
    margin-bottom: 140px;
    text-align: center;
    opacity: 0;
    transform: translateY(50px);
    transition: opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1);
  }
  .landmark.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .landmark-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 16px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    justify-content: center;
  }
  .landmark-num {
    font: 700 13px "SF Mono", monospace;
    color: var(--gold);
    opacity: .5;
    letter-spacing: 2px;
  }
  .landmark-tag {
    font-size: 11px;
    letter-spacing: .25em;
    color: var(--cyan);
    text-transform: uppercase;
    opacity: .8;
  }
  .landmark-title {
    font: 700 clamp(42px, 8vw, 80px)/1.1 Georgia, "Songti SC", serif;
    margin-bottom: 20px;
    position: relative;
    display: inline-block;
  }
  .landmark-title .ag-char {
    display: inline-block;
    cursor: default;
    user-select: none;
    transition: transform .3s;
  }
  .landmark-title .ag-char:hover {
    transform: translateY(-5px) scale(1.05);
  }
  .landmark-desc {
    max-width: 560px;
    margin: 28px auto 0;
    font-size: 15px;
    line-height: 2;
    color: #555570;
    letter-spacing: .02em;
  }

  /* ===== 分隔线 ===== */
  .ag-divider {
    max-width: 200px;
    margin: 0 auto 140px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,.1), transparent);
    position: relative;
  }
  .ag-divider::after {
    content: '';
    position: absolute;
    left: 50%; top: -2px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: .4;
    transform: translateX(-50%);
    box-shadow: 0 0 10px var(--cyan);
  }

  /* ===== 底部 ===== */
  .footer {
    position: relative;
    padding: 80px 24px 40px;
    text-align: center;
    background: rgba(5,5,10,.95);
    pointer-events: auto;
  }
  .footer-text {
    font-size: 13px;
    color: #3a3a50;
    line-height: 2;
  }
  .footer-link {
    color: var(--cyan);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: .25s;
  }
  .footer-link:hover {
    border-color: var(--cyan);
    text-shadow: 0 0 8px rgba(123,224,232,.3);
  }

  /* ===== 响应式 ===== */
  @media(max-width: 768px) {
    .nav { padding: 12px 16px; }
    .hero { padding: 80px 16px 60px; }
    .landmarks { padding: 40px 16px 20px; }
    .landmark { margin-bottom: 100px; }
  }
  @media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>

<!-- Three.js 全屏 Canvas -->
<div id="canvas-container"></div>

<!-- HTML 内容层 -->
<div class="content-layer">
  <nav class="nav">
    <a class="nav-brand" href="index.html#builds">犀牛伯爵</a>
    <a class="nav-back" href="index.html#builds">← 返回创作矩阵</a>
  </nav>

  <section class="hero">
    <div class="hero-eyebrow">Anti-Gravity Typography · 反重力排版实验</div>
    <div class="hero-sub">
      每个字符在<span class="highlight">零重力</span>中漂浮、旋转、散落。<br>
      鼠标移动改变<span class="highlight">透视角度</span>，靠近时文字被推开。<br>
      用反重力文字，讲述北京地标建筑的故事。
    </div>
    <div class="scroll-hint" onclick="document.getElementById('landmarks').scrollIntoView({behavior:'smooth'})">
      <span>向下滚动</span>
      <div class="arrow"></div>
    </div>
  </section>

  <section class="landmarks" id="landmarks"></section>

  <footer class="footer">
    <div class="footer-text">
      反重力文字实验 · 灵感来自 <a class="footer-link" href="https://www.instagram.com/marina_uiux/" target="_blank" rel="noopener">Marina Budarina</a> 的零重力设计语言<br>
      基于 Three.js + Bloom 后期处理 · 纯前端实现
    </div>
  </footer>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ===== 场景初始化 =====
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05050a, 0.015);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 35);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ReinhardToneMapping;
container.appendChild(renderer.domElement);

// ===== 后期处理 Bloom =====
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5, 0.4, 0.85
);
bloomPass.threshold = 0.15;
bloomPass.strength = 1.8;
bloomPass.radius = 0.6;
composer.addPass(bloomPass);

// ===== 文字纹理生成 =====
function createTextTexture(text, color, fontSize = 140) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const size = 512;
  canvas.width = size;
  canvas.height = size;

  // 清透明背景
  ctx.clearRect(0, 0, size, size);

  // 发光效果 - 多层阴影模拟
  const glowColor = color.replace(')', ', 0.3)').replace('rgb', 'rgba');
  for (let i = 5; i > 0; i--) {
    ctx.shadowColor = color;
    ctx.shadowBlur = i * 15;
    ctx.font = `900 ${fontSize}px Georgia, "Songti SC", "Noto Serif SC", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = i === 1 ? color : glowColor;
    ctx.fillText(text, size/2, size/2);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  return texture;
}

// ===== 创建 3D 文字组（带深度挤出层）=====
function create3DText(text, color, size = 5, extrusion = true) {
  const group = new THREE.Group();
  const texture = createTextTexture(text, color);

  // 主文字层
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 1
  });
  const mainMesh = new THREE.Mesh(geo, mat);
  group.add(mainMesh);

  // 深度挤出层
  if (extrusion) {
    for (let i = 1; i <= 6; i++) {
      const layerGeo = new THREE.PlaneGeometry(size * (1 + i * 0.06), size * (1 + i * 0.06));
      const layerMat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.12 / i,
        color: new THREE.Color(color)
      });
      const layer = new THREE.Mesh(layerGeo, layerMat);
      layer.position.z = -i * 0.4;
      group.add(layer);
    }
  }

  return { group, mainMesh };
}

// ===== Hero 标题文字 =====
const heroChars = ['反', '重', '力', '文', '字'];
const heroColors = ['#E8C77A', '#7BE0E8', '#FF6B9D', '#B07BFF', '#E8C77A'];
const heroItems = [];

heroChars.forEach((char, i) => {
  const spacing = 5.5;
  const x = (i - (heroChars.length - 1) / 2) * spacing;
  const { group } = create3DText(char, heroColors[i], 5, true);

  group.position.set(x, 2, 0);
  scene.add(group);

  heroItems.push({
    group,
    basePos: new THREE.Vector3(x, 2, 0),
    velocity: new THREE.Vector3(0, 0, 0),
    offset: new THREE.Vector3(0, 0, 0),
    phase: Math.random() * Math.PI * 2,
    charSize: 5
  });
});

// ===== 英文副标题 =====
const subTitle = "ANTI\u2011GRAVITY";
const subItems = [];
subTitle.split('').forEach((char, i) => {
  if (char === '\u2011') return;
  const spacing = 1.8;
  const x = (i - subTitle.replace(/\u2011/g, '').length / 2) * spacing;
  const { group } = create3DText(char, '#ffffff', 2.5, false);

  group.position.set(x, -2.5, -2);
  scene.add(group);

  subItems.push({
    group,
    basePos: new THREE.Vector3(x, -2.5, -2),
    phase: Math.random() * Math.PI * 2,
    floatAmp: 0.15
  });
});

// ===== 飘浮粒子系统 =====
const particleCount = 300;
const pGeo = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);
const pSizes = new Float32Array(particleCount);
const pVelocities = [];

const particleColors = [
  new THREE.Color('#E8C77A'),
  new THREE.Color('#7BE0E8'),
  new THREE.Color('#FF6B9D'),
  new THREE.Color('#B07BFF'),
  new THREE.Color('#ffffff')
];
const pColors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  pPositions[i*3] = (Math.random() - 0.5) * 80;
  pPositions[i*3+1] = (Math.random() - 0.5) * 60;
  pPositions[i*3+2] = (Math.random() - 0.5) * 40;
  pSizes[i] = Math.random() * 2 + 0.5;
  pVelocities.push({
    x: (Math.random() - 0.5) * 0.008,
    y: (Math.random() - 0.5) * 0.008,
    z: (Math.random() - 0.5) * 0.004
  });
  const c = particleColors[Math.floor(Math.random() * particleColors.length)];
  pColors[i*3] = c.r;
  pColors[i*3+1] = c.g;
  pColors[i*3+2] = c.b;
}

pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));

const pMat = new THREE.PointsMaterial({
  size: 0.15,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true
});

const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ===== 环境光 =====
const ambientLight = new THREE.AmbientLight(0x404040, 2);
scene.add(ambientLight);

// 多个彩色点光源
const lights = [
  { color: 0xE8C77A, pos: [20, 10, 10] },
  { color: 0x7BE0E8, pos: [-20, 10, 10] },
  { color: 0xFF6B9D, pos: [0, -10, 15] }
];
lights.forEach(l => {
  const light = new THREE.PointLight(l.color, 3, 50);
  light.position.set(...l.pos);
  scene.add(light);
});

// ===== 鼠标交互 =====
const mouse = new THREE.Vector2();
const mouseWorld = new THREE.Vector3();
const raycaster = new THREE.Raycaster();

// 用于将鼠标屏幕坐标转换为世界坐标
const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

container.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  // 计算鼠标在 z=0 平面的世界坐标
  raycaster.setFromCamera(mouse, camera);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(planeZ, target);
  if (target) mouseWorld.copy(target);

  // 推开 Hero 文字
  heroItems.forEach(item => {
    const worldPos = item.basePos.clone().add(item.offset);
    const dx = worldPos.x - mouseWorld.x;
    const dy = worldPos.y - mouseWorld.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 6 && dist > 0) {
      const force = (6 - dist) * 0.15;
      item.velocity.x += (dx / dist) * force;
      item.velocity.y += (dy / dist) * force;
    }
  });
});

// 触摸支持
container.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(planeZ, target);
  if (target) mouseWorld.copy(target);

  heroItems.forEach(item => {
    const worldPos = item.basePos.clone().add(item.offset);
    const dx = worldPos.x - mouseWorld.x;
    const dy = worldPos.y - mouseWorld.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 8 && dist > 0) {
      const force = (8 - dist) * 0.2;
      item.velocity.x += (dx / dist) * force;
      item.velocity.y += (dy / dist) * force;
    }
  });
}, { passive: true });

// ===== 动画循环 =====
const clock = new THREE.Clock();
const cameraTarget = new THREE.Vector3(0, 0, 35);

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // 鼠标反应透视 - 相机轻微偏移
  cameraTarget.x = mouse.x * 3;
  cameraTarget.y = mouse.y * 2;
  camera.position.lerp(cameraTarget, 0.04);
  camera.lookAt(0, 0, 0);

  // Hero 文字动画
  heroItems.forEach((item, i) => {
    // 弹簧物理 - 回复到基础位置
    const springK = 0.06;
    const damping = 0.88;

    item.velocity.x += (0 - item.offset.x) * springK;
    item.velocity.y += (0 - item.offset.y) * springK;
    item.velocity.z += (0 - item.offset.z) * springK;
    item.velocity.multiplyScalar(damping);

    item.offset.add(item.velocity);

    // 基础漂浮
    const floatY = Math.sin(time * 0.6 + item.phase) * 0.4;
    const floatX = Math.cos(time * 0.4 + item.phase * 0.7) * 0.25;
    const floatRotZ = Math.sin(time * 0.25 + item.phase) * 0.03;
    const floatRotX = Math.cos(time * 0.3 + item.phase) * 0.02;

    item.group.position.set(
      item.basePos.x + item.offset.x + floatX,
      item.basePos.y + item.offset.y + floatY,
      item.basePos.z + item.offset.z
    );
    item.group.rotation.z = floatRotZ;
    item.group.rotation.x = floatRotX;
  });

  // 副标题动画
  subItems.forEach((item, i) => {
    const floatY = Math.sin(time * 0.5 + item.phase) * item.floatAmp;
    const floatX = Math.cos(time * 0.35 + item.phase) * 0.1;
    item.group.position.set(
      item.basePos.x + floatX,
      item.basePos.y + floatY,
      item.basePos.z
    );
    item.group.rotation.y = Math.sin(time * 0.2 + item.phase) * 0.05;
  });

  // 粒子动画
  const positions = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    positions[i*3] += pVelocities[i].x;
    positions[i*3+1] += pVelocities[i].y;
    positions[i*3+2] += pVelocities[i].z;

    // 边界循环
    if (Math.abs(positions[i*3]) > 45) pVelocities[i].x *= -1;
    if (Math.abs(positions[i*3+1]) > 35) pVelocities[i].y *= -1;
    if (Math.abs(positions[i*3+2]) > 25) pVelocities[i].z *= -1;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  particles.rotation.y = time * 0.015;

  // 光源动画
  lights.forEach((l, i) => {
    const light = scene.children.find(c => c.isPointLight && c.color.getHex() === l.color);
    if (light) {
      light.position.x = l.pos[0] + Math.sin(time * 0.3 + i * 2) * 5;
      light.position.y = l.pos[1] + Math.cos(time * 0.25 + i * 2) * 3;
    }
  });

  composer.render();
}

animate();

// ===== 窗口调整 =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ===== 滚动入场动画 =====
(function() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.landmark').forEach(el => observer.observe(el));
})();
