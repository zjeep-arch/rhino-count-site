<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>反重力文字 · 北京地标 — 犀牛伯爵</title>
<meta name="description" content="反重力排版实验：用零重力中漂浮的文字讲述北京地标建筑的故事。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2305050A'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-size='30' font-family='Georgia,serif' fill='%23E8C77A'%3E反%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#E8C77A;
  --cyan:#7BE0E8;
  --pink:#FF6B9D;
  --purple:#B07BFF;
  --bg:#05050A;
  --surface:#0E0E18;
  --text:#e8e8f0;
  --text-dim:#555570;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Inter",sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ===== 多层星空背景 ===== */
.starfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{
  position:absolute;
  border-radius:50%;
  background:#fff;
  animation:twinkle var(--dur,4s) ease-in-out infinite;
  animation-delay:var(--del,0s);
}
@keyframes twinkle{
  0%,100%{opacity:var(--op1,.2);transform:scale(1)}
  50%{opacity:var(--op2,.9);transform:scale(1.2)}
}
.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:.12;
  animation:nebulaDrift 20s ease-in-out infinite alternate;
}
@keyframes nebulaDrift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(30px,-20px) scale(1.1)}
}

/* ===== 环境光晕 ===== */
.ambient-glow{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(123,224,232,.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 80% 70%, rgba(232,199,122,.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(176,123,255,.04) 0%, transparent 60%);
}

/* ===== 导航 ===== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;
  background:rgba(5,5,10,.6);
  backdrop-filter:blur(20px) saturate(1.2);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:background .3s;
}
.nav-brand{
  font:700 18px Georgia,serif;
  color:var(--gold);
  text-decoration:none;
  letter-spacing:1px;
  position:relative;
}
.nav-brand::after{
  content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;
  background:var(--gold);transition:width .3s;
}
.nav-brand:hover::after{width:100%}
.nav-back{
  color:#aab;padding:8px 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;text-decoration:none;font-size:14px;
  transition:.25s;position:relative;overflow:hidden;
}
.nav-back::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(123,224,232,.08),transparent);
  transform:translateX(-100%);transition:transform .4s;
}
.nav-back:hover{
  border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 12px rgba(123,224,232,.15);
}
.nav-back:hover::before{transform:translateX(100%)}

/* ===== Hero ===== */
.hero{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:100px 24px 60px;text-align:center;
}
.hero-eyebrow{
  font-size:12px;letter-spacing:.35em;
  color:var(--cyan);text-transform:uppercase;
  margin-bottom:28px;opacity:0;
  animation:fadeUp .8s .2s forwards;
}
.hero-title-wrap{
  margin-bottom:24px;position:relative;
}
.hero-title{
  font:700 clamp(40px,9vw,110px)/1.1 Georgia,"Songti SC",serif;
  background:linear-gradient(135deg,#fff 0%,var(--cyan) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:4px;
  text-shadow:none;
  opacity:0;animation:fadeUp .8s .4s forwards;
  filter:drop-shadow(0 0 30px rgba(123,224,232,.15));
}
.hero-sub{
  font-size:17px;color:#777790;max-width:620px;
  line-height:1.9;margin-bottom:48px;opacity:0;
  animation:fadeUp .8s .7s forwards;
}
.hero-sub span.highlight{
  color:var(--cyan);font-weight:500;
}
.scroll-hint{
  font-size:12px;letter-spacing:.2em;
  color:var(--text-dim);
  display:flex;flex-direction:column;
  align-items:center;gap:10px;opacity:0;
  animation:fadeUp .8s 1.1s forwards;
  cursor:pointer;transition:color .3s;
}
.scroll-hint:hover{color:var(--cyan)}
.scroll-hint .arrow{
  width:1px;height:48px;
  background:linear-gradient(to bottom,transparent,var(--cyan),transparent);
  animation:scrollPulse 2.2s ease-in-out infinite;
  position:relative;
}
.scroll-hint .arrow::after{
  content:'';position:absolute;bottom:0;left:-2px;
  width:5px;height:5px;border-right:1px solid var(--cyan);border-bottom:1px solid var(--cyan);
  transform:rotate(45deg);opacity:.6;
}
@keyframes scrollPulse{
  0%,100%{opacity:.25;transform:scaleY(.7)}
  50%{opacity:1;transform:scaleY(1)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* ===== 反重力文字核心 ===== */
.ag-stage{position:relative;z-index:1;padding:80px 24px 40px;overflow:hidden}
.ag-landmark{
  margin-bottom:140px;
  opacity:0;transform:translateY(60px) scale(.98);
  transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1);
}
.ag-landmark.visible{
  opacity:1;transform:translateY(0) scale(1);
}
.ag-landmark-head{
  display:flex;align-items:baseline;gap:16px;
  margin-bottom:16px;
  max-width:900px;margin-left:auto;margin-right:auto;
}
.ag-number{
  font:700 13px "SF Mono",monospace;
  color:var(--gold);opacity:.5;letter-spacing:2px;
}
.ag-tag{
  font-size:11px;letter-spacing:.25em;
  color:var(--cyan);text-transform:uppercase;opacity:.8;
}
.ag-body{
  max-width:820px;margin:0 auto;position:relative;
  text-align:center;
}

/* 每个字符的容器 */
.char-spray{display:inline;position:relative}
.ag-char{
  display:inline-block;position:relative;
  transition:none;will-change:transform,opacity;
  cursor:default;user-select:none;
}
.ag-char.gold{color:var(--gold)}
.ag-char.cyan{color:var(--cyan)}
.ag-char.pink{color:var(--pink)}
.ag-char.purple{color:var(--purple)}
.ag-char.white{color:#fff}
.ag-char.dim{color:var(--text-dim)}
.ag-char.bold{font-weight:800}
.ag-char.serif{font-family:Georgia,"Songti SC",serif}

/* 漂浮动画 - 每个字独立 */
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-10px) rotate(var(--rot,2deg))}
  100%{transform:translateY(0) rotate(0deg)}
}

/* 标题发光效果 */
.ag-char.glow-gold{text-shadow:0 0 20px rgba(232,199,122,.3),0 0 40px rgba(232,199,122,.1)}
.ag-char.glow-cyan{text-shadow:0 0 20px rgba(123,224,232,.3),0 0 40px rgba(123,224,232,.1)}
.ag-char.glow-pink{text-shadow:0 0 20px rgba(255,107,157,.3),0 0 40px rgba(255,107,157,.1)}

/* 建筑 SVG 装饰 */
.ag-building{
  max-width:560px;margin:32px auto 0;
  opacity:0;transform:translateY(20px);
  transition:opacity 1s .2s,transform 1s .2s;
}
.ag-landmark.visible .ag-building{
  opacity:.55;transform:translateY(0);
}
.ag-building svg{width:100%;height:auto}

/* SVG 描边绘制动画 */
.ag-building svg path,
.ag-building svg line,
.ag-building svg rect,
.ag-building svg ellipse,
.ag-building svg polyline{
  stroke-dasharray:800;
  stroke-dashoffset:800;
  transition:stroke-dashoffset 2s cubic-bezier(.22,1,.36,1);
}
.ag-landmark.visible .ag-building svg path,
.ag-landmark.visible .ag-building svg line,
.ag-landmark.visible .ag-building svg rect,
.ag-landmark.visible .ag-building svg ellipse,
.ag-landmark.visible .ag-building svg polyline{
  stroke-dashoffset:0;
}

/* 地标描述文本 */
.ag-desc{
  max-width:580px;margin:32px auto 0;
  font-size:15.5px;line-height:1.95;
  color:#666680;letter-spacing:.02em;
  text-align:center;
}
.ag-desc .ag-char.dim{
  transition:color .3s;
}
.ag-landmark:hover .ag-desc .ag-char.dim{
  color:#8888a0;
}

/* ===== 章节分隔 ===== */
.ag-divider{
  max-width:240px;margin:0 auto 140px;
  height:1px;
  background:linear-gradient(to right,transparent,rgba(255,255,255,.08),transparent);
  position:relative;
}
.ag-divider::after{
  content:'';position:absolute;left:50%;top:-2px;
  width:5px;height:5px;border-radius:50%;
  background:var(--cyan);opacity:.4;
  transform:translateX(-50%);
  box-shadow:0 0 8px var(--cyan);
}

/* ===== 鼠标粒子拖尾 ===== */
.cursor-particle{
  position:fixed;pointer-events:none;z-index:9999;
  border-radius:50%;
  animation:particleFade .8s ease-out forwards;
}
@keyframes particleFade{
  0%{opacity:.8;transform:scale(1)}
  100%{opacity:0;transform:scale(.2)}
}

/* ===== 底部 ===== */
.footer{
  position:relative;z-index:1;
  padding:100px 24px 48px;text-align:center;
}
.footer-text{
  font-size:13px;color:#3a3a50;line-height:2;
}
.footer-link{
  color:var(--cyan);text-decoration:none;
  border-bottom:1px solid transparent;
  transition:.25s;position:relative;
}
.footer-link:hover{
  border-color:var(--cyan);
  text-shadow:0 0 8px rgba(123,224,232,.3);
}
.footer-back{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:20px;color:#555570;font-size:14px;
  text-decoration:none;transition:.25s;
}
.footer-back:hover{color:var(--cyan)}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .nav{padding:12px 16px}
  .hero{padding:80px 16px 40px}
  .hero-title{letter-spacing:2px}
  .ag-stage{padding:50px 16px 20px}
  .ag-landmark{margin-bottom:100px}
  .ag-divider{margin-bottom:100px}
}

/* 减少动画偏好 */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .ag-building svg path,.ag-building svg line,.ag-building svg rect,.ag-building svg ellipse,.ag-building svg polyline{stroke-dashoffset:0!important}
}
</style>
</head>
<body>

<!-- 多层星空背景 -->
<div class="starfield" id="starfield"></div>
<div class="ambient-glow"></div>

<!-- 导航 -->
<nav class="nav" id="navbar">
  <a class="nav-brand" href="index.html#builds">犀牛伯爵</a>
  <a class="nav-back" href="index.html#builds">← 返回创作矩阵</a>
</nav>

<!-- Hero -->
<section class="hero" id="hero">
  <div class="hero-eyebrow">Anti-Gravity Typography · 反重力排版实验</div>
  <div class="hero-title-wrap">
    <h1 class="hero-title" id="heroTitle"></h1>
  </div>
  <div class="hero-sub">
    每个字符在<span class="highlight">零重力</span>中漂浮、旋转、散落。<br>
    鼠标悬停时字母被推开，松手后<span class="highlight">弹簧回弹</span>。<br>
    用反重力文字，讲述北京地标建筑的故事。
  </div>
  <div class="scroll-hint" onclick="document.getElementById('agStage').scrollIntoView({behavior:'smooth'})">
    <span>向下滚动</span>
    <div class="arrow"></div>
  </div>
</section>

<!-- 地标章节 -->
<section class="ag-stage" id="agStage"></section>

<!-- 底部 -->
<footer class="footer">
  <div class="footer-text">
    反重力文字实验 · 灵感来自 <a class="footer-link" href="https://www.instagram.com/marina_uiux/" target="_blank" rel="noopener">Marina Budarina</a> 的零重力设计语言<br>
    字母物理交互基于 requestAnimationFrame 弹簧模拟 · 纯前端实现
  </div>
  <a class="footer-back" href="index.html#builds">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3L4 7l4 4"/></svg>
    返回创作矩阵
  </a>
</footer>

<script>
// ===== 多层星空生成 =====
(function(){
  const sf=document.getElementById('starfield');
  // 彩色星云
  const nebulae=[
    {x:'15%',y:'20%',w:300,h:300,c:'rgba(123,224,232,.15)'},
    {x:'75%',y:'60%',w:350,h:350,c:'rgba(232,199,122,.12)'},
    {x:'50%',y:'85%',w:280,h:280,c:'rgba(176,123,255,.1)'},
  ];
  nebulae.forEach(n=>{
    const el=document.createElement('div');
    el.className='nebula';
    el.style.left=n.x;el.style.top=n.y;
    el.style.width=n.w+'px';el.style.height=n.h+'px';
    el.style.background=n.c;
    sf.appendChild(el);
  });
  // 星星分三层
  const layers=[
    {count:60,min:0.5,max:1.5,op1:.15,op2:.5,durMin:2,durMax:5},
    {count:40,min:1.5,max:2.5,op1:.3,op2:.8,durMin:3,durMax:6},
    {count:20,min:2.5,max:4,op1:.4,op2:1,durMin:4,durMax:8},
  ];
  layers.forEach(layer=>{
    for(let i=0;i<layer.count;i++){
      const s=document.createElement('div');
      s.className='star';
      const sz=Math.random()*(layer.max-layer.min)+layer.min;
      s.style.width=sz+'px';s.style.height=sz+'px';
      s.style.left=Math.random()*100+'%';
      s.style.top=Math.random()*100+'%';
      s.style.setProperty('--del',Math.random()*5+'s');
      s.style.setProperty('--dur',(Math.random()*(layer.durMax-layer.durMin)+layer.durMin)+'s');
      s.style.setProperty('--op1',layer.op1);
      s.style.setProperty('--op2',layer.op2);
      // 偶尔给星星一点颜色
      if(Math.random()>.85){
        const colors=['#7BE0E8','#E8C77A','#B07BFF','#FF6B9D'];
        s.style.background=colors[Math.floor(Math.random()*colors.length)];
      }
      sf.appendChild(s);
    }
  });
})();

// ===== 鼠标视差星空 =====
let mouseX=window.innerWidth/2,mouseY=window.innerHeight/2;
document.addEventListener('mousemove',e=>{
  mouseX=e.clientX;mouseY=e.clientY;
});
(function parallaxLoop(){
  const sf=document.getElementById('starfield');
  if(sf){
    const px=(mouseX/window.innerWidth-.5)*-15;
    const py=(mouseY/window.innerHeight-.5)*-15;
    sf.style.transform=`translate(${px}px,${py}px)`;
  }
  requestAnimationFrame(parallaxLoop);
})();

// ===== 鼠标粒子拖尾 =====
const particleColors=['#7BE0E8','#E8C77A','#B07BFF','#FF6B9D','#fff'];
let lastParticle=0;
document.addEventListener('mousemove',e=>{
  const now=Date.now();
  if(now-lastParticle<30)return;
  lastParticle=now;
  const p=document.createElement('div');
  p.className='cursor-particle';
  const size=Math.random()*4+2;
  p.style.width=size+'px';p.style.height=size+'px';
  p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';
  p.style.background=particleColors[Math.floor(Math.random()*particleColors.length)];
  p.style.boxShadow=`0 0 ${size*2}px ${p.style.background}`;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),800);
});

// ===== 反重力文字渲染引擎 =====
function createCharSpray(text,opts={}){
  const{colors=['white'],fontClass='',size=28,spacing=1,glow=false}=opts;
  const wrapper=document.createElement('span');
  wrapper.className='char-spray';
  const chars=Array.from(text);
  chars.forEach((ch,i)=>{
    if(ch===' '){wrapper.appendChild(document.createTextNode(' '));return}
    const span=document.createElement('span');
    span.className='ag-char '+fontClass;
    const colorIdx=colors[i%colors.length];
    if(colorIdx)span.classList.add(colorIdx);
    if(glow)span.classList.add('glow-'+colorIdx);
    span.textContent=ch;
    span.style.fontSize=size+'px';
    span.style.letterSpacing=spacing+'px';
    // 随机漂浮参数
    const duration=3+Math.random()*4;
    const delay=Math.random()*2;
    const rot=(Math.random()*6-3).toFixed(1);
    span.style.setProperty('--rot',rot+'deg');
    span.style.animation=`floatUp ${duration}s ease-in-out ${delay}s infinite`;
    // 记录原始动画以便恢复
    span.dataset.baseAnim=span.style.animation;
    // 鼠标交互
    attachMousePhysics(span);
    wrapper.appendChild(span);
  });
  return wrapper;
}

// ===== 鼠标物理交互（修复版）=====
function attachMousePhysics(el){
  let vx=0,vy=0,ox=0,oy=0;
  let rafId=null;
  const spring=0.1,damping=0.84;
  const baseAnim=el.dataset.baseAnim||el.style.animation;

  function tick(){
    const ax=-ox*spring,ay=-oy*spring;
    vx=(vx+ax)*damping;
    vy=(vy+ay)*damping;
    ox+=vx;oy+=vy;
    if(Math.abs(ox)>.05||Math.abs(oy)>.05){
      el.style.transform=`translate(${ox.toFixed(2)}px,${oy.toFixed(2)}px)`;
      rafId=requestAnimationFrame(tick);
    }else{
      ox=0;oy=0;vx=0;vy=0;
      el.style.transform='';
      el.style.animation=baseAnim;
      rafId=null;
    }
  }

  function pushAway(clientX,clientY){
    const rect=el.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const dx=cx-clientX,dy=cy-clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120&&dist>0){
      const force=Math.min(60,(120-dist)*.6);
      vx+=(dx/dist)*force;
      vy+=(dy/dist)*force;
      el.style.animation='none';
      if(!rafId)rafId=requestAnimationFrame(tick);
    }
  }

  el.addEventListener('pointerenter',e=>pushAway(e.clientX,e.clientY));
  el.addEventListener('pointermove',e=>pushAway(e.clientX,e.clientY));
}

// ===== 全局鼠标推开（第二个交互层）=====
let globalPushRAF=null;
document.addEventListener('pointermove',e=>{
  if(globalPushRAF)return;
  globalPushRAF=requestAnimationFrame(()=>{
    globalPushRAF=null;
    // 找到鼠标附近的所有 ag-char
    const all=document.querySelectorAll('.ag-char');
    all.forEach(el=>{
      const rect=el.getBoundingClientRect();
      const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
      const dx=cx-e.clientX,dy=cy-e.clientY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<80&&dist>0){
        // 触发一个自定义事件让 attachMousePhysics 处理
        el.dispatchEvent(new PointerEvent('pointermove',{
          clientX:e.clientX,clientY:e.clientY,bubbles:true
        }));
      }
    });
  });
});

// ===== 触摸支持 =====
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  const all=document.querySelectorAll('.ag-char');
  all.forEach(el=>{
    const rect=el.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const dx=cx-t.clientX,dy=cy-t.clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<100&&dist>0){
      el.dispatchEvent(new PointerEvent('pointermove',{
        clientX:t.clientX,clientY:t.clientY,bubbles:true
      }));
    }
  });
},{passive:true});

// ===== Hero 标题反重力 =====
(function(){
  const wrap=document.getElementById('heroTitle');
  const title='ANTI-GRAVITY';
  title.split('').forEach((ch,i)=>{
    const span=document.createElement('span');
    span.className='ag-char serif bold';
    span.style.fontSize='clamp(40px,9vw,110px)';
    span.style.display='inline-block';
    span.style.letterSpacing='4px';
    if(ch===' '){span.style.width='.3em';span.style.display='inline-block';}
    else{span.textContent=ch;span.style.color='#fff';}
    const dur=3+Math.random()*3;
    const del=Math.random()*2;
    const rot=(Math.random()*4-2).toFixed(1);
    span.style.setProperty('--rot',rot+'deg');
    span.style.animation=`floatUp ${dur}s ease-in-out ${del}s infinite`;
    span.dataset.baseAnim=span.style.animation;
    attachMousePhysics(span);
    wrap.appendChild(span);
  });
})();

// ===== 渲染地标章节 =====
(function(){
  const stage=document.getElementById('agStage');
  landmarks.forEach((lm,idx)=>{
    const section=document.createElement('div');
    section.className='ag-landmark';
    section.dataset.idx=idx;

    // 章节头
    const head=document.createElement('div');
    head.className='ag-landmark-head';
    head.innerHTML=`<span class="ag-number">${lm.num}</span><span class="ag-tag">${lm.tag}</span>`;
    section.appendChild(head);

    // 标题 - 反重力文字
    const titleWrap=document.createElement('div');
    titleWrap.className='ag-body';
    titleWrap.style.marginBottom='0';
    const titleSize=lm.title.length>4?52:72;
    titleWrap.appendChild(createCharSpray(lm.title,{
      colors:lm.titleColors,
      fontClass:'serif bold glow',
      size:titleSize,
      spacing:4,
      glow:true
    }));
    section.appendChild(titleWrap);

    // 建筑插画
    const building=document.createElement('div');
    building.className='ag-building';
    building.innerHTML=lm.building;
    section.appendChild(building);

    // 描述文字 - 不用反重力，保持可读性
    const descWrap=document.createElement('div');
    descWrap.className='ag-desc';
    descWrap.textContent=lm.desc;
    section.appendChild(descWrap);

    // 分隔线
    if(idx<landmarks.length-1){
      const div=document.createElement('div');
      div.className='ag-divider';
      section.appendChild(div);
    }

    stage.appendChild(section);
  });
})();

// ===== 滚动入场动画 =====
(function(){
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
        // 建筑 SVG 依次绘制
        const paths=entry.target.querySelectorAll('.ag-building svg *');
        paths.forEach((p,i)=>{
          p.style.transitionDelay=(i*80)+'ms';
        });
      }
    });
  },{threshold:.15,rootMargin:'0px 0px -60px 0px'});

  document.querySelectorAll('.ag-landmark').forEach(el=>observer.observe(el));
})();

// ===== 导航栏滚动效果 =====
(function(){
  const nav=document.getElementById('navbar');
  let last=0;
  window.addEventListener('scroll',()=>{
    const y=window.scrollY;
    if(y>80){
      nav.style.background='rgba(5,5,10,.85)';
      nav.style.borderBottom='1px solid rgba(255,255,255,.1)';
    }else{
      nav.style.background='rgba(5,5,10,.6)';
      nav.style.borderBottom='1px solid rgba(255,255,255,.06)';
    }
    last=y;
  });
})();
