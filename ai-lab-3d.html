<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 创作实验室 · 犀牛伯爵</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #02040a;
    overflow: hidden;
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    color: #F2F7F6;
  }
  #canvas-container {
    width: 100vw; height: 100vh;
    position: absolute; top: 0; left: 0; z-index: 1;
  }

  /* 加载动画 */
  #loader {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #02040a; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease-out;
  }
  .loader-text {
    color: #27D7C9; font-size: 12px; letter-spacing: 4px;
    margin-top: 20px; text-transform: uppercase; font-weight: 300;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 1px solid rgba(39,215,201,0.15);
    border-top: 1px solid #27D7C9;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 欢迎弹窗 */
  #welcome-modal {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(2,4,10,0.85); z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(12px);
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-content {
    background: rgba(6,10,18,0.92);
    border: 1px solid rgba(39,215,201,0.2);
    padding: 50px 40px;
    max-width: 520px; width: 90%;
    text-align: center;
    box-shadow: 0 0 60px rgba(39,215,201,0.08), 0 20px 80px -20px rgba(0,0,0,0.8);
    border-radius: 2px;
    position: relative;
  }
  .modal-content::before, .modal-content::after {
    content: ''; position: absolute;
    width: 24px; height: 24px;
    border: 1px solid rgba(39,215,201,0.3);
  }
  .modal-content::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .modal-content::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .modal-title {
    font-size: 28px;
    background: linear-gradient(135deg, #F2F7F6, #27D7C9, #8E7CFF);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-family: 'Cinzel', serif;
    font-weight: 400;
  }
  .modal-subtitle {
    color: rgba(242,247,246,0.4);
    font-size: 11px; letter-spacing: 4px;
    margin-bottom: 36px; text-transform: uppercase;
  }

  .modal-buttons {
    display: flex; flex-direction: column; gap: 12px;
  }
  .modal-btn {
    background: rgba(39,215,201,0.06);
    border: 1px solid rgba(39,215,201,0.2);
    color: #27D7C9; padding: 16px 28px;
    text-decoration: none; text-transform: uppercase;
    letter-spacing: 3px; font-size: 11px;
    transition: all 0.4s; cursor: pointer;
    display: block; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
  }
  .modal-btn:hover {
    background: rgba(39,215,201,0.15);
    border-color: #27D7C9;
    box-shadow: 0 0 30px rgba(39,215,201,0.15);
    transform: translateY(-1px);
  }
  .modal-btn-primary {
    background: rgba(39,215,201,0.12);
    border-color: rgba(39,215,201,0.4);
  }
  .modal-desc {
    font-size: 10px; color: rgba(242,247,246,0.35);
    margin-top: 6px; letter-spacing: 1px; text-transform: none;
  }
  .modal-footer {
    margin-top: 30px; font-size: 9px;
    color: rgba(242,247,246,0.25); letter-spacing: 2px;
  }
  .modal-footer a {
    color: #27D7C9; text-decoration: none;
    border-bottom: 1px solid rgba(39,215,201,0.2);
  }

  /* HUD overlay */
  .hud-top {
    position: fixed; top: 24px; left: 24px; right: 24px;
    z-index: 50; display: flex;
    justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .hud-top > * { pointer-events: auto; }
  .hud-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: rgba(39,215,201,0.6);
    letter-spacing: 3px; text-transform: uppercase;
  }
  .hud-logo strong { color: #27D7C9; }
  .hud-back {
    padding: 8px 16px;
    border: 1px solid rgba(39,215,201,0.2);
    border-radius: 2px;
    color: rgba(39,215,201,0.8);
    text-decoration: none;
    font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase;
    background: rgba(2,4,10,0.5);
    backdrop-filter: blur(10px);
    transition: all 0.25s;
    font-family: 'JetBrains Mono', monospace;
  }
  .hud-back:hover {
    border-color: #27D7C9;
    background: rgba(39,215,201,0.08);
    color: #27D7C9;
  }

  /* 底部信息 */
  .hud-bottom {
    position: fixed; bottom: 24px; left: 24px; right: 24px;
    z-index: 50; display: flex;
    justify-content: space-between; align-items: flex-end;
    pointer-events: none;
  }
  .hud-bottom > * { pointer-events: auto; }
  .hud-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 2px;
    color: rgba(242,247,246,0.25);
    text-transform: uppercase;
    line-height: 1.8;
  }
  .hud-info span { color: rgba(39,215,201,0.5); }
  .hud-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 2px;
    color: rgba(242,247,246,0.2);
    text-transform: uppercase;
  }

  /* 侧边数据流 */
  .data-stream {
    position: fixed; right: 24px; top: 50%;
    transform: translateY(-50%); z-index: 50;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px; letter-spacing: 1px;
    color: rgba(39,215,201,0.15);
    text-align: right; line-height: 1.6;
    pointer-events: none;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
</style>

    <span id="fps">60</span> FPS

    DRAG TO ROTATE · SCROLL TO ZOOM
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

// ═══════════════════════════════════════════════════════════
// 配置
// ═══════════════════════════════════════════════════════════
const CFG = {
  colors: {
    bg: 0x02040a,
    accent: 0x27D7C9,
    electric: 0x8E7CFF,
    warm: 0xFF7A59,
    gold: 0xE9C46A,
  },
  particles: {
    coreCount: 800,       // 核心区粒子
    orbitCount: 120,      // 轨道粒子
    dustCount: 2000,      // 远景尘埃
    radius: 8,
    height: 20,
  },
  camera: { z: 22, y: 2 },
};

// ═══════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════
let scene, camera, renderer, composer, mainGroup, clock = new THREE.Clock();
let controls;
const interactables = [];

function init() {
  initThree();
  setupEnvironment();
  setupLights();
  createCoreStructure();
  createOrbitParticles();
  createDust();
  createDataStreams();
  setupPostProcessing();
  setupInteraction();

  // 隐藏加载动画
  const loader = document.getElementById('loader');
  loader.style.opacity = 0;
  setTimeout(() => loader.remove(), 800);

  // 显示欢迎弹窗
  setTimeout(() => {
    document.getElementById('welcome-modal').style.display = 'flex';
  }, 800);

  animate();
}

function initThree() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(CFG.colors.bg);
  scene.fog = new THREE.FogExp2(CFG.colors.bg, 0.012);

  camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, CFG.camera.y, CFG.camera.z);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  mainGroup = new THREE.Group();
  scene.add(mainGroup);

  // OrbitControls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 10;
  controls.maxDistance = 40;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minPolarAngle = Math.PI * 0.1;
  controls.target.set(0, 2, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;
}

function setupEnvironment() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
}

function setupLights() {
  scene.add(new THREE.AmbientLight(0x162030, 0.4));

  // 核心光源 — 青色
  const coreLight = new THREE.PointLight(CFG.colors.accent, 6, 15, 1.5);
  coreLight.position.set(0, 3, 0);
  mainGroup.add(coreLight);

  // 补光 — 紫色
  const purpleLight = new THREE.PointLight(CFG.colors.electric, 3, 12, 1.5);
  purpleLight.position.set(4, 2, 3);
  mainGroup.add(purpleLight);

  // 暖光
  const warmLight = new THREE.PointLight(CFG.colors.warm, 2, 10, 2);
  warmLight.position.set(-3, 1, 4);
  mainGroup.add(warmLight);

  // 方向光
  const dir = new THREE.DirectionalLight(0x4a6580, 0.3);
  dir.position.set(5, 10, 5);
  scene.add(dir);
}

// ═══════════════════════════════════════════════════════════
// 核心结构 — 螺旋 DNA 风格的知识树
// ═══════════════════════════════════════════════════════════
function createCoreStructure() {
  // 核心发光球
  const coreSphere = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.8, 1),
    new THREE.MeshStandardMaterial({
      color: CFG.colors.accent,
      emissive: CFG.colors.accent,
      emissiveIntensity: 0.8,
      metalness: 0.3,
      roughness: 0.2,
      transparent: true,
      opacity: 0.7,
      flatShading: true,
    })
  );
  coreSphere.position.set(0, 3, 0);
  coreSphere.userData = {
    name: 'AI 核心',
    desc: '犀牛伯爵 AI 创作核心 — 驱动内容生产、知识管理和交互实验的中央引擎。',
    isInteractable: true,
  };
  mainGroup.add(coreSphere);
  interactables.push(coreSphere);

  // 核心光晕
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 32, 32),
    new THREE.MeshBasicMaterial({
      color: CFG.colors.accent,
      transparent: true,
      opacity: 0.05,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );
  halo.position.copy(coreSphere.position);
  mainGroup.add(halo);

  // 螺旋结构 — 双螺旋（DNA 风格），代表知识网络
  const helixHeight = 16;
  const helixRadius = 3;
  const helixTurns = 4;
  const nodeCount = 60;

  const goldMat = new THREE.MeshStandardMaterial({
    color: CFG.colors.gold, metalness: 0.9, roughness: 0.15,
    emissive: 0x443300, emissiveIntensity: 0.3, envMapIntensity: 1.5,
  });
  const tealMat = new THREE.MeshStandardMaterial({
    color: CFG.colors.accent, metalness: 0.7, roughness: 0.2,
    emissive: CFG.colors.accent, emissiveIntensity: 0.2, envMapIntensity: 1.0,
  });
  const purpleMat = new THREE.MeshStandardMaterial({
    color: CFG.colors.electric, metalness: 0.7, roughness: 0.2,
    emissive: CFG.colors.electric, emissiveIntensity: 0.2, envMapIntensity: 1.0,
  });
  const warmMat = new THREE.MeshStandardMaterial({
    color: CFG.colors.warm, metalness: 0.6, roughness: 0.25,
    emissive: CFG.colors.warm, emissiveIntensity: 0.15, envMapIntensity: 0.8,
  });

  const nodeGeos = [
    new THREE.OctahedronGeometry(0.25, 0),
    new THREE.TetrahedronGeometry(0.25, 0),
    new THREE.IcosahedronGeometry(0.22, 0),
    new THREE.BoxGeometry(0.3, 0.3, 0.3),
  ];
  const nodeMats = [tealMat, goldMat, purpleMat, warmMat];

  // 存储节点位置用于连线
  const helixNodes = [];

  for (let strand = 0; strand < 2; strand++) {
    const phase = strand * Math.PI;
    for (let i = 0; i < nodeCount; i++) {
      const t = i / nodeCount;
      const angle = t * Math.PI * 2 * helixTurns + phase;
      const y = (t - 0.5) * helixHeight + 3;

      // 节点
      const geoIdx = Math.floor(Math.random() * nodeGeos.length);
      const matIdx = Math.floor(Math.random() * nodeMats.length);
      const node = new THREE.Mesh(nodeGeos[geoIdx], nodeMats[matIdx]);
      const r = helixRadius + (Math.random() - 0.5) * 0.8;
      node.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
      node.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      const s = 0.5 + Math.random() * 0.5;
      node.scale.set(s, s, s);
      node.userData = { floatOffset: Math.random() * Math.PI * 2, baseY: y };
      mainGroup.add(node);
      helixNodes.push({ pos: node.position.clone(), strand, idx: i });
    }
  }

  // 螺旋间的横连接线（DNA 桥梁）
  const lineMat = new THREE.LineBasicMaterial({
    color: CFG.colors.accent,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
  });

  for (let i = 0; i < nodeCount; i++) {
    const n1 = helixNodes[i];
    const n2 = helixNodes[i + nodeCount];
    if (n1 && n2) {
      // 只连接相近的对
      const dist = n1.pos.distanceTo(n2.pos);
      if (dist < 8) {
        const geo = new THREE.BufferGeometry().setFromPoints([n1.pos, n2.pos]);
        const line = new THREE.Line(geo, lineMat);
        mainGroup.add(line);
      }
    }
  }

  // 底座平台
  const baseGeo = new THREE.CylinderGeometry(4, 4.5, 0.15, 64);
  const baseMat = new THREE.MeshStandardMaterial({
    color: 0x060810,
    metalness: 0.85,
    roughness: 0.25,
    envMapIntensity: 0.6,
  });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.set(0, -5.5, 0);
  base.receiveShadow = true;
  mainGroup.add(base);

  // 底座发光环
  const baseRing = new THREE.Mesh(
    new THREE.TorusGeometry(4.2, 0.02, 8, 64),
    new THREE.MeshBasicMaterial({
      color: CFG.colors.accent,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending,
    })
  );
  baseRing.position.set(0, -5.4, 0);
  baseRing.rotation.x = Math.PI / 2;
  mainGroup.add(baseRing);

  // 底座内圈
  const innerRing = new THREE.Mesh(
    new THREE.TorusGeometry(3, 0.015, 8, 48),
    new THREE.MeshBasicMaterial({
      color: CFG.colors.electric,
      transparent: true,
      opacity: 0.25,
      blending: THREE.AdditiveBlending,
    })
  );
  innerRing.position.set(0, -5.4, 0);
  innerRing.rotation.x = Math.PI / 2;
  mainGroup.add(innerRing);

  // 底座交互
  base.userData = {
    name: '知识基座',
    desc: '44 个知识节点 · 0 断链 · 0 孤立 — 基于 Karpathy LLM-Wiki 方法论的 Obsidian 知识图谱。',
    isInteractable: true,
  };
  interactables.push(base);
}

// ═══════════════════════════════════════════════════════════
// 轨道粒子
// ═══════════════════════════════════════════════════════════
let orbitData = [];
function createOrbitParticles() {
  const count = CFG.particles.orbitCount;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  orbitData = [];

  const cTeal = new THREE.Color(CFG.colors.accent);
  const cPurple = new THREE.Color(CFG.colors.electric);
  const cGold = new THREE.Color(CFG.colors.gold);

  for (let i = 0; i < count; i++) {
    const radius = 4 + Math.random() * 4;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    orbitData.push({ radius, theta, phi, speed: 0.0003 + Math.random() * 0.001 });

    positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = radius * Math.cos(phi) + 2;
    positions[i*3+2] = radius * Math.sin(phi) * Math.sin(theta);

    const c = [cTeal, cPurple, cGold][Math.floor(Math.random() * 3)];
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.06, vertexColors: true, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  mainGroup.add(points);
  points.userData.isOrbit = true;
}

// ═══════════════════════════════════════════════════════════
// 远景尘埃
// ═══════════════════════════════════════════════════════════
function createDust() {
  const count = CFG.particles.dustCount;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  const cTeal = new THREE.Color(CFG.colors.accent);
  const cPurple = new THREE.Color(CFG.colors.electric);

  for (let i = 0; i < count; i++) {
    const r = 15 + Math.random() * 25;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

    const c = Math.random() > 0.5 ? cTeal : cPurple;
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const dust = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.04, vertexColors: true, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(dust);
}

// ═══════════════════════════════════════════════════════════
// 数据流 — 垂直滚动的代码流（装饰性）
// ═══════════════════════════════════════════════════════════
function createDataStreams() {
  const streamEl = document.getElementById('dataStream');
  const terms = ['AGENT', 'MCP', 'RAG', 'PROMPT', 'VIBE', 'CODEX', 'FABLE-5', 'VERTEX', 'CLAUDE', 'WHISPER', 'OBSIDIAN', 'THREE.JS', 'BLOOM', 'SHADER', 'WEBGL'];
  let text = '';
  for (let i = 0; i < 60; i++) {
    text += terms[Math.floor(Math.random() * terms.length)] + ' · ';
  }
  streamEl.textContent = text;
}

// ═══════════════════════════════════════════════════════════
// 后处理
// ═══════════════════════════════════════════════════════════
function setupPostProcessing() {
  const renderPass = new RenderPass(scene, camera);
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.0, 0.4, 0.85
  );
  bloomPass.threshold = 0.6;
  bloomPass.strength = 0.5;
  bloomPass.radius = 0.45;

  composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);

  const fxaa = new ShaderPass(FXAAShader);
  fxaa.material.uniforms['resolution'].value.set(
    1 / (window.innerWidth * renderer.getPixelRatio()),
    1 / (window.innerHeight * renderer.getPixelRatio())
  );
  composer.addPass(fxaa);
}

// ═══════════════════════════════════════════════════════════
// 交互 — 射线检测
// ═══════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownPos = null;

function setupInteraction() {
  renderer.domElement.addEventListener('pointerdown', (e) => {
    pointerDownPos = { x: e.clientX, y: e.clientY };
  });

  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!pointerDownPos) return;
    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;
    // 只有点击（非拖拽）才触发
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(interactables, true);
      if (hits.length > 0) {
        let t = hits[0].object;
        while (t && !t.userData.isInteractable) t = t.parent;
        if (t && t.userData.name) {
          showInfo(t.userData.name, t.userData.desc);
        }
      }
    }
    pointerDownPos = null;
  });

  // hover 光标
  renderer.domElement.addEventListener('pointermove', (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(interactables, true);
    renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
  });
}

function showInfo(title, text) {
  // 创建临时信息浮层
  const existing = document.getElementById('info-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'info-toast';
  toast.style.cssText = `
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    padding: 20px 32px; background: rgba(2,4,10,0.9);
    border: 1px solid rgba(39,215,201,0.2); border-radius: 4px;
    backdrop-filter: blur(20px); z-index: 100;
    max-width: 420px; text-align: center;
    opacity: 0; transition: opacity 0.4s;
    box-shadow: 0 0 40px rgba(39,215,201,0.08);
  `;
  toast.innerHTML = `
    <div style="font-size: 13px; color: #27D7C9; margin-bottom: 6px; letter-spacing: 2px; font-family: 'JetBrains Mono', monospace;">${title}</div>
    <div style="font-size: 12px; color: rgba(242,247,246,0.6); line-height: 1.6;">${text}</div>
  `;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.style.opacity = '1');
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 400);
  }, 4000);
}

// ═══════════════════════════════════════════════════════════
// 全局函数 — 进入实验室
// ═══════════════════════════════════════════════════════════
window.enterLab = function() {
  document.getElementById('welcome-modal').style.display = 'none';
};

// ═══════════════════════════════════════════════════════════
// 动画循环
// ═══════════════════════════════════════════════════════════
let frameCount = 0, lastFpsTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frameCount++;

  controls.update();

  // 主体缓慢自转
  mainGroup.rotation.y += 0.0015;

  // 核心球脉冲
  if (interactables[0]) {
    const pulse = 1 + Math.sin(t * 1.5) * 0.05;
    interactables[0].scale.setScalar(pulse);
    interactables[0].material.emissiveIntensity = 0.7 + Math.sin(t * 1.5) * 0.2;
  }

  // 螺旋节点浮动
  mainGroup.children.forEach(child => {
    if (child.userData.floatOffset !== undefined) {
      child.position.y = child.userData.baseY + Math.sin(t * 0.5 + child.userData.floatOffset) * 0.1;
      child.rotation.x += 0.002;
      child.rotation.y += 0.003;
    }
  });

  // 轨道粒子运动
  mainGroup.children.forEach(child => {
    if (child.userData.isOrbit && child.geometry) {
      const pos = child.geometry.attributes.position.array;
      const data = orbitData;
      for (let i = 0; i < data.length; i++) {
        data[i].theta += data[i].speed;
        pos[i*3] = data[i].radius * Math.sin(data[i].phi) * Math.cos(data[i].theta);
        pos[i*3+1] = data[i].radius * Math.cos(data[i].phi) + 2;
        pos[i*3+2] = data[i].radius * Math.sin(data[i].phi) * Math.sin(data[i].theta);
      }
      child.geometry.attributes.position.needsUpdate = true;
    }
  });

  // 底座环旋转
  mainGroup.children.forEach(child => {
    if (child.geometry && child.geometry.type === 'TorusGeometry') {
      child.rotation.z += 0.003;
    }
  });

  // FPS
  if (t - lastFpsTime > 1) {
    const fps = Math.round(frameCount / (t - lastFpsTime));
    const el = document.getElementById('fps');
    if (el) el.textContent = fps;
    frameCount = 0; lastFpsTime = t;
  }

  composer.render();
}

// ═══════════════════════════════════════════════════════════
// 窗口缩放
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}, { passive: true });

// 启动
init();
</script>
