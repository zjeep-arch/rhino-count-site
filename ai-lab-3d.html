<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creative Lab - Synaptic Dreams</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00bb;
            --glass-bg: rgba(10, 25, 41, 0.45);
            --glass-border: rgba(0, 243, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020208;
            font-family: 'Consolas', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #ffffff;
        }

        /* 3D 底层画布 */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 全局科幻 UI 图层 */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* 穿透鼠标事件到3D */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 35px 50px;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .interactive {
            pointer-events: auto; /* 激活UI交互 */
        }

        /* 统一的高级毛玻璃科幻面板样式 */
        .sci-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.05), inset 0 0 15px rgba(0, 243, 255, 0.1);
            transition: all 0.3s ease;
        }

        /* ================= 1. 顶部标题区域 ================= */
        .top-header {
            text-align: center;
            width: 100%;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.6), 0 0 40px rgba(0, 243, 255, 0.2);
            margin-bottom: 2px;
        }

        .sub-title {
            font-size: 0.85rem;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .counter-badge {
            display: inline-block;
            padding: 6px 16px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            background: rgba(0, 243, 255, 0.05);
            font-weight: bold;
        }

        /* ================= 2. 中间两翼布局 ================= */
        .mid-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 60vh;
        }

        /* 左翼：功能按键组 */
        .left-wing {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 180px;
        }

        .nav-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 85px;
            cursor: pointer;
            text-decoration: none;
            color: rgba(255,255,255,0.7);
        }

        .nav-card:hover {
            color: #fff;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2);
            transform: translateX(5px);
        }

        .nav-card svg {
            width: 28px;
            height: 28px;
            margin-bottom: 8px;
            fill: currentColor;
            filter: drop-shadow(0 0 5px rgba(0,243,255,0.3));
        }

        .nav-card span {
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* 右翼：数据监视器 */
        .right-wing {
            width: 280px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 效果图圆盘心率感应器 */
        .pulse-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .pulse-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 243, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 10px;
            animation: spin 20s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .pulse-wave {
            position: absolute;
            width: 70px;
            height: 35px;
            border-top: 2px solid var(--neon-cyan);
            border-radius: 50% 50% 0 0;
            animation: pulseWave 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulseWave {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px var(--neon-cyan)); }
        }

        .pulse-title {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            text-align: center;
        }

        /* 实时参数文本 */
        .data-list {
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            letter-spacing: 1px;
        }

        .data-label { color: rgba(255,255,255,0.5); }
        .data-val { color: var(--neon-cyan); font-weight: bold; }

        /* ================= 3. 底部快捷操作 ================= */
        .bottom-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .bottom-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .bottom-btn:hover {
            border-color: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 187, 0.4);
        }

        .center-tip {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        /* 加载黑幕 */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #03030a; z-index: 100; display: flex; justify-content: center;
            align-items: center; flex-direction: column; transition: opacity 0.8s ease;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div style="width: 40px; height: 40px; border: 2px solid rgba(0,243,255,0.1); border-top-color: var(--neon-cyan); border-radius: 50%; animation: spin 1s infinite linear;"></div>
        <p style="margin-top: 20px; font-size: 0.8rem; letter-spacing: 3px; color: var(--neon-cyan);">INITIALIZING CYBER SCENE...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="hud-overlay">
        
        <div class="top-header">
            <h1 class="main-title">AI CREATIVE LAB</h1>
            <div class="sub-title">Synaptic Dreams Collection</div>
            <div class="counter-badge">REALTIME PARTICLE COUNT: <span id="p-count">14,352</span></div>
        </div>

        <div class="mid-container">
            <div class="left-wing interactive">
                <a href="#" class="sci-panel nav-card">
                    <svg viewBox="0 0 24 24"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3"/><path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="currentColor" stroke-width="2"/></svg>
                    <span>AI Generator</span>
                </a>
                <div class="sci-panel nav-card">
                    <svg viewBox="0 0 24 24"><path d="M7.5 10.5L4 14V17H7L10.5 13.5M17 4.5L19.5 7L10.5 16L7 17L8 13.5L17 4.5Z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <span>Art Style</span>
                </div>
                <div class="sci-panel nav-card">
                    <svg viewBox="0 0 24 24"><path d="M4 16V20H20V16M12 3V15M12 15L8 11M12 15L16 11" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <span>Export 3D</span>
                </div>
            </div>

            <div class="sci-panel right-wing interactive">
                <div class="pulse-box">
                    <div class="pulse-circle">
                        <div class="pulse-wave"></div>
                    </div>
                    <div class="pulse-title">STORM INTENSITY</div>
                </div>
                <div class="data-list">
                    <div class="data-item"><span class="data-label">DATA VORTEX STABILITY:</span><span class="data-val" id="val-stab">98.4%</span></div>
                    <div class="data-item"><span class="data-label">ACTIVE AI MODELS:</span><span class="data-val">3</span></div>
                    <div class="data-item"><span class="data-label">TEMPORAL FLUX:</span><span class="data-val">0.002s</span></div>
                </div>
            </div>
        </div>

        <div class="bottom-footer">
            <button class="bottom-btn interactive" onclick="window.history.back()">← SYSTEM RETURN</button>
            <div class="center-tip">DRAG TO ROTATE • SCROLL TO ZOOM • CLICK TO INJECT TEMPEST</div>
            <button class="bottom-btn interactive" id="mute-btn">AUDIO: ON</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // --- 1. 基础舞台与超分辨率渲染设置 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#010105', 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // 终极色彩映射
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 4;
        controls.maxDistance = 15;

        // --- 2. 完美还原：赛博辉光通道 (Bloom) ---
        const renderScene = new THREE.RenderPass(scene, camera);
        // 强度1.8，半径0.7，阈值0.1，完美还原图中的炫目高亮光晕
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.7, 0.1);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 3. 舞台灯光（大厂冷暖双色侧光体系） ---
        scene.add(new THREE.AmbientLight('#050515', 1.0));
        
        const cyanLight = new THREE.DirectionalLight('#00f3ff', 2.5);
        cyanLight.position.set(6, 6, 4);
        scene.add(cyanLight);

        const pinkLight = new THREE.DirectionalLight('#ff00bb', 1.8);
        pinkLight.position.set(-6, 4, -4);
        scene.add(pinkLight);

        // --- 4. 资产构建：星云水晶球 ---
        const globeGroup = new THREE.Group();
        globeGroup.position.y = -0.5; // 轻微向下偏移腾出上方视觉空间
        scene.add(globeGroup);

        // 哑光钛合金底座
        const baseGeo = new THREE.CylinderGeometry(2.8, 3.2, 1.0, 64);
        const baseMat = new THREE.MeshStandardMaterial({ color: '#05070f', roughness: 0.15, metalness: 0.9 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = -2.1;
        globeGroup.add(base);

        // 底座科幻自发光环
        const neonRingGeo = new THREE.TorusGeometry(2.82, 0.04, 16, 100);
        const neonRingMat = new THREE.MeshBasicMaterial({ color: '#00f3ff' });
        const neonRing = new THREE.Mesh(neonRingGeo, neonRingMat);
        neonRing.rotation.x = Math.PI / 2;
        neonRing.position.y = -1.6;
        globeGroup.add(neonRing);

        // 高级清漆玻璃外壳
        const glassGeo = new THREE.SphereGeometry(3.0, 64, 64);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: '#ffffff', transparent: true, opacity: 0.08,
            transmission: 0.96, ior: 1.52, roughness: 0.01,
            clearcoat: 1.0, clearcoatRoughness: 0.01, side: THREE.DoubleSide
        });
        const glass = new THREE.Mesh(glassGeo, glassMat);
        globeGroup.add(glass);

        // --- 5. 核心震撼：还原图中漩涡星云效果 ---
        const vortexCount = 2500;
        const vortexGeo = new THREE.BufferGeometry();
        const vortexPositions = new Float32Array(vortexCount * 3);
        const vortexColors = new Float32Array(vortexCount * 3);
        const vortexData = [];

        const colorCyan = new THREE.Color('#00f3ff');
        const colorPink = new THREE.Color('#ff00bb');

        for(let i=0; i<vortexCount; i++) {
            // 阿基米德螺线模拟漩涡
            const r = Math.random() * 2.6;
            const theta = r * 5 + Math.random() * 1.5; 
            const y = (Math.random() - 0.5) * 0.4 * (2.8 - r); // 中心厚边缘薄

            vortexPositions[i*3] = r * Math.cos(theta);
            vortexPositions[i*3+1] = y;
            vortexPositions[i*3+2] = r * Math.sin(theta);

            // 混合冷暖双色通道
            const mixedColor = colorCyan.clone().lerp(colorPink, r / 2.6);
            vortexColors[i*3] = mixedColor.r;
            vortexColors[i*3+1] = mixedColor.g;
            vortexColors[i*3+2] = mixedColor.b;

            vortexData.push({ r, theta, y, speed: 0.02 + (2.8 - r) * 0.01 });
        }
        vortexGeo.setAttribute('position', new THREE.BufferAttribute(vortexPositions, 3));
        vortexGeo.setAttribute('color', new THREE.BufferAttribute(vortexColors, 3));

        const pTex = (() => {
            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(16,16,0, 16,16,16);
            g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g; ctx.fillRect(0,0,32,32); return new THREE.CanvasTexture(canvas);
        })();

        const vortexMat = new THREE.PointsMaterial({
            size: 0.06, vertexColors: true, map: pTex, transparent: true,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        const vortexParticles = new THREE.Points(vortexGeo, vortexMat);
        vortexParticles.position.y = 0.2;
        globeGroup.add(vortexParticles);

        // 周围悬浮的外围粒子群 (散落雪花)
        const envCount = 1000;
        const envGeo = new THREE.BufferGeometry();
        const envPos = new Float32Array(envCount * 3);
        const envData = [];
        for(let i=0; i<envCount; i++) {
            const u = Math.random(); const v = Math.random();
            const theta = u * 2 * Math.PI; const phi = Math.acos(2 * v - 1);
            const r = Math.cbrt(Math.random()) * 2.8;
            envPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            envPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            envPos[i*3+2] = r * Math.cos(phi);
            envData.push({ xSpeed: (Math.random()-0.5)*0.004, ySpeed: -Math.random()*0.01 - 0.003, zSpeed: (Math.random()-0.5)*0.004 });
        }
        envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
        const envMat = new THREE.PointsMaterial({ size: 0.04, color: '#ffffff', map: pTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        const envParticles = new THREE.Points(envGeo, envMat);
        globeGroup.add(envParticles);

        // --- 6. 暴风雪魔法波动交互 ---
        let isStorm = false;
        window.addEventListener('click', (e) => {
            if(e.target.closest('.interactive')) return; // 排除点击UI
            isStorm = true;
            
            // 粒子暴风雪散开动效
            new TWEEN.Tween(bloomPass).to({ strength: 3.8 }, 250).yoyo(true).repeat(1).start();
            
            // UI数据随机跳动反馈
            document.getElementById('val-stab').innerText = (90 + Math.random()*8).toFixed(1) + "%";
            document.getElementById('p-count').innerText = Math.floor(14000 + Math.random()*2000).toLocaleString();

            setTimeout(() => { isStorm = false; }, 1200);
        });

        // 移除加载层
        setTimeout(() => {
            const loader = document.getElementById('loading');
            if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 800); }
        }, 500);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. 动态渲染环 ---
        const clock = new THREE.Clock();
        const animate = () => {
            requestAnimationFrame(animate);
            TWEEN.update();
            const time = clock.getElapsedTime();

            // 整体自转
            globeGroup.rotation.y = time * 0.02;

            // 漩涡粒子内聚旋转更新
            const vPos = vortexParticles.geometry.attributes.position;
            for(let i=0; i<vortexCount; i++) {
                const data = vortexData[i];
                if(!isStorm) {
                    data.theta += data.speed;
                } else {
                    data.theta += data.speed * 5; // 暴风雪爆发时急速旋转
                }
                vPos.setX(i, data.r * Math.cos(data.theta));
                vPos.setZ(i, data.r * Math.sin(data.theta));
            }
            vPos.needsUpdate = true;

            // 外围落雪粒子更新
            const ePos = envParticles.geometry.attributes.position;
            for(let i=0; i<envCount; i++) {
                let ex = ePos.getX(i); let ey = ePos.getY(i); let ez = ePos.getZ(i);
                const d = envData[i];

                ex += d.xSpeed; ey += d.ySpeed; ez += d.zSpeed;
                if(Math.sqrt(ex*ex + ey*ey + ez*ez) > 2.8 || ey < -1.4) {
                    ey = 2.5; ex = (Math.random()-0.5)*2; ez = (Math.random()-0.5)*2;
                }
                ePos.setXYZ(i, ex, ey, ez);
            }
            ePos.needsUpdate = true;

            controls.update();
            composer.render(); // 渲染带有赛博辉光效果的画面
        };
        animate();
    </script>
</body>
</html>
