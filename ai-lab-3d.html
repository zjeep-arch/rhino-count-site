<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 创作实验室 · 犀牛伯爵</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #27D7C9;
    --electric: #8E7CFF;
    --warm: #FF7A59;
    --gold: #E9C46A;
    --bg: #02040a;
    --fg: #F2F7F6;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    overflow-x: hidden;
    cursor: none;
  }
  #three-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }
  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 20px; height: 20px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, background 0.2s;
    mix-blend-mode: screen;
  }
  .cursor.hover {
    width: 40px; height: 40px;
    background: rgba(39,215,201,0.1);
    border-color: var(--accent);
  }
  /* Scroll content */
  .scroll-content {
    position: relative;
    z-index: 1;
    pointer-events: none;
  }
  .scroll-content a, .scroll-content button { pointer-events: auto; }

  /* Sections */
  section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* HUD elements */
  .hud-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    pointer-events: none;
  }
  .hud-bar > * { pointer-events: auto; }
  .hud-logo {
    font-family: 'SF Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-shadow: 0 0 12px rgba(39,215,201,0.4);
  }
  .hud-back {
    padding: 8px 16px;
    border: 1px solid rgba(39,215,201,0.25);
    border-radius: 999px;
    color: var(--accent);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.1em;
    background: rgba(2,4,10,0.5);
    backdrop-filter: blur(12px);
    transition: all 0.25s;
  }
  .hud-back:hover {
    border-color: var(--accent);
    background: rgba(39,215,201,0.08);
  }

  /* Scroll progress */
  .scroll-indicator {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }
  .scroll-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(39,215,201,0.2);
    transition: all 0.3s;
  }
  .scroll-dot.active {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    transform: scale(1.5);
  }

  /* Hero */
  .hero-content {
    text-align: center;
    max-width: 900px;
    padding: 0 24px;
  }
  .hero-label {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(39,215,201,0.5);
    margin-bottom: 24px;
  }
  .hero-title {
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 200;
    line-height: 1.05;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #F2F7F6 0%, #27D7C9 50%, #8E7CFF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }
  .hero-subtitle {
    font-size: clamp(14px, 2vw, 18px);
    color: rgba(242,247,246,0.5);
    max-width: 600px;
    margin: 0 auto 48px;
    line-height: 1.6;
  }
  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 32px;
    border: 1px solid rgba(39,215,201,0.3);
    border-radius: 999px;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.08em;
    background: rgba(39,215,201,0.05);
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .hero-cta:hover {
    border-color: var(--accent);
    background: rgba(39,215,201,0.12);
    box-shadow: 0 0 30px rgba(39,215,201,0.2);
  }
  .scroll-hint {
    position: absolute;
    bottom: 48px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(242,247,246,0.25);
    font-family: 'SF Mono', monospace;
    animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  /* Works section */
  .works-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    max-width: 1200px;
    padding: 0 24px;
  }
  .work-card {
    width: 320px;
    padding: 28px;
    background: rgba(8,12,20,0.6);
    border: 1px solid rgba(39,215,201,0.1);
    border-radius: 16px;
    backdrop-filter: blur(16px);
    transition: all 0.4s cubic-bezier(0.2,0.8,0.3,1);
    opacity: 0;
    transform: translateY(40px);
  }
  .work-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .work-card:hover {
    border-color: rgba(39,215,201,0.3);
    background: rgba(8,12,20,0.8);
    box-shadow: 0 20px 60px -20px rgba(39,215,201,0.15);
    transform: translateY(-4px);
  }
  .work-tag {
    display: inline-block;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 4px 10px;
    border: 1px solid rgba(39,215,201,0.2);
    border-radius: 4px;
    margin-bottom: 16px;
  }
  .work-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--fg);
  }
  .work-desc {
    font-size: 13px;
    line-height: 1.6;
    color: rgba(242,247,246,0.5);
    margin-bottom: 20px;
  }
  .work-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.05em;
    transition: gap 0.3s;
  }
  .work-link:hover { gap: 12px; }

  /* Capabilities */
  .caps-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 900px;
    padding: 0 24px;
  }
  .cap-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 140px;
    padding: 24px 12px;
    background: rgba(8,12,20,0.5);
    border: 1px solid rgba(39,215,201,0.08);
    border-radius: 12px;
    text-align: center;
    transition: all 0.3s;
    opacity: 0;
    transform: scale(0.8);
  }
  .cap-item.visible {
    opacity: 1;
    transform: scale(1);
  }
  .cap-item:hover {
    border-color: rgba(39,215,201,0.25);
    background: rgba(8,12,20,0.7);
  }
  .cap-icon {
    width: 40px; height: 40px;
    margin-bottom: 12px;
    color: var(--accent);
  }
  .cap-name {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .cap-desc {
    font-size: 10px;
    color: rgba(242,247,246,0.4);
    line-height: 1.4;
  }

  /* Data panel */
  .data-panel {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 48px;
    max-width: 900px;
    padding: 0 24px;
  }
  .data-item {
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
  }
  .data-item.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .data-value {
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 200;
    background: linear-gradient(135deg, var(--accent), var(--electric));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .data-label {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(242,247,246,0.4);
    margin-top: 8px;
  }

  /* CTA */
  .cta-content {
    text-align: center;
    max-width: 700px;
    padding: 0 24px;
  }
  .cta-title {
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 200;
    line-height: 1.1;
    margin-bottom: 24px;
  }
  .cta-desc {
    font-size: 16px;
    color: rgba(242,247,246,0.5);
    margin-bottom: 40px;
    line-height: 1.6;
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--accent), var(--electric));
    color: #02040a;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    border-radius: 999px;
    transition: all 0.3s;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 50px -15px rgba(39,215,201,0.4);
  }

  /* Section labels */
  .section-label {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(39,215,201,0.4);
    text-align: center;
    margin-bottom: 16px;
    width: 100%;
  }
  .section-heading {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 200;
    text-align: center;
    margin-bottom: 48px;
    width: 100%;
    padding: 0 24px;
  }

  /* Loading */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.8s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 50px; height: 50px;
    border: 2px solid rgba(39,215,201,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile */
  @media (max-width: 768px) {
    .work-card { width: 100%; }
    .caps-grid { gap: 12px; }
    .cap-item { width: 100px; }
    .data-panel { gap: 32px; }
    body { cursor: auto; }
    .cursor { display: none; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loading"><div class="loader-ring"></div></div>
<canvas id="three-canvas"></canvas>
<div class="cursor" id="cursor"></div>

<div class="hud-bar">
  <div class="hud-logo">AI LAB · 犀牛伯爵</div>
  <a href="../index.html#builds" class="hud-back">← 返回主页</a>

<div class="scroll-indicator" id="scrollIndicator"></div>

<div class="scroll-content">

  <!-- Works -->
  <section id="works" data-section="1">

  <!-- Capabilities -->
  <section id="capabilities" data-section="2">
    <div style="width:100%;">

  <section id="data" data-section="3">

  <section id="cta" data-section="4">
    <div class="cta-content">
      <h2 class="cta-title">准备好<br/>一起创作了吗？</h2>
      <p class="cta-desc">
        如果你也有一个想法正在寻找合适的执行者——<br/>
        或者只是想聊聊 AI 能做什么。
      </p>
      <a href="https://www.xiaohongshu.com/user/profile/60572004000000000101ce41" target="_blank" rel="noopener" class="cta-btn">
        来小红书聊聊
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </section>

</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ═══════════════════════════════════════════════════════════
// 数据
// ═══════════════════════════════════════════════════════════
const WORKS = [
  { tag: 'SITE', title: '犀牛伯爵官网', desc: '用 Agent 工作流驱动内容生产和个人品牌。纯静态站点，无框架依赖。', link: 'https://zjeep-arch.github.io/rhino-count-site/', linkLabel: '访问' },
  { tag: 'GAME', title: '鸭骗战争', desc: '扮演鹅腿阿姨，用鸭腿冒充鹅腿。荒诞答题小游戏，测试轻量游戏化表达。', link: '../games/duck-scare-war.html', linkLabel: '玩' },
  { tag: '3D', title: 'JARVIS 3D 工作室', desc: 'Iron Man 风格的 3D AI 工作室——方舟反应堆、全息屏幕、贾维斯 HUD。', link: '../ai-studio-3d.html', linkLabel: '进入' },
  { tag: 'WORKFLOW', title: 'AI Workflow Lab', desc: '把日常创作、资料整理、网页生成和自动化流程拆成可复用工作流。', link: 'https://zjeep-arch.github.io/rhino-count-site/', linkLabel: '查看' },
  { tag: 'VIDEO', title: '视频转字幕工具链', desc: 'yt-dlp + whisper.cpp + 自定义脚本，30 分钟视频 2 分钟转录为结构化笔记。', link: '#', linkLabel: '了解' },
  { tag: 'KNOWLEDGE', title: 'Obsidian 知识图谱', desc: 'Karpathy LLM-Wiki 方法论实践——44 节点、0 断链、0 孤立的知识网络。', link: '#', linkLabel: '了解' },
];

const CAPS = [
  { name: 'Agent', desc: '多步推理与工具调用', icon: 'agent' },
  { name: 'MCP', desc: '标准化工具接入协议', icon: 'mcp' },
  { name: 'RAG', desc: '检索增强生成', icon: 'rag' },
  { name: 'Prompt', desc: '提示词工程', icon: 'prompt' },
  { name: '3D Web', desc: 'Three.js 交互开发', icon: 'web' },
  { name: 'Workflow', desc: '自动化工作流设计', icon: 'flow' },
  { name: 'Vibe Coding', desc: '自然语言驱动编程', icon: 'vibe' },
  { name: 'Content', desc: 'AI 内容生产管线', icon: 'content' },
];

const METRICS = [
  { value: 47, suffix: '+', label: '知识节点' },
  { value: 6, suffix: '', label: '发布作品' },
  { value: 12, suffix: '/12', label: 'MCP 工具' },
  { value: 99, suffix: '%', label: '正常运行' },
];

// SVG icons
const ICONS = {
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>',
  mcp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  rag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  prompt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  flow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="6" height="6"/><rect x="16" y="3" width="6" height="6"/><rect x="9" y="15" width="6" height="6"/><path d="M5 9v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M12 15v-3"/></svg>',
  vibe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  content: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
};

// ═══════════════════════════════════════════════════════════
// 渲染 HTML 内容
// ═══════════════════════════════════════════════════════════
const worksGrid = document.getElementById('worksGrid');
WORKS.forEach((w, i) => {
  const card = document.createElement('div');
  card.className = 'work-card';
  card.style.transitionDelay = `${i * 80}ms`;
  card.innerHTML = `
    <span class="work-tag">${w.tag}</span>
    <h3 class="work-title">${w.title}</h3>
    <p class="work-desc">${w.desc}</p>
    <a class="work-link" href="${w.link}" ${w.link.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>
      ${w.linkLabel} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  `;
  worksGrid.appendChild(card);
});

const capsGrid = document.getElementById('capsGrid');
CAPS.forEach((c, i) => {
  const item = document.createElement('div');
  item.className = 'cap-item';
  item.style.transitionDelay = `${i * 60}ms`;
  item.innerHTML = `
    <div class="cap-icon">${ICONS[c.icon] || ''}</div>
    <div class="cap-name">${c.name}</div>
    <div class="cap-desc">${c.desc}</div>
  `;
  capsGrid.appendChild(item);
});

const dataPanel = document.getElementById('dataPanel');
METRICS.forEach((m, i) => {
  const item = document.createElement('div');
  item.className = 'data-item';
  item.style.transitionDelay = `${i * 100}ms`;
  item.innerHTML = `
    <div class="data-value" data-target="${m.value}">0${m.suffix}</div>
    <div class="data-label">${m.label}</div>
  `;
  dataPanel.appendChild(item);
});

// Scroll indicator dots
const scrollInd = document.getElementById('scrollIndicator');
for (let i = 0; i < 5; i++) {
  const dot = document.createElement('div');
  dot.className = 'scroll-dot' + (i === 0 ? ' active' : '');
  scrollInd.appendChild(dot);
}

// ═══════════════════════════════════════════════════════════
// Three.js 场景
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040a, 0.015);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Environment
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.5, 0.85);
composer.addPass(bloom);
const fxaa = new ShaderPass(FXAAShader);
fxaa.material.uniforms['resolution'].value.set(1/(window.innerWidth*renderer.getPixelRatio()), 1/(window.innerHeight*renderer.getPixelRatio()));
composer.addPass(fxaa);

// Lights
scene.add(new THREE.AmbientLight(0x1a2535, 0.3));
const key = new THREE.DirectionalLight(0x4a6580, 0.4);
key.position.set(5, 8, 5); scene.add(key);
const p1 = new THREE.PointLight(0x27D7C9, 4, 15, 1.5); p1.position.set(-4, 2, 4); scene.add(p1);
const p2 = new THREE.PointLight(0x8E7CFF, 3, 12, 1.5); p2.position.set(4, 1, 3); scene.add(p2);

// ═══════════════════════════════════════════════════════════
// 3D 主体 — 悬浮水晶体（低多边形犀牛抽象体）
// ═══════════════════════════════════════════════════════════

// 核心多面体 — 代表"创造力核心"
const crystalGroup = new THREE.Group();
scene.add(crystalGroup);

// 外壳 — 二十面体线框
const shellGeo = new THREE.IcosahedronGeometry(2.5, 1);
const shellMat = new THREE.MeshBasicMaterial({
  color: 0x27D7C9,
  wireframe: true,
  transparent: true,
  opacity: 0.15,
});
const shell = new THREE.Mesh(shellGeo, shellMat);
crystalGroup.add(shell);

// 内核 — 发光实体
const coreGeo = new THREE.IcosahedronGeometry(1.2, 0);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0x27D7C9,
  metalness: 0.3,
  roughness: 0.1,
  emissive: 0x27D7C9,
  emissiveIntensity: 0.5,
  transparent: true,
  opacity: 0.6,
  flatShading: true,
});
const core = new THREE.Mesh(coreGeo, coreMat);
crystalGroup.add(core);

// 中层 — 旋转环
for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.8 + i * 0.3, 0.008, 8, 64),
    new THREE.MeshBasicMaterial({
      color: [0x27D7C9, 0x8E7CFF, 0xFF7A59][i],
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );
  ring.rotation.x = Math.PI / 2 + (i * 0.3);
  ring.rotation.z = i * 0.4;
  ring.userData = { axis: i, speed: 0.1 + i * 0.05 };
  crystalGroup.add(ring);
}

// 轨道粒子 — 围绕核心
const orbitCount = 80;
const orbitGeo = new THREE.BufferGeometry();
const orbitPos = new Float32Array(orbitCount * 3);
const orbitCol = new Float32Array(orbitCount * 3);
const orbitData = [];
const cTeal = new THREE.Color(0x27D7C9);
const cPurple = new THREE.Color(0x8E7CFF);

for (let i = 0; i < orbitCount; i++) {
  const radius = 2.5 + Math.random() * 2;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  orbitData.push({ radius, theta, phi, speed: 0.0005 + Math.random() * 0.001 });
  const c = Math.random() > 0.5 ? cTeal : cPurple;
  orbitCol[i*3] = c.r; orbitCol[i*3+1] = c.g; orbitCol[i*3+2] = c.b;
}
orbitGeo.setAttribute('position', new THREE.BufferAttribute(orbitPos, 3));
orbitGeo.setAttribute('color', new THREE.BufferAttribute(orbitCol, 3));
const orbitPoints = new THREE.Points(orbitGeo, new THREE.PointsMaterial({
  size: 0.05, vertexColors: true, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
}));
crystalGroup.add(orbitPoints);

// 背景粒子
const bgCount = 200;
const bgGeo = new THREE.BufferGeometry();
const bgPos = new Float32Array(bgCount * 3);
const bgCol = new Float32Array(bgCount * 3);
for (let i = 0; i < bgCount; i++) {
  bgPos[i*3] = (Math.random() - 0.5) * 40;
  bgPos[i*3+1] = (Math.random() - 0.5) * 40;
  bgPos[i*3+2] = (Math.random() - 0.5) * 30 - 10;
  const c = Math.random() > 0.5 ? cTeal : cPurple;
  bgCol[i*3] = c.r; bgCol[i*3+1] = c.g; bgCol[i*3+2] = c.b;
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
bgGeo.setAttribute('color', new THREE.BufferAttribute(bgCol, 3));
const bgPoints = new THREE.Points(bgGeo, new THREE.PointsMaterial({
  size: 0.03, vertexColors: true, transparent: true, opacity: 0.3,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(bgPoints);

// ═══════════════════════════════════════════════════════════
// 交互 — 鼠标视差
// ═══════════════════════════════════════════════════════════
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('pointermove', (e) => {
  mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  // Custom cursor
  const cur = document.getElementById('cursor');
  if (cur) {
    cur.style.left = e.clientX + 'px';
    cur.style.top = e.clientY + 'px';
  }
}, { passive: true });

// Hover detection for cursor
document.querySelectorAll('a, .work-card, .cap-item').forEach(el => {
  el.addEventListener('pointerenter', () => document.getElementById('cursor')?.classList.add('hover'));
  el.addEventListener('pointerleave', () => document.getElementById('cursor')?.classList.remove('hover'));
});

// ═══════════════════════════════════════════════════════════
// 滚动 — 3D 场景随滚动变化
// ═══════════════════════════════════════════════════════════
let scrollProgress = 0;
const sections = document.querySelectorAll('section[data-section]');
const dots = document.querySelectorAll('.scroll-dot');

function updateScroll() {
  scrollProgress = window.scrollY / (document.body.scrollHeight - window.innerHeight);

  // 更新 3D 场景
  // 相机随滚动推进
  camera.position.z = 12 - scrollProgress * 6;
  camera.position.y = scrollProgress * 3;
  camera.lookAt(0, scrollProgress * 1.5, 0);

  // 水晶随滚动缩小 + 旋转加速
  const scale = 1 - scrollProgress * 0.4;
  crystalGroup.scale.setScalar(Math.max(0.3, scale));

  // 粒子扩散
  bgPoints.rotation.y = scrollProgress * Math.PI * 0.5;

  // 更新指示器
  const activeIdx = Math.min(4, Math.floor(scrollProgress * 5));
  dots.forEach((d, i) => d.classList.toggle('active', i === activeIdx));

  // 显示动画元素
  const viewportMid = window.scrollY + window.innerHeight * 0.6;
  document.querySelectorAll('.work-card').forEach(c => {
    c.classList.toggle('visible', c.offsetTop + c.parentElement.offsetTop < viewportMid);
  });
  document.querySelectorAll('.cap-item').forEach(c => {
    c.classList.toggle('visible', c.offsetTop + c.parentElement.offsetTop < viewportMid);
  });
  document.querySelectorAll('.data-item').forEach(c => {
    c.classList.toggle('visible', c.offsetTop + c.parentElement.offsetTop < viewportMid);
  });

  // 数字动画
  document.querySelectorAll('.data-value').forEach(el => {
    if (el.classList.contains('counted')) return;
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0) {
      el.classList.add('counted');
      const target = parseInt(el.dataset.target);
      const suffix = el.textContent.replace(/[\d.]/g, '');
      let current = 0;
      const step = Math.max(1, Math.ceil(target / 30));
      const timer = setInterval(() => {
        current += step;
        if (current >= target) { current = target; clearInterval(timer); }
        el.textContent = current + suffix;
      }, 30);
    }
  });
}
window.addEventListener('scroll', updateScroll, { passive: true });

// ═══════════════════════════════════════════════════════════
// 窗口缩放
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fxaa.material.uniforms['resolution'].value.set(
    1/(window.innerWidth*renderer.getPixelRatio()),
    1/(window.innerHeight*renderer.getPixelRatio())
  );
}, { passive: true });

// ═══════════════════════════════════════════════════════════
// 动画循环
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 鼠标平滑
  mouse.x += (mouse.tx - mouse.x) * 0.05;
  mouse.y += (mouse.ty - mouse.y) * 0.05;

  // 水晶旋转
  crystalGroup.rotation.y = t * 0.15 + mouse.x * 0.3;
  crystalGroup.rotation.x = mouse.y * 0.2;
  crystalGroup.position.y = Math.sin(t * 0.5) * 0.15;

  // 核心脉冲
  const pulse = 1 + Math.sin(t * 1.5) * 0.05;
  core.scale.setScalar(pulse);
  coreMat.emissiveIntensity = 0.4 + Math.sin(t * 1.5) * 0.2;

  // 外壳呼吸
  shellMat.opacity = 0.1 + Math.sin(t * 0.8) * 0.05;

  // 环旋转
  crystalGroup.children.forEach(child => {
    if (child.userData.axis !== undefined) {
      if (child.userData.axis === 0) child.rotation.z += child.userData.speed * 0.02;
      else if (child.userData.axis === 1) child.rotation.x += child.userData.speed * 0.015;
      else child.rotation.y += child.userData.speed * 0.025;
    }
  });

  // 轨道粒子
  const pos = orbitPoints.geometry.attributes.position.array;
  orbitData.forEach((d, i) => {
    d.theta += d.speed;
    pos[i*3] = d.radius * Math.sin(d.phi) * Math.cos(d.theta);
    pos[i*3+1] = d.radius * Math.cos(d.phi);
    pos[i*3+2] = d.radius * Math.sin(d.phi) * Math.sin(d.theta);
  });
  orbitPoints.geometry.attributes.position.needsUpdate = true;

  // 背景粒子缓慢漂移
  bgPoints.rotation.y += 0.0003;

  // 相机微视差
  camera.position.x += (mouse.x * 1.5 - camera.position.x) * 0.03;

  composer.render();
}

setTimeout(() => document.getElementById('loading').classList.add('hide'), 600);
updateScroll();
animate();
</script>
</body>
</html>
