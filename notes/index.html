<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>全部笔记 · 犀牛伯爵</title>
  <meta name="description" content="犀牛伯爵的全部笔记——关于模型、关于人、关于我们如何被这个时代重新塑形。" />
  <meta name="author" content="犀牛伯爵" />
  <meta name="robots" content="index,follow" />

  <style>
    :root {
      --bg: #F5EFE6; --bg-soft: #ECE3D2; --surface: #FBF7EE;
      --ink: #1C1410; --ink-soft: #3B2E24; --muted: #7A6B5B;
      --line: rgba(28,20,16,0.10); --line-2: rgba(28,20,16,0.22);
      --accent: #8B3A2E; --gold: #B8862F;
      --serif: "Playfair Display","Noto Serif SC","Songti SC",Georgia,serif;
      --sans: "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --maxw: 860px; --pad: clamp(20px,4vw,32px);
      --radius: 14px;
      --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:64px;
    }
    [data-theme="dark"] {
      --bg: #14100C; --bg-soft: #1A1510; --surface: #1F1813;
      --ink: #F1E8DA; --ink-soft: #DCCEB8; --muted: #9B8B77;
      --line: rgba(241,232,218,0.10); --line-2: rgba(241,232,218,0.22);
      --accent: #D4825F; --gold: #E8C77A;
    }
    *,*::before,*::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 17px; line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content:"";position:fixed;inset:0;
      background-image:radial-gradient(700px 400px at 10% 0%,rgba(184,134,47,0.06),transparent 60%);
      pointer-events:none;z-index:0;
    }
    .container { max-width: var(--maxw); margin-inline: auto; padding-inline: var(--pad); position: relative; z-index: 1; }

    /* Header */
    .archive-header {
      padding: var(--s-8) 0 var(--s-6);
      border-bottom: 1px solid var(--line);
      margin-bottom: var(--s-6);
    }
    .archive-header .back {
      display: inline-flex; align-items: center; gap: var(--s-2);
      font-size: 13px; color: var(--accent); font-weight: 500;
      margin-bottom: var(--s-5); text-decoration: none;
      transition: gap 0.2s ease;
    }
    .archive-header .back:hover { gap: var(--s-3); }
    .archive-header .label {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted); margin-bottom: var(--s-4);
    }
    .archive-header h1 {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(26px,4vw,40px); line-height: 1.2;
      margin: 0 0 var(--s-3); letter-spacing: 0.01em;
    }
    .archive-header .blurb {
      color: var(--ink-soft); font-size: 15px; margin: 0;
    }
    .archive-header .count {
      display: inline-block; margin-left: var(--s-2);
      font-size: 13px; color: var(--muted);
    }

    /* Note list */
    .note-list {
      display: flex; flex-direction: column;
      gap: 0;
      padding-bottom: var(--s-8);
    }
    .note-item {
      display: flex; align-items: flex-start; gap: var(--s-5);
      padding: var(--s-5) 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      transition: padding-left 0.3s ease, border-color 0.3s ease;
      position: relative;
    }
    .note-item:hover {
      padding-left: var(--s-3);
      border-color: var(--line-2);
    }
    .note-item:hover .note-item-title {
      color: var(--accent);
    }
    .note-item-num {
      flex-shrink: 0;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); font-weight: 600;
      min-width: 48px; padding-top: 4px;
    }
    .note-item-main {
      flex: 1; min-width: 0;
    }
    .note-item-cat {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
      margin-bottom: var(--s-1);
    }
    .note-item-title {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(18px,2vw,22px); line-height: 1.35;
      margin: 0 0 var(--s-2);
      color: var(--ink);
      transition: color 0.3s ease;
    }
    .note-item-excerpt {
      font-size: 14px; color: var(--ink-soft); line-height: 1.65;
      margin: 0;
    }
    .note-item-arrow {
      flex-shrink: 0;
      color: var(--muted); font-size: 18px;
      transition: transform 0.3s ease, color 0.3s ease;
      padding-top: 4px;
    }
    .note-item:hover .note-item-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* Footer */
    .archive-footer {
      border-top: 1px solid var(--line);
      padding: var(--s-6) 0 var(--s-8);
      text-align: center;
    }
    .archive-footer .back-link {
      display: inline-flex; align-items: center; gap: var(--s-2);
      font-size: 13px; color: var(--accent); font-weight: 500;
      text-decoration: none;
      transition: gap 0.2s ease;
    }
    .archive-footer .back-link:hover { gap: var(--s-3); }

    .site-footer {
      border-top: 1px solid var(--line);
      padding: var(--s-5) 0;
      text-align: center;
      font-size: 12px; color: var(--muted);
    }

    @media (max-width: 520px) {
      body { font-size: 16px; }
      .note-item { gap: var(--s-3); }
      .note-item-num { min-width: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation:none!important; transition:none!important; }
    }
  </style>

<body>
  <div class="container">
    <header class="archive-header">
      <a class="back" href="../">&larr; 回到首页</a>
      <div class="label">JOURNAL · 全部笔记</div>
      <h1>在喧嚣里，慢慢记。</h1>
      <p class="blurb">每一篇笔记都是一次小型田野调查：关于模型、关于人、关于我们如何被这个时代重新塑形。<span class="count" id="note-count"></span></p>
    </header>
    <div class="note-list" id="note-list"></div>
    <footer class="archive-footer">
      <a class="back-link" href="../">&larr; 回到犀牛伯爵首页</a>
    </footer>
  </div>

  <footer class="site-footer">
    <div class="container">&copy; 2026 犀牛伯爵</div>
  </footer>

  <script>
    (function() {
      var root = document.documentElement;
      var saved = localStorage.getItem('rhino-theme');
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved) { root.setAttribute('data-theme', saved); }
      else if (sysDark) { root.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <script src="../data.js"></script>
  <script>
    (function() {
      var notes = window.SITE_DATA ? (window.SITE_DATA.journal || {}).notes : [];
      var list = document.getElementById('note-list');
      var countEl = document.getElementById('note-count');

      if (countEl) countEl.textContent = '共 ' + notes.length + ' 篇';

      list.innerHTML = notes.map(function(n) {
        return '<a class="note-item" href="' + n.href + '">' +
          '<span class="note-item-num">' + (n.num || '') + '</span>' +
          '<div class="note-item-main">' +
            '<div class="note-item-cat">' + (n.cat || '') + '</div>' +
            '<h3 class="note-item-title">' + (n.title || '') + '</h3>' +
            '<p class="note-item-excerpt">' + (n.excerpt || '') + '</p>' +
          '</div>' +
          '<span class="note-item-arrow" aria-hidden="true">&rarr;</span>' +
        '</a>';
      }).join('');
    })();
  </script>
</body>
</html>
