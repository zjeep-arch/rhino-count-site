<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <title>犀牛白板 · 录屏创作器</title>
  <meta name="description" content="白板、幻灯片、提词器、摄像头和录屏一体化创作工具。">
  <link rel="stylesheet" href="whiteboard-studio.css?v=20260713-8">
</head>
<body>
<main class="studio" id="studio">
  <button class="corner-btn" id="homeBtn" title="返回创作矩阵" aria-label="返回创作矩阵">☰</button>

  <nav class="toolbar floating" id="toolbar" aria-label="白板工具栏">
    <button class="tool" id="lockBtn" title="绘制后保持工具（Q）" aria-label="锁定工具">♙</button><i></i>
    <button class="tool" data-tool="hand" title="抓手（H）" aria-label="抓手">♨</button>
    <button class="tool active" data-tool="select" title="选择（1）" aria-label="选择">➤<small>1</small></button>
    <button class="tool" data-tool="rect" title="矩形（2）" aria-label="矩形">□<small>2</small></button>
    <button class="tool" data-tool="diamond" title="菱形（3）" aria-label="菱形">◇<small>3</small></button>
    <button class="tool" data-tool="circle" title="椭圆（4）" aria-label="椭圆">○<small>4</small></button>
    <button class="tool" data-tool="arrow" title="箭头（5）" aria-label="箭头">→<small>5</small></button>
    <button class="tool" data-tool="line" title="直线（6）" aria-label="直线">−<small>6</small></button>
    <button class="tool" data-tool="pen" title="自由书写（7）" aria-label="自由书写">⌁<small>7</small></button>
    <button class="tool" data-tool="text" title="文字（8）" aria-label="文字">A<small>8</small></button>
    <button class="tool" id="imageTool" title="插入图片（9）" aria-label="插入图片">▧<small>9</small></button>
    <button class="tool" data-tool="eraser" title="橡皮（0）" aria-label="橡皮">◇<small>0</small></button><i></i>
    <button class="tool" id="moreBtn" title="更多工具" aria-label="更多工具">♙</button>
  </nav>

  <div class="record-controls floating">
    <button class="control-icon" id="settingsBtn" title="录制设置" aria-label="录制设置">⚙</button>
    <button class="control-icon" id="scriptBtn" title="提词器" aria-label="提词器">▤</button>
    <button class="record-btn" id="recordBtn"><b></b>录制</button>
  </div>

  <section class="workspace" id="workspace" aria-label="幻灯片工作区"><div class="slide-row" id="slideRow"></div></section>
  <video class="camera" id="camera" autoplay muted playsinline></video>

  <aside class="slides floating" id="slidesPanel"><header>▢ 幻灯片</header><div id="slideThumbs"></div><hr><button class="add-slide" id="addSlide" title="添加幻灯片">＋</button></aside>
  <div class="zoom floating"><button id="zoomOut">−</button><span id="zoomValue">20%</span><button id="zoomIn">＋</button></div>
  <div class="history floating"><button id="undo" title="撤销">↶</button><button id="redo" title="重做">↷</button></div>
  <button class="help-btn" id="helpBtn" title="帮助">?</button>

  <div class="popover floating" id="moreMenu">
    <button data-insert="image"><span>▧</span><b>插入图片</b><small>PNG、JPG、WebP</small></button>
    <button data-insert="video"><span>▶</span><b>插入视频</b><small>本地 MP4 / WebM</small></button>
    <button data-insert="web"><span>◎</span><b>嵌入网页</b><small>输入公开网址</small></button>
    <button data-insert="template"><span>✦</span><b>视觉模板</b><small>标题、课程、要点</small></button>
    <button data-insert="sticky"><span>▰</span><b>灵感便签</b><small>插入可拖动便签卡</small></button>
    <button data-insert="grid"><span>⌗</span><b>网格画布</b><small>点阵、方格、横线纸</small></button>
    <button data-insert="focus"><span>◉</span><b>演示聚光灯</b><small>录制时突出鼠标区域</small></button>
  </div>

  <aside class="style-panel floating" id="stylePanel">
    <header><b id="styleTitle">元素样式</b><button id="closeStyle">×</button></header>
    <section><label>描边</label><div class="choice-row colors"><button data-stroke="#202124" style="--c:#202124"></button><button data-stroke="#e03131" style="--c:#e03131"></button><button data-stroke="#2f9e44" style="--c:#2f9e44"></button><button data-stroke="#1971c2" style="--c:#1971c2"></button><button data-stroke="#f08c00" style="--c:#f08c00"></button><input id="customStroke" type="color" value="#202124"></div></section>
    <section id="fillSection"><label>背景</label><div class="choice-row colors"><button data-fill="transparent" class="checker"></button><button data-fill="#ffc9c9" style="--c:#ffc9c9"></button><button data-fill="#b2f2bb" style="--c:#b2f2bb"></button><button data-fill="#a5d8ff" style="--c:#a5d8ff"></button><button data-fill="#ffec99" style="--c:#ffec99"></button></div></section>
    <section><label>描边宽度</label><div class="segmented"><button data-width="2">细</button><button data-width="4" class="active">中</button><button data-width="7">粗</button></div></section>
    <section><label>边框样式</label><div class="segmented"><button data-dash="solid" class="active">——</button><button data-dash="dashed">- - -</button><button data-dash="dotted">····</button></div></section>
    <section><label>线条风格</label><div class="segmented"><button data-rough="0">精准</button><button data-rough="1" class="active">自然</button><button data-rough="2">手绘</button></div></section>
    <section id="textOptions"><label>字体</label><div class="segmented"><button data-font="hand" class="active">手写</button><button data-font="sans">现代</button><button data-font="serif">衬线</button></div><label>字体大小</label><div class="segmented"><button data-font-size="20">S</button><button data-font-size="28" class="active">M</button><button data-font-size="38">L</button><button data-font-size="52">XL</button></div><label>文本对齐</label><div class="segmented"><button data-align="left" class="active">左</button><button data-align="center">中</button><button data-align="right">右</button></div></section>
    <section><label>透明度 <output id="opacityOut">100</output></label><input id="opacity" type="range" min="15" max="100" value="100"></section>
    <section><label>图层</label><div class="segmented"><button data-layer="back">置底</button><button data-layer="down">下移</button><button data-layer="up">上移</button><button data-layer="front">置顶</button></div></section>
  </aside>

  <aside class="panel settings-panel" id="settingsPanel"><button class="close" data-close="settingsPanel">×</button><h2>录制设置</h2><div class="settings-layout"><div class="settings-preview"><label>实时预览</label><div id="recordPreview"><div class="preview-sheet"><i></i><i></i><i></i><em></em></div></div></div><div class="settings-fields"><h3>画面比例</h3><div class="ratio-grid"><button class="ratio active" data-ratio="16/9">16:9<small>YouTube</small></button><button class="ratio" data-ratio="4/3">4:3<small>经典</small></button><button class="ratio" data-ratio="3/4">3:4<small>小红书</small></button><button class="ratio" data-ratio="9/16">9:16<small>抖音</small></button><button class="ratio" data-ratio="1/1">1:1<small>正方形</small></button><button class="ratio" data-ratio="custom">Custom<small>自定义</small></button></div><h3>氛围壁纸</h3><div class="wallpaper-filters"><button class="active">全部</button><button>柔和</button><button>鲜艳</button><button>深色</button><button>自然</button></div><button class="random-wallpaper" id="randomWallpaper">✦ 随机选择壁纸</button><div class="wallpapers"><button data-wallpaper="linear-gradient(135deg,#ffd6e7,#d7ffd2,#d8d7ff)" style="--w:linear-gradient(135deg,#ffd6e7,#d7ffd2,#d8d7ff)"></button><button data-wallpaper="linear-gradient(135deg,#f2ddff,#d9f6ee,#fff3c8)" style="--w:linear-gradient(135deg,#f2ddff,#d9f6ee,#fff3c8)"></button><button data-wallpaper="radial-gradient(circle at 80% 10%,#57f2c6,#172244 58%,#090b15)" style="--w:radial-gradient(circle at 80% 10%,#57f2c6,#172244 58%,#090b15)"></button><button data-wallpaper="linear-gradient(135deg,#ff2e88,#ffb04a,#7357ff)" style="--w:linear-gradient(135deg,#ff2e88,#ffb04a,#7357ff)"></button><button data-wallpaper="linear-gradient(135deg,#163d2a,#8cbf8a,#e5d5ad)" style="--w:linear-gradient(135deg,#163d2a,#8cbf8a,#e5d5ad)"></button></div><div class="setting-range"><label>圆角半径 <output id="radiusOut">10px</output></label><input id="canvasRadius" type="range" min="0" max="36" value="10"></div><h3>摄像头</h3><div class="toggle-row"><button class="toggle active" id="cameraToggle"><i></i></button><span>录制时显示摄像头画面</span></div><div class="setting-range"><label>大小 <output id="cameraSizeOut">180px</output></label><input id="cameraSize" type="range" min="90" max="300" value="180"></div><div class="camera-shape"><button data-camera-shape="50%" class="active">○ 圆形</button><button data-camera-shape="18px">□ 方形</button></div><button class="dark-btn" id="cameraBtn">开启摄像头</button><div class="setting-range"><label>画布边距 <output id="paddingOut">80px</output></label><input id="canvasPadding" type="range" min="20" max="160" value="80"></div><h3>演示光标</h3><div class="toggle-row"><button class="toggle" id="cursorToggle"><i></i></button><span>录制时显示光标高亮</span></div><div class="cursor-colors"><button data-cursor="#ff4d4f" style="--c:#ff4d4f"></button><button data-cursor="#ff8c1a" style="--c:#ff8c1a"></button><button data-cursor="#f5bd00" style="--c:#f5bd00"></button><button data-cursor="#25c768" style="--c:#25c768"></button><button data-cursor="#4385f5" style="--c:#4385f5"></button><button data-cursor="#a54df4" style="--c:#a54df4"></button></div></div></div></aside>

  <aside class="panel tele-panel" id="scriptPanel"><button class="close" data-close="scriptPanel">×</button><h2>提词器</h2><p>讲稿仅保存在当前浏览器中。播放后会在屏幕底部平滑滚动。</p><textarea id="script" placeholder="在这里输入讲稿……"></textarea><div class="range-row"><label>字号 <output id="fontOut">24</output></label><input id="fontSize" type="range" min="16" max="42" value="24"></div><div class="range-row"><label>速度 <output id="speedOut">3</output></label><input id="teleSpeed" type="range" min="1" max="8" value="3"></div><div class="panel-actions"><button class="dark-btn" id="startTele">▶ 开始提词</button><button class="soft-btn" id="hideTele">隐藏</button></div></aside>

  <aside class="panel template-panel" id="templatePanel"><button class="close" data-close="templatePanel">×</button><h2>视觉模板</h2><p>选择一个模板应用到当前幻灯片，之后仍可继续绘画和添加素材。</p><div class="template-grid"><button data-template="title"><span class="template-preview title"></span><b>极简标题</b></button><button data-template="lesson"><span class="template-preview lesson"></span><b>课程讲解</b></button><button data-template="points"><span class="template-preview points"></span><b>三点清单</b></button><button data-template="dark"><span class="template-preview dark"></span><b>深色发布会</b></button></div></aside>

  <div class="teleprompter" id="teleprompter"><div class="tele-text" id="teleText"></div><button id="pauseTele" title="暂停提词">Ⅱ</button><button id="closeTele" title="关闭提词">×</button></div>
  <div class="cursor-spot" id="cursorSpot"></div>
  <input type="file" id="imageInput" accept="image/*" hidden><input type="file" id="videoInput" accept="video/*" hidden>

  <div class="welcome" id="welcome"><div class="welcome-card"><div class="welcome-logo">▤<em>●</em></div><h1>欢迎使用犀牛白板</h1><p>录制精美的白板视频，你的面部画面会出现在角落。非常适合教程、讲解和异步沟通。</p><ul><li>🎨 在无限工作区自由绘画</li><li>📹 插入图片、视频与网页</li><li>📜 内置可滚动提词器</li><li>⏺ 准备好就点击录制</li></ul><button id="welcomeGo">了解了，开始吧</button><small>按 Esc 或点击背景关闭</small></div></div>
</main>
<script src="whiteboard-studio.js?v=20260713-8"></script>
</body>
</html>
