<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>犀牛白板 · 录屏创作器</title>
  <meta name="description" content="在浏览器里画白板、看提词器并录制讲解视频。">
  <style>
    :root{--ink:#171713;--muted:#77756e;--paper:#f7f6f2;--red:#d94b45;--line:#dedbd2;--shadow:0 18px 50px rgba(27,25,18,.14)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{color:inherit}
    .app{height:100%;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(18px);z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.mark{width:27px;height:27px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center}.mark:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}.actions,.toolbox,.slides{display:flex;align-items:center;gap:8px}.btn,.tool{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03)}.btn:hover,.tool:hover{border-color:#aaa79f}.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.btn.recording{animation:pulse 1s infinite}.icon{padding:9px 11px}.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 25%,#fff 0,#f6f4ef 60%,#eeebe4 100%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.toolbox{position:absolute;left:18px;top:18px;padding:7px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);z-index:5}.tool{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px}.tool.active{background:var(--ink);color:#fff;border-color:var(--ink)}.color{width:32px;height:32px;padding:0;border:4px solid #fff;border-radius:50%;background:#171713;box-shadow:0 0 0 1px var(--line);cursor:pointer}.slides{position:absolute;left:18px;bottom:18px;z-index:5;padding:7px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.slide{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.slide.active{border:2px solid var(--red)}
    .camera{position:absolute;right:22px;bottom:22px;width:180px;aspect-ratio:1;border-radius:50%;object-fit:cover;background:#262626;border:5px solid #fff;box-shadow:var(--shadow);z-index:4;display:none}.camera.show{display:block}.panel{position:absolute;right:18px;top:18px;width:min(360px,calc(100% - 36px));max-height:calc(100% - 36px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;z-index:8;display:none}.panel.open{display:block}.panel h2{font:700 24px Georgia,serif;margin:0 0 8px}.panel p{color:var(--muted);font-size:13px}.panel textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;line-height:1.75}.tele{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,80%);padding:16px 22px;border-radius:14px;background:rgba(20,20,18,.88);color:#fff;font-size:21px;text-align:center;z-index:6;display:none;backdrop-filter:blur(12px)}.tele.show{display:block}.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#aaa69c;text-align:center}.hint b{display:block;color:#656159;font-size:20px;margin-bottom:5px}@keyframes pulse{50%{opacity:.62}}
    @media(max-width:720px){.brand span{display:none}.top{padding:8px}.btn{padding:8px 10px}.hide-sm{display:none}.toolbox{left:8px;right:8px;top:8px;overflow-x:auto}.slides{left:8px;bottom:8px}.camera{width:105px;right:10px;bottom:10px}.tele{bottom:58px;font-size:16px}.app{grid-template-rows:56px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><a class="brand" href="index.html#builds" aria-label="返回创作矩阵"><i class="mark"></i><span>犀牛白板</span></a><div class="actions"><button class="btn hide-sm" id="cameraBtn">开启摄像头</button><button class="btn" id="scriptBtn">提词器</button><button class="btn primary" id="recordBtn">● 录制</button></div></header>
  <section class="stage" id="stage">
    <canvas id="board"></canvas><div class="hint" id="hint"><div><b>把想法画出来</b>选择画笔、形状或文字开始创作</div></div>
    <div class="toolbox" aria-label="白板工具">
      <button class="tool active" data-tool="pen" title="画笔">✎</button><button class="tool" data-tool="line" title="直线">╱</button><button class="tool" data-tool="rect" title="矩形">□</button><button class="tool" data-tool="circle" title="圆形">○</button><button class="tool" data-tool="text" title="文字">T</button><input class="color" id="color" type="color" value="#171713" title="颜色"><button class="tool" id="undo" title="撤销">↶</button><button class="tool" id="redo" title="重做">↷</button><button class="tool" id="clear" title="清空">⌫</button>
    </div>
    <div class="slides" id="slides"><button class="slide active" data-index="0">1</button><button class="tool" id="addSlide" title="新增幻灯片">＋</button></div>
    <video id="camera" class="camera" autoplay muted playsinline></video><div class="tele" id="tele"></div>
    <aside class="panel" id="scriptPanel"><button class="btn icon" id="closePanel" style="float:right">×</button><h2>提词器</h2><p>输入讲稿，开启后会固定显示在画布底部。录制屏幕时也会被捕捉。</p><textarea id="script" placeholder="在这里输入你的讲稿……"></textarea><p><button class="btn primary" id="showScript">显示提词</button> <button class="btn" id="hideScript">隐藏</button></p></aside>
  </section>
</main>
<script>
(()=>{const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');let tool='pen',color='#171713',drawing=false,start=null,snapshot=null,slideIndex=0,slides=[{image:null,undo:[],redo:[]}],cameraStream=null,recorder=null,chunks=[];
const fit=()=>{const old=canvas.toDataURL();canvas.width=stage.clientWidth*devicePixelRatio;canvas.height=stage.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineJoin='round';const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight);im.src=old};fit();addEventListener('resize',fit);
const state=()=>canvas.toDataURL(), push=()=>{slides[slideIndex].undo.push(state());slides[slideIndex].redo=[];document.querySelector('#hint').style.display='none'}, restore=url=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!url)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight);im.src=url};
const pos=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}};
const down=e=>{e.preventDefault();start=pos(e);snapshot=state();if(tool==='text'){const t=prompt('输入文字');if(t){push();ctx.fillStyle=color;ctx.font='28px Georgia,serif';ctx.fillText(t,start.x,start.y)}return}drawing=true;if(tool==='pen'){push();ctx.beginPath();ctx.moveTo(start.x,start.y)}};
const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=3;if(tool==='pen'){ctx.lineTo(p.x,p.y);ctx.stroke()}else{restore(snapshot);setTimeout(()=>{ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();if(tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}if(tool==='rect')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);if(tool==='circle'){const rx=(p.x-start.x)/2,ry=(p.y-start.y)/2;ctx.ellipse(start.x+rx,start.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2)}ctx.stroke()},0)}};
const up=()=>{if(drawing&&tool!=='pen'){slides[slideIndex].undo.push(snapshot);slides[slideIndex].redo=[];document.querySelector('#hint').style.display='none'}drawing=false};canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);addEventListener('pointerup',up);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#color').oninput=e=>color=e.target.value;
document.querySelector('#undo').onclick=()=>{const s=slides[slideIndex];if(!s.undo.length)return;s.redo.push(state());restore(s.undo.pop())};document.querySelector('#redo').onclick=()=>{const s=slides[slideIndex];if(!s.redo.length)return;s.undo.push(state());restore(s.redo.pop())};document.querySelector('#clear').onclick=()=>{push();ctx.clearRect(0,0,canvas.width,canvas.height);document.querySelector('#hint').style.display='grid'};
const renderSlides=()=>{document.querySelectorAll('.slide').forEach(b=>b.remove());slides.forEach((_,i)=>{const b=document.createElement('button');b.className='slide'+(i===slideIndex?' active':'');b.textContent=i+1;b.onclick=()=>switchSlide(i);document.querySelector('#slides').insertBefore(b,document.querySelector('#addSlide'))})};const switchSlide=i=>{slides[slideIndex].image=state();slideIndex=i;restore(slides[i].image);renderSlides()};document.querySelector('#addSlide').onclick=()=>{slides[slideIndex].image=state();slides.push({image:null,undo:[],redo:[]});switchSlide(slides.length-1)};
const cam=document.querySelector('#camera');document.querySelector('#cameraBtn').onclick=async()=>{if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;cam.classList.remove('show');return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});cam.srcObject=cameraStream;cam.classList.add('show');document.querySelector('#cameraBtn').textContent='关闭摄像头'}catch(e){alert('无法访问摄像头，请检查浏览器权限。')}};
const panel=document.querySelector('#scriptPanel'),tele=document.querySelector('#tele');document.querySelector('#scriptBtn').onclick=()=>panel.classList.add('open');document.querySelector('#closePanel').onclick=()=>panel.classList.remove('open');document.querySelector('#showScript').onclick=()=>{tele.textContent=document.querySelector('#script').value||'请先输入讲稿';tele.classList.add('show');panel.classList.remove('open')};document.querySelector('#hideScript').onclick=()=>tele.classList.remove('show');
document.querySelector('#recordBtn').onclick=async function(){if(recorder&&recorder.state==='recording'){recorder.stop();this.textContent='● 录制';this.classList.remove('recording');return}try{const screen=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}),mic=await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>null),tracks=[...screen.getVideoTracks(),...screen.getAudioTracks(),...(mic?mic.getAudioTracks():[])];recorder=new MediaRecorder(new MediaStream(tracks),{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm'});chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{tracks.forEach(t=>t.stop());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='rhino-whiteboard-'+new Date().toISOString().slice(0,19).replaceAll(':','-')+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};screen.getVideoTracks()[0].onended=()=>recorder.state==='recording'&&recorder.stop();recorder.start(1000);this.textContent='■ 停止';this.classList.add('recording')}catch(e){alert('录制未开始。请选择要分享的屏幕，并允许麦克风权限。')}};
})();
</script>
</body></html>
