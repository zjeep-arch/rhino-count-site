<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>犀牛白板 · 录屏创作器</title>
  <meta name="description" content="在浏览器里画白板、看提词器并录制讲解视频。">
  <style>
    :root{--ink:#1b1b1f;--muted:#8b8b91;--ui:#fff;--wash:#f8f8f7;--purple:#6965db;--red:#d85050;--line:#e7e7e4;--shadow:0 10px 32px rgba(22,22,26,.12)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--wash);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC",sans-serif}button,input,textarea{font:inherit}button{color:inherit}.app,.stage{height:100%;position:relative}.stage{overflow:hidden;background:#fafaf9}
    .floating{position:absolute;z-index:12;background:rgba(255,255,255,.94);border:1px solid rgba(22,22,26,.07);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.menu{left:16px;top:16px;width:36px;height:36px;border:0;border-radius:8px;background:#eeeef2;cursor:pointer;font-size:17px}.record-controls{right:16px;top:20px;border-radius:15px;padding:7px;display:flex;align-items:center;gap:3px}.top-icon{width:39px;height:39px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:18px}.top-icon:hover{background:#f2f2f4}.record{height:40px;padding:0 18px;border:0;border-radius:10px;color:#fff;background:var(--red);box-shadow:0 3px 9px rgba(216,80,80,.3);cursor:pointer;font-weight:650}.record.recording{animation:pulse 1s infinite}.toolbox{position:absolute;z-index:11;left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:center;padding:5px 7px;border-radius:11px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 13px rgba(20,20,24,.09)}.tool{position:relative;width:38px;height:38px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:17px}.tool:hover{background:#f2f1f8}.tool.active{background:#e9e7ff;color:#514cc6}.tool small{position:absolute;right:3px;bottom:1px;font-size:8px;color:#a7a5ad}.divider{width:1px;height:24px;background:#ecebed;margin:0 4px}.color{width:26px;height:26px;border:3px solid #fff;border-radius:7px;padding:0;box-shadow:0 0 0 1px #d7d6da;cursor:pointer}
    .slide-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-47%);width:min(54vw,720px);aspect-ratio:16/9;border:2px solid #bdbdbb;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}.slide-label{position:absolute;left:calc(50% - min(27vw,360px));top:calc(50% - min(15.2vw,202px) - 26px);font-size:13px;color:#8c8b90}canvas{width:100%;height:100%;touch-action:none;cursor:crosshair}.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#bbb9be;text-align:center}.hint b{display:block;color:#77757c;font-size:17px;margin-bottom:4px}
    .slides{right:17px;top:50%;transform:translateY(-35%);width:72px;padding:12px 9px 9px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:9px}.slides-title{font-size:12px;color:#76747b;white-space:nowrap}.slide{width:38px;height:38px;border:1px solid #dedde1;background:#fff;border-radius:10px;cursor:pointer}.slide.active{border:2px solid var(--purple);background:#f3f2ff}.add-slide{width:42px;height:42px;border:1px dashed #c9c7cc;border-radius:10px;background:#fff;color:#aaa8ae;font-size:25px;cursor:pointer}.camera{position:absolute;left:20px;top:100px;width:180px;aspect-ratio:1;border-radius:50%;object-fit:cover;background:#252528;box-shadow:0 8px 25px rgba(0,0,0,.15);z-index:8;display:none}.camera.show{display:block}.zoom{left:16px;bottom:16px;border-radius:9px;padding:4px;display:flex;align-items:center}.zoom button{width:34px;height:32px;border:0;background:transparent;border-radius:7px;cursor:pointer}.zoom button:hover{background:#f1f1f3}.zoom span{min-width:48px;text-align:center;font-size:12px}.history{left:160px;bottom:16px;border-radius:9px;padding:4px;display:flex}.help{right:16px;bottom:16px;width:36px;height:36px;border:0;border-radius:8px;background:#eeeef2;cursor:pointer}
    .panel{position:absolute;right:18px;top:88px;width:360px;max-height:calc(100% - 115px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;z-index:20;display:none}.panel.open{display:block}.panel h2{font:700 22px Georgia,"Songti SC",serif;margin:0 0 8px}.panel p{color:#7e7d83;font-size:13px}.panel textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:13px;line-height:1.75}.panel-close{float:right;width:32px;height:32px;border:0;border-radius:8px;background:#f3f3f3;cursor:pointer}.panel-actions{display:flex;gap:8px}.ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.ratio{padding:10px 3px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:12px}.ratio.active{border-color:var(--purple);background:#f2f1ff;color:#504bc3}.primary,.secondary{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:#1d1d20;color:#fff}.secondary{background:#f0eff1}.tele{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,75%);padding:14px 22px;border-radius:12px;background:rgba(24,24,27,.86);color:#fff;font-size:19px;text-align:center;z-index:15;display:none;backdrop-filter:blur(12px)}.tele.show{display:block}
    .welcome{position:fixed;inset:0;z-index:50;background:rgba(18,18,18,.72);display:grid;place-items:center}.welcome.hide{display:none}.welcome-card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:18px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.3)}.welcome-logo{width:48px;height:48px;margin:0 auto 20px;border:2px solid #222;border-radius:12px;display:grid;place-items:center;font-size:23px}.welcome h1{text-align:center;font:700 27px Georgia,"Songti SC",serif;margin:0 0 12px}.welcome .lead{text-align:center;color:#77747a;line-height:1.7}.features{display:grid;gap:14px;margin:27px 0}.feature{display:flex;gap:13px;align-items:center}.feature i{font-style:normal;width:28px;text-align:center}.welcome-go{width:100%;padding:13px;border:0;border-radius:10px;background:#1c1c1e;color:#fff;font-weight:700;cursor:pointer}.welcome-note{text-align:center;color:#aaa8ad;font-size:12px;margin:14px 0 0}@keyframes pulse{50%{opacity:.68}}
    @media(max-width:760px){.toolbox{left:8px;right:8px;transform:none;overflow-x:auto}.tool{min-width:34px}.record-controls{top:auto;bottom:14px;right:14px}.record-controls .top-icon{display:none}.slide-frame{width:88vw}.slide-label{display:none}.slides{right:8px;top:auto;bottom:76px;transform:none;width:auto;flex-direction:row}.slides-title{display:none}.camera{width:100px;left:10px;top:72px}.zoom,.history,.help{display:none}.tele{bottom:72px;width:90%;font-size:15px}.welcome-card{padding:24px}}
  </style>
</head>
<body>
<main class="app"><section class="stage" id="stage">
  <button class="menu" onclick="location.href='index.html#builds'" title="返回创作矩阵">☰</button>
  <div class="toolbox" aria-label="白板工具"><button class="tool" data-tool="select" title="选择">➤<small>1</small></button><button class="tool active" data-tool="pen" title="自由书写">⌁<small>7</small></button><button class="tool" data-tool="line" title="直线">╱<small>6</small></button><button class="tool" data-tool="rect" title="矩形">□<small>2</small></button><button class="tool" data-tool="circle" title="椭圆">○<small>4</small></button><button class="tool" data-tool="text" title="文字">A<small>8</small></button><div class="divider"></div><input class="color" id="color" type="color" value="#1b1b1f" title="颜色"><button class="tool" id="clear" title="橡皮">♢</button></div>
  <div class="record-controls floating"><button class="top-icon" id="settingsBtn" title="录制设置">⚙</button><button class="top-icon" id="scriptBtn" title="提词器">▧</button><button class="record" id="recordBtn">●&nbsp; 录制</button></div>
  <div class="slide-label">Slide 1</div><div class="slide-frame"><canvas id="board"></canvas><div class="hint" id="hint"><div><b>Slide 1</b>在画布上开始你的讲解</div></div></div>
  <video id="camera" class="camera" autoplay muted playsinline></video><div class="tele" id="tele"></div>
  <div class="slides floating" id="slides"><div class="slides-title">▢ 幻灯片</div><button class="slide active" data-index="0">1</button><button class="add-slide" id="addSlide" title="新增幻灯片">＋</button></div>
  <div class="zoom floating"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button></div><div class="history floating"><button class="tool" id="undo" title="撤销">↶</button><button class="tool" id="redo" title="重做">↷</button></div><button class="help" title="帮助" id="helpBtn">?</button>
  <aside class="panel" id="scriptPanel"><button class="panel-close" id="closePanel">×</button><h2>提词器</h2><p>输入讲稿，显示后会固定在画布底部，帮助你自然讲述。</p><textarea id="script" placeholder="在这里输入你的讲稿……"></textarea><div class="panel-actions"><button class="primary" id="showScript">显示提词</button><button class="secondary" id="hideScript">隐藏</button></div></aside>
  <aside class="panel" id="settingsPanel"><button class="panel-close" id="closeSettings">×</button><h2>录制设置</h2><p>选择画面比例与摄像头显示方式。</p><div class="ratio-grid"><button class="ratio active" data-ratio="16/9">16:9<br>YouTube</button><button class="ratio" data-ratio="4/3">4:3<br>经典</button><button class="ratio" data-ratio="3/4">3:4<br>小红书</button><button class="ratio" data-ratio="9/16">9:16<br>抖音</button><button class="ratio" data-ratio="1/1">1:1<br>正方形</button></div><button class="primary" id="cameraBtn">开启摄像头</button></aside>
</section></main>
<div class="welcome" id="welcome"><div class="welcome-card"><div class="welcome-logo">▤<i style="color:#d85050">●</i></div><h1>欢迎使用犀牛白板</h1><p class="lead">录制精美的白板视频，你的面部画面会出现在角落。非常适合教程、讲解和异步沟通。</p><div class="features"><div class="feature"><i>🎨</i>在白板上自由绘画</div><div class="feature"><i>📹</i>你的摄像头会出现在角落</div><div class="feature"><i>📜</i>内置提词器，方便看稿</div><div class="feature"><i>⏺</i>准备好就点击录制</div></div><button class="welcome-go" id="welcomeGo">了解了，开始吧</button><p class="welcome-note">按 Esc 或点击背景关闭</p></div></div>
<script>
(()=>{const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');let tool='pen',color='#171713',drawing=false,start=null,snapshot=null,slideIndex=0,slides=[{image:null,undo:[],redo:[]}],cameraStream=null,recorder=null,chunks=[];
const fit=()=>{const old=canvas.width?canvas.toDataURL():null,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineJoin='round';if(old){const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,w,h);im.src=old}};fit();addEventListener('resize',fit);
const state=()=>canvas.toDataURL(), push=()=>{slides[slideIndex].undo.push(state());slides[slideIndex].redo=[];document.querySelector('#hint').style.display='none'}, restore=url=>{ctx.clearRect(0,0,canvas.width,canvas.height);if(!url)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=url};
const pos=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}};
const down=e=>{e.preventDefault();if(tool==='select')return;start=pos(e);snapshot=state();if(tool==='text'){const t=prompt('输入文字');if(t){push();ctx.fillStyle=color;ctx.font='28px Georgia,serif';ctx.fillText(t,start.x,start.y)}return}drawing=true;if(tool==='pen'){push();ctx.beginPath();ctx.moveTo(start.x,start.y)}};
const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=3;if(tool==='pen'){ctx.lineTo(p.x,p.y);ctx.stroke()}else{restore(snapshot);setTimeout(()=>{ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();if(tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}if(tool==='rect')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);if(tool==='circle'){const rx=(p.x-start.x)/2,ry=(p.y-start.y)/2;ctx.ellipse(start.x+rx,start.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2)}ctx.stroke()},0)}};
const up=()=>{if(drawing&&tool!=='pen'){slides[slideIndex].undo.push(snapshot);slides[slideIndex].redo=[];document.querySelector('#hint').style.display='none'}drawing=false};canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);addEventListener('pointerup',up);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#color').oninput=e=>color=e.target.value;
document.querySelector('#undo').onclick=()=>{const s=slides[slideIndex];if(!s.undo.length)return;s.redo.push(state());restore(s.undo.pop())};document.querySelector('#redo').onclick=()=>{const s=slides[slideIndex];if(!s.redo.length)return;s.undo.push(state());restore(s.redo.pop())};document.querySelector('#clear').onclick=()=>{push();ctx.clearRect(0,0,canvas.width,canvas.height);document.querySelector('#hint').style.display='grid'};
const renderSlides=()=>{document.querySelectorAll('.slide').forEach(b=>b.remove());slides.forEach((_,i)=>{const b=document.createElement('button');b.className='slide'+(i===slideIndex?' active':'');b.textContent=i+1;b.onclick=()=>switchSlide(i);document.querySelector('#slides').insertBefore(b,document.querySelector('#addSlide'))})};const switchSlide=i=>{slides[slideIndex].image=state();slideIndex=i;restore(slides[i].image);renderSlides()};document.querySelector('#addSlide').onclick=()=>{slides[slideIndex].image=state();slides.push({image:null,undo:[],redo:[]});switchSlide(slides.length-1)};
const cam=document.querySelector('#camera');document.querySelector('#cameraBtn').onclick=async()=>{if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;cam.classList.remove('show');return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});cam.srcObject=cameraStream;cam.classList.add('show');document.querySelector('#cameraBtn').textContent='关闭摄像头'}catch(e){alert('无法访问摄像头，请检查浏览器权限。')}};
const panel=document.querySelector('#scriptPanel'),tele=document.querySelector('#tele');document.querySelector('#scriptBtn').onclick=()=>panel.classList.add('open');document.querySelector('#closePanel').onclick=()=>panel.classList.remove('open');document.querySelector('#showScript').onclick=()=>{tele.textContent=document.querySelector('#script').value||'请先输入讲稿';tele.classList.add('show');panel.classList.remove('open')};document.querySelector('#hideScript').onclick=()=>tele.classList.remove('show');
const settings=document.querySelector('#settingsPanel'),frame=document.querySelector('.slide-frame');document.querySelector('#settingsBtn').onclick=()=>settings.classList.add('open');document.querySelector('#closeSettings').onclick=()=>settings.classList.remove('open');document.querySelectorAll('.ratio').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ratio').forEach(x=>x.classList.toggle('active',x===b));frame.style.aspectRatio=b.dataset.ratio;setTimeout(fit,80)});
let zoom=100;const setZoom=n=>{zoom=Math.max(50,Math.min(140,n));frame.style.scale=zoom/100;document.querySelector('#zoomValue').textContent=zoom+'%'};document.querySelector('#zoomOut').onclick=()=>setZoom(zoom-10);document.querySelector('#zoomIn').onclick=()=>setZoom(zoom+10);document.querySelector('#helpBtn').onclick=()=>document.querySelector('#welcome').classList.remove('hide');
const welcome=document.querySelector('#welcome'),closeWelcome=()=>{welcome.classList.add('hide');localStorage.setItem('rhino-whiteboard-welcomed','1')};document.querySelector('#welcomeGo').onclick=closeWelcome;welcome.onclick=e=>{if(e.target===welcome)closeWelcome()};addEventListener('keydown',e=>{if(e.key==='Escape'){closeWelcome();panel.classList.remove('open');settings.classList.remove('open')}});if(localStorage.getItem('rhino-whiteboard-welcomed'))welcome.classList.add('hide');
document.querySelector('#recordBtn').onclick=async function(){if(recorder&&recorder.state==='recording'){recorder.stop();this.textContent='● 录制';this.classList.remove('recording');return}try{const screen=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}),mic=await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>null),tracks=[...screen.getVideoTracks(),...screen.getAudioTracks(),...(mic?mic.getAudioTracks():[])];recorder=new MediaRecorder(new MediaStream(tracks),{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm'});chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{tracks.forEach(t=>t.stop());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='rhino-whiteboard-'+new Date().toISOString().slice(0,19).replaceAll(':','-')+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};screen.getVideoTracks()[0].onended=()=>recorder.state==='recording'&&recorder.stop();recorder.start(1000);this.textContent='■ 停止';this.classList.add('recording')}catch(e){alert('录制未开始。请选择要分享的屏幕，并允许麦克风权限。')}};
})();
</script>
</body></html>
